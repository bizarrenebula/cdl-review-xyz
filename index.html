 хорошо"],"a":"То, как развиваются профессия и цели вашего отца, вашей тёщи или свекрови, а также двоюродных братьев и сестёр по материнской линии, — это то, как развивается ваша любовная и партнёрская жизнь.","i":"То, как развиваются цель и ответственность совместного хорошего самочувствия, — это то, как развивается ваша любовная и партнёрская жизнь.","b":"Функциональная способность кожных и костных каркасов, коленей, суставов и зубов у вашего отца, вашей тёщи или свекрови, а также двоюродных братьев и сестёр по материнской линии отражает вашу любовную и партнёрскую жизнь (функциональную способность ваших почек, мочевых пузырей и поясничных областей).","s":["Чем больше человек берёт на себя ответственность","за обнаружение и отстаивание собственных прав","по отношению к жизни","за развитие собственных целей","за следование своему призванию","тем больше развиваются","способность устанавливать контакты","способность к встречам","способность быть партнёром","способность к компромиссу","способность принимать решения","способность поддерживать мир","художественные способности"]},"8-10":{"m":["Любовь — это совместное стремление быть счастливыми"],"a":"То, как развиваются стремления к реформам и совместные начинания ваших родственников и родственниц по браку, а также братьев и сестёр ваших спутников жизни, — это то, как развивается ваша любовная и партнёрская жизнь.","i":"То, как развиваются стремления к реформам и совместные начинания, направленные на улучшение ваших жизненных условий, — это то, как развивается ваша любовная и партнёрская жизнь.","b":"Функциональная способность голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга у ваших родственников и родственниц по браку, а также у братьев и сестёр ваших спутников жизни отражает вашу любовную и партнёрскую жизнь (функциональную способность ваших почек, мочевых пузырей и поясничных областей).","s":["Чем больше человек развивает способность участвовать в принятии решений","продолжать учиться","быть терпимым","развивать себя и делать себя счастливее","что-либо улучшать и оптимально организовывать","тем больше развиваются","способность устанавливать контакты","способность к встречам","способность быть партнёром","способность к компромиссу","способность принимать решения","способность поддерживать мир","художественные способности"]},"7-11":{"m":["Любовь — это тайна того, как отважиться сделать шаг","взять на себя обязательства"],"a":"То, как развиваются осуществление мечтаний и ощущение счастья ваших бывших партнёров, — это то, как развивается ваша любовная и партнёрская жизнь.","i":"То, как развиваются осуществление мечтаний и ощущение счастья применительно к вашему совместному образу жизни, — это то, как развивается ваша любовная и партнёрская жизнь.","b":"Функциональная способность стоп, шишковидной железы и солнечного сплетения у ваших бывших партнёров отражает вашу любовную и партнёрскую жизнь (функциональную способность ваших почек, мочевых пузырей и поясничных областей).","s":["Чем больше человек развивает способность осуществлять собственные представления и мечты","разрабатывать собственные планы и концепции","идти собственным путём","вступать в отношения","обретать власть над собой","освобождаться от принуждений","тем больше развиваются","способность устанавливать контакты","способность к встречам","способность быть партнёром","способность к компромиссу","способность принимать решения","способность поддерживать мир","художественные способности","Пример одной клиентки: «5 из 3 = 7-й жизненный принцип»","Сестра моей клиентки (3-й жизненный принцип) внезапно забеременела. Это значит, что в её 7-м жизненном принципе она встретит кого-то, в кого внезапно влюбится. Для неё дети её братьев и сестёр относятся к её 7-му жизненному принципу. И [действительно](http://www.google.de/url?sa=t&source=web&cd=3&ved=0CC0QFjAC&url=http%3A%2F%2Fwww.dict2.de%2Fuebersetzen%2Fdeutsch-englisch%2Ftats%25E4tzlich%2C494289.html&ei=3X5mTfblEIrLswatlsXaDA&usg=AFQjCNFm96rd_VsevvgAyf5ain3O5EhcIQ), она влюбилась. Развитие этого партнёрства отражается в состоянии здоровья родившегося ребёнка её сестры. Если бы у этой женщины был партнёр, в её жизни возникли бы новые контакты.","В этом случае нужно также выяснить, желанен ли этот ребёнок для обеих сторон или только для одной стороны. Таким же образом можно принимать решения о новом партнёрстве. Если ребёнок развивается здоровым, то и новое партнёрство развивается здоровым."]},"7-0":{"m":["Реализовывать собственные концепции означает,","иметь мужество идти собственным путём"],"a":"То, как развивается способность ваших бывших партнёров отстаивать себя, — это то, как развиваются ваши отношения и планы.","i":"То, как развивается отстаивание вашего собственного мнения, — это то, как развиваются ваши отношения и планы.","b":"Функционирование головы, желчного пузыря и мышц ваших бывших партнёров отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек берёт на себя инициативу идти собственным путём,","тем больше развивается","исполнение твоих желаний","собственные планы и концепции","вступать в отношения","обретать власть над собой","изменяться","освобождение от принуждений"]},"6-1":{"m":["Реализовывать собственные концепции означает,","устанавливать собственные границы в партнёрстве"],"a":"То, как развивается обращение с финансами ваших партнёров по жизни и детей ваших братьев, сестёр и соседей, — это то, как развиваются ваши отношения и планы.","i":"То, как развивается ценность вашей способности к партнёрству, — это то, как развиваются ваши отношения и планы.","b":"Функционирование шеи/горла, миндалин, желёз и вен ваших партнёров по жизни и детей ваших братьев, сестёр и соседей отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек развивает свою способность устанавливать границы и получать удовольствие в","контактах","встречах","партнёрстве","решениях","художественной способности","тем больше развивается","исполнение ваших желаний","собственные планы и концепции","идти собственным путём","вступать в отношения","обретать власть над собой","освобождение от принуждений"]},"5-2":{"m":["Реализовывать собственные концепции означает,","обретать удовлетворение в работе благодаря собственным ремесленным навыкам"],"a":"То, как развивается способность к коммуникации у ваших дядей и тёть по материнской линии, — это то, как развиваются ваши отношения и планы.","i":"То, как развивается способность к коммуникации в ваших трудовых отношениях и повседневной жизни, — это то, как развиваются ваши отношения и планы.","b":"Функционирование лёгких, кистей рук, органов речи и слуха ваших дядей и тёть по материнской линии отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек развивает способность к обучению применительно к","обретению удовлетворения в работе","нахождению собственных методов работы","выражению собственных чувств","самокритике","тем больше развивается","исполнение ваших желаний","собственные планы и концепции","вступать в отношения","обретать власть над собой","освобождение от принуждений"]},"4-3":{"m":["Реализовывать собственные концепции означает,","развивать уверенность в собственной способности действовать"],"a":"То, как развивается ощущение благополучия у ваших детей и партнёров по жизни ваших друзей, — это то, как развиваются ваши отношения и планы.","i":"То, как развивается уверенность в вашей способности действовать и самостоятельности, — это то, как развиваются ваши отношения и планы.","b":"Функционирование груди, желудка и слизистых оболочек ваших детей и партнёров по жизни ваших друзей отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек развивает уверенность","в способности к управлению","в творческих способностях","в способности играть и веселиться","в способности к самореализации","тем больше развивается","исполнение ваших желаний","собственные планы и концепции","вступать в отношения","обретать власть над собой","изменяться","освобождение от принуждений"]},"3-4":{"m":["Реализовывать собственные концепции означает,","быть распорядителем собственной благополучной жизни"],"a":"То, как развиваются самореализация и способность действовать у вашей матери, двоюродных братьев и сестёр по отцовской линии и отца вашего супруга или супруги, — это то, как развиваются ваши отношения и планы.","i":"То, как развивается готовность действовать в том, что касается вашего ощущения благополучия, — это то, как развиваются ваши отношения и планы.","b":"Функционирование сердца, кровообращения и позвонков позвоночника с 5-го по 9-й у вашей матери, отца вашего супруга или супруги и ваших двоюродных братьев и сестёр по отцовской линии отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек развивает самостоятельность и готовность действовать","дарить и принимать нежность и душевную любовь","создавать и дарить чувство защищённости","слышать голос жизни (собственной природы)","принимать и признавать других людей","тем больше развивается","исполнение ваших желаний","собственные планы и концепции","вступать в отношения","обретать власть над собой","изменяться","освобождение от принуждений"]},"2-5":{"m":["Реализовывать собственные концепции означает,","развивать собственные методы работы для собственных ремесленных навыков"],"a":"То, как развиваются трудовые отношения ваших братьев и сестёр, соседей и детей ваших друзей, — это то, как развиваются ваши отношения и планы.","i":"То, как развивается работа над улучшением партнёрства, — это то, как развиваются ваши отношения и планы.","b":"Функционирование органов пищеварения и кишечника ваших братьев и сестёр, соседей и детей ваших друзей отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек развивает аналитические способности в","коммуникации","получении и передаче информации","ремесленных навыках","способности к обучению","тем больше развивается","собственные планы и концепции","вступать в отношения","обретать власть над собой","изменяться","освобождение от принуждений"]},"8-0":{"m":["Способствовать собственному развитию и делать себя счастливым — значит проявлять инициативу, чтобы улучшить жизненные условия"],"a":"То, как развивается способность отстаивать себя у ваших родственников по браку мужского и женского пола, а также у братьев и сестёр ваших жизненных партнёров, — это то, как развивается состояние счастья и успешности.","i":"То, как развивается способность отстаивать себя в улучшении чего-либо и его оптимальной организации, — это то, как развивается состояние счастья и успешности.","b":"Функциональность головы, желчного пузыря и мышц ваших родственников по браку мужского и женского пола, а также братьев и сестёр ваших жизненных партнёров отражает состояние счастья и успешности (функциональность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек проявляет инициативу, чтобы способствовать собственному развитию и делать себя счастливым,","тем больше развиваются","смысл и успех того, как вы отстаиваете себя,","обретение понимания,","дальнейшее обучение,","терпимость,","собственная жизненная философия,","нахождение своего смысла в мире,","улучшение чего-либо и его оптимальная организация"]},"7-1":{"m":["Способствовать собственному развитию и делать себя счастливым — значит","развивать собственные экономические способности в отношениях"],"a":"То, как развивается обращение с финансами ваших бывших партнёров, — это то, как развивается состояние счастья и успешности.","i":"То, как развиваются экономические способности применительно к вашим планам и взаимоотношениям, — это то, как развивается состояние счастья и успешности.","b":"Функциональность шеи, миндалин, желёз и вен ваших бывших партнёров отражает состояние счастья и успешности (функциональность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек придаёт значение тому, чтобы","разрабатывать собственные планы и концепции,","идти собственным путём,","вступать в отношения,","обретать власть над собой,","освобождаться от принуждения,","тем больше развиваются","обретение понимания,","дальнейшее обучение,","терпимость,","развитие собственной жизненной философии,","нахождение своего смысла в мире,","улучшение чего-либо и его оптимальная организация"]},"6-2":{"m":["Способствовать собственному развитию и делать себя счастливым — значит","находить общий смысл в партнёрстве"],"a":"То, как развиваются коммуникативные и ремесленные способности ваших жизненных партнёров, а также детей ваших братьев, сестёр и соседей, — это то, как развивается состояние счастья и успешности.","i":"То, как развивается коммуникативная способность в вашем партнёрстве, — это то, как развивается состояние счастья и успешности.","b":"Функциональность лёгких, рук, органов речи и слуха ваших жизненных партнёров, а также детей ваших братьев, сестёр и соседей отражает состояние счастья и успешности (функциональность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек развивает умение учиться в области","способности устанавливать контакты и встречаться с людьми,","способности к партнёрству,","способности к компромиссу,","способности принимать решения,","способности к миру,","художественных способностей,","тем больше развиваются","обретение понимания,","дальнейшее обучение,","терпимость,","нахождение своего смысла в мире,","улучшение чего-либо и его оптимальная организация"]},"5-3":{"m":["Способствовать собственному развитию и делать себя счастливым — значит заботиться о своём благополучии в повседневной жизни и на рабочем месте"],"a":"То, как развиваются семейная жизнь и жилищные условия ваших дядей и тёть по материнской линии, — это то, как развивается состояние счастья и успешности.","i":"То, как развивается ощущение благополучия на вашем рабочем месте и в повседневной жизни, — это то, как развивается состояние счастья и успешности.","b":"Функциональность груди, желудка и слизистых оболочек ваших дядей и тёть по материнской линии отражает состояние счастья и успешности (функциональность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек развивает уверенность в своей способности","находить удовлетворение в работе,","находить собственные методы работы,","анализировать","и выражать собственные чувства,","тем больше развивается способность","у вас отстаивать себя, а также смысл и успех этого,","обретать понимание,","проявлять терпимость,","развивать собственную жизненную философию,","улучшать что-либо и оптимально организовывать это"]},"4-4":{"m":["Способствовать собственному развитию и делать себя счастливым — значит","играть и получать удовольствие от самореализации"],"a":"То, как развиваются самореализация и способность действовать у ваших детей и жизненных партнёров ваших друзей, — это то, как развивается состояние счастья и успешности.","i":"То, как развивается способность действовать применительно к вашей самореализации, творчеству и сексуальности, — это то, как развивается состояние счастья и успешности.","b":"Функциональность сердца, кровообращения и позвонков позвоночника с 5-го по 9-й у ваших детей и жизненных партнёров ваших друзей отражает состояние счастья и успешности (функциональность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек развивает самостоятельность и готовность действовать в","способности к управлению,","естественном отношении к сексуальности,","творческой способности,","способности играть и получать удовольствие,","способности к самореализации,","тем больше развивается способность","у вас отстаивать себя, а также смысл и успех этого,","обретать понимание,","проявлять терпимость,","находить свой смысл в мире,","улучшать что-либо и оптимально организовывать это"]},"3-5":{"m":["Способствовать собственному развитию и делать себя счастливым — значит","найти рабочее место, на котором человек чувствует себя комфортно"],"a":"То, как развиваются условия работы и повседневная жизнь вашей матери, двоюродных братьев и сестёр по отцовской линии, а также вашего свёкра, — это то, как развивается состояние счастья и успешности.","i":"То, как в вашей семье развиваются работа и организация повседневной жизни, — это то, как развивается состояние счастья и успешности.","b":"Функциональность органов пищеварения и кишечника вашей матери, вашего свёкра, а также ваших двоюродных братьев и сестёр по отцовской линии отражает состояние счастья и успешности (функциональность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек развивает заботливость,","создавая и передавая чувство защищённости,","сопереживая другим,","слыша голос жизни (собственной природы),","принимая других людей и относясь к ним с принятием,","тем больше развивается способность","у вас отстаивать себя, а также смысл и успех этого,","обретать понимание,","проявлять терпимость,","находить свой смысл в мире,","улучшать что-либо и оптимально организовывать это"]},"1-6":{"m":["Осуществлять собственные концепции означает,","обеспечивать себе собственное пространство в партнёрских отношениях"],"a":"То, каким образом развивается приятная сторона жизни семьи ваших друзей, есть то, каким образом развиваются ваши отношения и планы.","i":"То, каким образом развивается решительность наслаждаться жизнью, есть то, каким образом развиваются ваши отношения и планы.","b":"Функционирование почек, мочевых пузырей и поясничных областей матерей и отцов супругов ваших друзей отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек развивает решительность","в установлении границ","в экономических способностях","в обеспечении собственной защищённости","в наслаждении","создавать себе собственное пространство","тем больше развивается","собственные планы и концепции","вступать в отношения","обретат ","тем больше развивается","исполнение ваших желаний","собственные планы и концепции","вступать в отношения","обретать власть над собой"]},"10-9":{"m":["Осуществлять собственные концепции означает,","брать на себя ответственность при участии в принятии решений"],"a":"То, каким образом развиваются профессии и цели ваших друзей и спутников жизни ваших детей, есть то, каким образом развиваются ваши отношения и планы.","i":"То, каким образом развиваются цели и ответственность в связи с вашим участием в принятии решений и в совместных начинаниях, есть то, каким образом развиваются ваши отношения и планы.","b":"Функционирование кожных и костных структур, коленей, суставов и зубов ваших друзей и спутников жизни ваших детей отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек берёт на себя ответственность","на пути к свободе и независимости","за собственные изменения","за организацию досуга","за совместные начинания","за обеспечение разнообразия","за использование возможностей","тем больше развивается","исполнение ваших желаний","собственные планы и концепции","вступать в отношения","обретать власть над собой","освобождение от принуждений"]},"9-10":{"m":["Осуществлять собственные концепции означает,","независимо преследовать собственные цели"],"a":"То, каким образом развиваются стремления к реформам и участие в принятии решений вашего отца, вашей свекрови и двоюродных братьев и сестёр по материнской линии, есть то, каким образом развиваются ваши отношения и планы.","i":"То, каким образом развиваются стремления к реформам и участие в принятии решений относительно ваших целей, есть то, каким образом развиваются ваши отношения и планы.","b":"Функционирование голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга вашего отца, вашей свекрови и двоюродных братьев и сестёр по материнской линии отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек развивает способность к свободе и независимости в","открытии и отстаивании собственных прав","отношении к жизни","развитии собственных целей","восприятии своего призвания","стабильности, непрерывности и выносливости","тем больше развивается","исполнение ваших желаний","собственные планы и концепции","вступать в отношения","обретать власть над собой","освобождение от принуждений"]},"8-11":{"m":["Осуществлять собственные концепции означает разрабатывать альтернативы для поддержки собственного развития и обретения счастья"],"a":"То, каким образом развиваются осуществление мечтаний и ощущение счастья ваших родственников по браку мужского и женского пола, а также братьев и сестёр ваших спутников жизни, есть то, каким образом развиваются ваши отношения и планы.","i":"То, каким образом развиваются альтернативы и ощущение счастья в связи с улучшением вашей жизни, есть то, каким образом развиваются ваши отношения и планы.","b":"Функционирование стоп, шишковидной железы и солнечного сплетения ваших родственников по браку мужского и женского пола, а также братьев и сестёр ваших спутников жизни отражает ваши отношения и планы (функционирование ваших половых и выделительных органов).","s":["Чем больше человек разрабатывает альтернативы","обретать понимание","продолжать учиться","двигаться к терпимости","способствовать собственному развитию и осчастливливать себя","что-либо улучшать и придавать этому оптимальную форму","тем больше развивается","исполнение ваших желаний","собственные планы и концепции","вступать в отношения","обретать власть над собой","преображаться","освобождение от принуждений"]},"2-6":{"m":["Способствовать собственному развитию и приносить себе счастье — значит","развивать общение, исполненное любви"],"a":"То, как развиваются партнёрские отношения ваших братьев и сестёр, соседей и детей ваших друзей, — это то, как развиваются счастье и успех.","i":"То, как развивается ваше выражение любви, — это то, как развиваются счастье и успех.","b":"Функциональная способность почек, мочевых пузырей и поясничных областей ваших братьев и сестёр, соседей и детей ваших друзей отражает счастье и успех (функциональную способность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек развивает решительность в принятии решений","в улучшении партнёрских отношений","в общении","в ремесленных навыках","в способности к обучению","тем больше развивается способность","к вашему отстаиванию себя, его смыслу и успеху","обретать понимание","к терпимости","находить свой смысл в мире","что-либо улучшать и оптимально выстраивать"]},"1-7":{"m":["Способствовать собственному развитию и приносить себе счастье — значит","идти собственным путём, чтобы наслаждаться жизнью"],"a":"То, как развиваются планы семьи ваших друзей, — это то, как развиваются счастье и успех.","i":"То, как развиваются планы относительно ваших финансов, — это то, как развиваются счастье и успех.","b":"Функциональная способность половых и выделительных органов матерей и отцов супругов ваших друзей отражает счастье и успех (функциональную способность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек идёт собственным путём и формирует собственное мнение","в разграничении","в экономических способностях","в обеспечении собственной защищённости","в наслаждении","создавать себе собственное пространство","тем больше развивается способность","к вашему отстаиванию себя, его смыслу и успеху","обретать понимание","к терпимости","находить свой смысл в мире","что-либо улучшать и оптимально выстраивать"]},"0-8":{"m":["Способствовать собственному развитию и приносить себе счастье — значит","улучшать способность отстаивать себя"],"a":"То, как развивается успех братьев, сестёр и соседей ваших друзей, — это то, как развиваются счастье и успех.","i":"То, как развивается улучшение вашей способности отстаивать себя, — это то, как развиваются счастье и успех.","b":"Функциональная способность бёдер, функция питания (рост в толщину) и печень братьев, сестёр и соседей ваших друзей отражают счастье и успех (функциональную способность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек продолжает учиться и развивает себя","в способности проявлять инициативу","в способности отстаивать себя","в способности осмелиться на что-либо","в реализации естественных телесных влечений","в спортивных способностях.","тем больше развивается способность к","вашему отстаиванию себя, его смыслу и успеху","обретению понимания","терпимости","нахождению своего смысла в мире","улучшению чего-либо и его оптимальному формированию"]},"11-9":{"m":["Способствовать собственному развитию и приносить себе счастье — значит","брать на себя ответственность,","воплощать собственные мечты"],"a":"То, как развиваются цели и профессия ваших дядей и тётей по отцовской линии, — это то, как развиваются счастье и успех.","i":"То, как развиваются цели и ответственность за воплощение собственных мечт, — это то, как развиваются счастье и успех.","b":"Функциональная способность кожных и костных структур, коленей, суставов и зубов ваших дядей и тётей по отцовской линии отражает счастье и успех (функциональную способность ваших бёдер, функцию питания, рост в толщину и печень).","s":["Чем больше человек берёт на себя ответственность","за воплощение собственных мечт","выявлять и анализировать подоплёку","разрабатывать альтернативы","выражать собственные права и собственную ответственность","тем больше получают развитие","смысл и успех вашего отстаивания себя","обретение понимания","терпимость","поиск своего смысла в мире","улучшение чего-либо и его оптимальное формирование"]},"10-10":{"m":["Способствовать собственному развитию и приносить себе счастье — значит участвовать в принятии решений во время совместных игр и развлечений"],"a":"То, как развиваются стремления к реформам и совместные начинания ваших друзей и жизненных партнёров ваших детей, — это то, как развиваются счастье и успех.","i":"То, как развивается участие в принятии реше рживать дружеские отношения","к совместным мероприятиям","пользоваться возможностями"]},"9-1":{"m":["Стать внутренне более свободным и независимым означает,","развить способность устанавливать границы в совместной жизни"],"a":"То, как развивается обращение с финансами вашего отца, двоюродных братьев и сестёр по материнской линии и матери вашего супруга или супруги, — это то, как развиваются организация вашего досуга и совместные мероприятия.","i":"То, как развивается ценность вашей профессии и ваших целей, — это то, как развиваются организация вашего досуга и совместные мероприятия.","b":"Функциональное состояние шеи, миндалин, желёз и вен вашего отца, матери вашего супруга или супруги и двоюродных братьев и сестёр по материнской линии отражает организацию вашего досуга и совместные мероприятия (функциональное состояние ваших голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга).","s":["Чем больше человек придаёт значение тому,","чтобы открывать для себя собственные права и отстаивать себя,","чтобы нести ответственность перед жизнью,","чтобы развивать собственные цели,","чтобы осознавать своё призвание,","тем больше развивается способность","к свободе и независимости","меняться","организовывать досуг","поддерживать дружеские отношения","к совместным мероприятиям","пользоваться возможностями"]},"8-2":{"m":["Стать внутренне более свободным и независимым означает,","учиться расширять собственный кругозор"],"a":"То, как развивается способность к общению у ваших братьев и сестёр по браку, а также у братьев и сестёр ваших партнёров по жизни, — это то, как развиваются организация вашего досуга и совместные мероприятия.","i":"То, как развивается способность учиться улучшать вашу жизнь, — это то, как развиваются организация вашего досуга и совместные мероприятия.","b":"Функциональное состояние лёгких, кистей рук, органов речи и слуха ваших братьев и сестёр по браку, а также братьев и сестёр ваших партнёров по жизни отражает организацию вашего досуга и совместные мероприятия (функциональное состояние ваших голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга).","s":["Чем больше человек развивает способность учиться","и продолжать своё образование,","быть терпимым,","развивать себя и делать себя счастливым,","находить свой смысл в мире,","улучшать что-либо и придавать ему оптимальную форму,","тем больше развивается способность","к свободе и независимости","меняться","организовывать досуг","поддерживать дружеские отношения","к совместным мероприятиям","пользоваться возможностями"]},"7-3":{"m":["Стать внутренне более свободным и независимым означает,","заботиться о собственном благополучии в отношениях"],"a":"То, как развиваются ощущение благополучия, семейная жизнь и жилищные условия ваших бывших партнёров, — это то, как развиваются организация вашего досуга и совместные мероприятия.","i":"То, как развиваются ощущение благополучия в ваших отношениях и совместный образ жизни, — это то, как развиваются организация вашего досуга и совместные мероприятия.","b":"Функциональное состояние груди, желудка и слизистых оболочек ваших бывших партнёров отражает организацию вашего досуга и совместные мероприятия (функциональное состояние ваших голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга).","s":["Чем больше человек развивает в себе уверенность","в способности составить собственную жизненную программу и жить по ней,","разрабатывать собственные планы и концепции,","идти собственным путём,","вступать в отношения,","обретать контроль над собой,","освобождаться от ограничений,","тем больше развивается способность","к свободе и независимости","меняться","организовывать досуг","к совместным мероприятиям","пользоваться возможностями"]},"6-4":{"m":["Стать внутренне более свободным и независимым означает,","самостоятельно принимать решения"],"a":"То, как развивается самореализация вашего партнёра по жизни, детей ваших братьев и сестёр, а также детей ваших соседей, — это то, как развиваются организация вашего досуга и совместные мероприятия.","i":"То, как развивается способность действовать в вашем партнёрстве, — это то, как развиваются организация вашего досуга и совместные мероприятия.","b":"Функциональное состояние сердца, кровообращения и позвонков позвоночника с 5-го по 9-й у ваших партнёров по жизни, детей ваших братьев и сестёр, а также детей ваших соседей отражает организацию вашего досуга и совместные мероприятия (функциональное состояние ваших голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга).","s":["Чем больше человек развивает готовность действовать в следующих областях:","способности к партнёрству,","способности к компромиссу,","способности принимать решения,","миролюбия,","художественных способностей,","тем больше развивается способность","к свободе и независимости","меняться","организовывать досуг","поддерживать дружеские отношения","к совместным мероприятиям","пользоваться возможностями"]},"5-5":{"m":["Стать внутренне более свободным и независимым означает,","развивать выражение собственных чувств"],"a":"То, как развиваются условия труда ваших дядей и тёть по материнской линии, — это то, как развиваются организация вашего досуга и совместные мероприятия.","i":"То, как развиваются ваши собственные методы работы применительно к работе и организации повседневной жизни, — это то, как развиваются организация вашего досуга и совместные мероприятия.","b":"Функциональное состояние органов пищеварения и кишечника ваших дядей и тёть по материнской линии отражает организацию вашего досуга и совместные мероприятия (функциональное состояние ваших голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга).","s":["Чем больше человек разрабатывает способы","находить удовлетворение в работе,","находить собственные методы работы,","анализировать,","выражать собственные чувства,","критиковать себя,","тем больше развивается способность","к свободе и независимости","меняться","организовывать досуг","поддерживать дружеские отношения","к совместным мероприятиям","пользоваться возможностями"]},"4-6":{"m":["Стать внутренне более свободным и независимым означает,","принимать собственные решения в самореализации"],"a":"То, как развиваются партнёрские отношения и контакты ваших детей и партнёров ваших друзей, — это то, как развиваются организация вашего досуга и совместные начинания.","i":"То, как развивается решительность в принятии решений относительно вашей самореализации и самостоятельности, — это то, как развиваются организация вашего досуга и совместные начинания.","b":"Функционирование почек, мочевых пузырей и поясниц ваших детей и жизненных партнёров ваших друзей отражает организацию вашего досуга и совместные начинания (функционирование ваших голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга).","s":["Чем больше человек развивает решительность в принятии решений в","способности к управлению","естественном отношении к сексуальности","творческой способности","способности играть и веселиться","способности реализовать себя","тем больше развивается способность","к свободе и независимости","меняться","организовывать досуг","к совместным начинаниям","использовать возможности"]},"3-7":{"m":["Стать внутренне более свободным и независимым означает,","заботиться о своём благополучии в отношениях","«Подавляешь свою эмоциональную жизнь —","и свобода тебе тоже ничего не даст».","Добрин М. Антонов"],"a":"То, как развиваются планы вашей матери, двоюродных братьев и сестёр по отцовской линии и вашего свёкра, — это то, как развиваются организация вашего досуга и совместные начинания.","i":"То, как развиваются собственные планы относительно вашего ощущения благополучия и вашей семьи, — это то, как развиваются организация вашего досуга и совместные начинания.","b":"Функционирование половых и выделительных органов вашей матери, вашего свёкра, ваших двоюродных братьев и сестёр по отцовской линии отражает организацию вашего досуга и совместные начинания (функционирование ваших голеней, икр, пульса и дыхания, мозговых о т.","i":"То, как развивается уверенность в том, что они могут способствовать собственному развитию и делать себя счастливыми, — это то, как развиваются ваше чувство счастья и осуществление ваших мечт.","b":"Функционирование груди, желудка и слизистых оболочек ваших братьев и сестёр по браку, а также братьев и сестёр ваших партнёров по жизни отражает ваше чувство счастья и осуществление ваших мечт (функционирование ваших стоп, шишковидной железы и солнечного сплетения).","s":["Чем больше человек развивает доверие","продолжать образование","способствовать собственному развитию и делать себя счастливым","находить свой смысл в мире","что-либо улучшать и оптимально оформлять","тем больше развивается способность","к улучшению семейных и жилищных условий","развивать воображение и осуществлять мечты","выявлять скрытые причины","развивать альтернативы","выражать собственные права и собственную ответственность"]},"7-4":{"m":["Осуществлять мечты — значит,","самостоятельно идти собственным путём"],"a":"То, как развивается самореализация ваших бывших партнёров, — это то, как развиваются ваше чувство счастья и осуществление ваших мечт.","i":"То, как развивается способность действовать в ваших отношениях и в рамках общего образа жизни, — это то, как развиваются ваше чувство счастья и осуществление ваших мечт.","b":"Функционирование сердца, кровообращения и позвонков с 5-го по 9-й у ваших бывших партнёров отражает ваше чувство счастья и осуществление ваших мечт (функционирование ваших стоп, шишковидной железы и солнечного сплетения).","s":["Чем больше человек развивает самостоятельность и готовность к действию в отношении","разработки собственных планов и концепций","следования собственным путём","вступления в отношения","обретения власти над собой","освобождения от принуждений","тем больше развивается способность","к улучшению семейных и жилищных условий","развивать воображение и осуществлять мечты","выявлять скрытые причины","развивать альтернативы","выражать собственные права и е и концепции","да върви по собствен път","да влиза във връзки","да придобива власт над себе си","да се освобождава от принуди","толкова повече се развива","способността за контакт","способността за срещи","способността за партньорство","способността за компромис","способността за вземане на решения","способността за мир","артистичните способности","Примерът с клиентка от 5 от 3 = 7-и жизнен принцип","Сестрата на моята клиентка (3-ти жизнен принцип) внезапно е забременяла. Това означава, че във Вашия 7-и жизнен принцип тя ще срещне някого, в когото внезапно ще се влюби. За Вас децата на Вашите братя и сестри попадат във Вашия 7-и жизнен принцип. И [действително](http://www.google.de/url?sa=t&source=web&cd=3&ved=0CC0QFjAC&url=http%3A%2F%2Fwww.dict2.de%2Fuebersetzen%2Fdeutsch-englisch%2Ftats%25E4tzlich%2C494289.html&ei=3X5mTfblEIrLswatlsXaDA&usg=AFQjCNFm96rd_VsevvgAyf5ain3O5EhcIQ), тя се е влюбила. Развитието на това партньорство се отразява чрез здравословното състояние на роденото дете на сестра Ви. Ако тази жена беше имала партньор, в живота щяха да се развият нови контакти.","В този случай трябва също да се разгледа дали това дете е желано и от двете страни, или само от едната страна. По същия начин могат да се вземат решения относно новото партньорство. Ако детето се развива здравословно, новото партньорство също се развива здравословно."]},"1-6":{"m":["Да осъществяваш собствени концепции означава,","в партньорството да си осигуриш собствено пространство"],"a":"Начинът, по който се развива приятната страна на живота на семейството на вашите приятели, е начинът, по който се развиват вашата връзка и плановете ви.","i":"Начинът, по който се развива готовността да решиш да се наслаждаваш на живота, е начинът, по който се развиват вашата връзка и плановете ви.","b":"Функционирането на бъбреците, пикочните мехури и поясниците на майките и бащите на съпрузите или съпругите на вашите приятели отразява вашата връзка и плановете ви (функционирането на половите и отделителн
