<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script>
/* "Request Desktop Site" on a phone only swaps the user-agent — it leaves the
   layout viewport at device-width because of the meta above, so a width-based
   breakpoint never fires and the mobile view stays. Detect a touch device whose
   UA has dropped its "Mobile" token (i.e. desktop mode is on) and widen the
   viewport, so the >=900px PC layout activates and scales to the screen. Runs
   before first layout to avoid a mobile flash; harmless on real desktops
   (no touch) and on phones in normal mode (UA still says "Mobile"). */
(function () {
  try {
    var touch = (navigator.maxTouchPoints || 0) > 1;
    var desktopUA = !/Mobile/i.test(navigator.userAgent);
    var smallScreen = Math.min(screen.width, screen.height) < 820;
    if (touch && desktopUA && smallScreen) {
      var m = document.querySelector('meta[name=viewport]');
      if (m) m.setAttribute('content', 'width=1024');
    }
  } catch (e) {}
})();
</script>
<title>Der Code des Lebens — Rad der 12 Lebensprinzipien (Originaltexte)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  /* ====================================================================
     BLANK VERSION — flat black-on-white.
     All colour lives in these three tokens; the app is otherwise a
     line drawing (black strokes/text on white). Redesign colour by
     editing these and LP_COLORS in the script.
     ==================================================================== */
  :root {
    color-scheme: light;   /* render light even when the OS is in dark mode */
    --paper: #fff;   /* page + every surface */
    --ink:   #000;   /* text */
    --line:  #342b22; /* warm weathered charcoal: borders and strokes */
    --gold:  #b4872d; /* title and subtitle */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Spectral', Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---- language switch ---- */
  .lang-switch {
    position: fixed; top: .9rem; right: .9rem; z-index: 5;
    display: flex; gap: .3rem;
  }
  .lang-switch button {
    font-family: 'Spectral', serif;
    font-size: .72rem; letter-spacing: .12em;
    padding: .35em .7em;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2rem;
    color: var(--ink); cursor: pointer;
    transition: all .2s;
  }
  .lang-switch button.active,
  .lang-switch button:hover { background: var(--ink); color: var(--paper); border-color: var(--line); }

  .guide-help {
    position: fixed;
    top: .85rem; left: .9rem;
    z-index: 6;
    width: 2.15rem; height: 2.15rem;
    display: grid; place-items: center;
    border: 1px solid #c99a39;
    border-radius: 50%;
    background: rgba(4, 13, 34, .9);
    color: #f2cf78;
    font-family: 'Marcellus', serif;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 9px rgba(0, 0, 0, .28);
    transition: transform .18s ease, background .18s ease, color .18s ease;
  }
  .guide-help:hover, .guide-help:focus-visible {
    transform: scale(1.08);
    background: #f2cf78;
    color: #08142e;
    outline: none;
  }
  .guide-help.attention {
    animation: guide-pulse 1.4s ease-in-out infinite;
  }
  @keyframes guide-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(242, 207, 120, .62), 0 2px 9px rgba(0, 0, 0, .28); }
    50% { box-shadow: 0 0 0 9px rgba(242, 207, 120, 0), 0 2px 12px rgba(0, 0, 0, .4); }
  }
  .demo-balloon {
    position: fixed;
    left: 50%; top: 50%;
    z-index: 9;
    width: min(30rem, calc(100vw - 1rem));
    padding: .9rem 2.35rem .95rem 1.1rem;
    border: 0;
    border-radius: 7px;
    background: #fff2a8;
    color: #28230f;
    font-size: clamp(1rem, 2.1vw, 1.18rem);
    line-height: 1.45;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, calc(-100% - 18px));
    box-shadow: 0 5px 16px rgba(31, 25, 8, .24);
    transition: left .8s cubic-bezier(.2, .72, .2, 1), top .8s cubic-bezier(.2, .72, .2, 1), opacity .25s ease;
  }
  .demo-balloon::after {
    content: '';
    position: absolute;
    left: 50%; bottom: -12px;
    width: 24px; height: 24px;
    transform: translateX(-50%) rotate(45deg);
    background: #fff2a8;
    border: 0;
  }
  .demo-balloon.on {
    opacity: 1;
    pointer-events: auto;
    cursor: pointer;
  }
  .demo-balloon.on:hover, .demo-balloon.on:focus-visible {
    box-shadow: 0 7px 20px rgba(31, 25, 8, .3);
    outline: none;
  }
  .demo-balloon .continue {
    display: block;
    margin-top: .55rem;
    padding: 0;
    font-size: .68em;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #65551d;
    background: transparent;
    border: 0;
  }
  .balloon-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    margin: 0 1rem .42rem;
    color: #77651f;
    font-size: .61em;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .balloon-icon {
    font-size: 1.05em;
    line-height: 1;
  }
  .balloon-message {
    display: block;
    font-family: 'Spectral', Georgia, serif;
    font-size: 1em;
    font-weight: 600;
    line-height: 1.4;
  }
  .balloon-emphasis {
    padding: 0;
    background: transparent;
    border: 0;
    font-weight: 800;
  }
  .demo-balloon .tutorial-close {
    position: absolute;
    top: .22rem;
    right: .35rem;
    width: 1.65rem;
    height: 1.65rem;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #443b18;
    font: 700 1.25rem/1 'Spectral', serif;
    cursor: pointer;
  }
  .demo-balloon .tutorial-close:hover,
  .demo-balloon .tutorial-close:focus-visible {
    background: rgba(91, 77, 24, .1);
    outline: 1px solid #77651f;
    outline-offset: 1px;
  }
  .demo-balloon.insist { animation: balloon-insist .48s ease both; }
  @keyframes balloon-insist {
    0%, 100% { transform: translate(-50%, calc(-100% - 18px)) rotate(0); }
    20% { transform: translate(-50%, calc(-100% - 18px)) rotate(-2deg) scale(1.035); }
    40% { transform: translate(-50%, calc(-100% - 18px)) rotate(2deg) scale(1.035); }
    60% { transform: translate(-50%, calc(-100% - 18px)) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(-50%, calc(-100% - 18px)) rotate(1.5deg) scale(1.015); }
  }
  .demo-balloon.below { transform: translate(-50%, 18px); }
  .demo-balloon.below.insist { animation-name: balloon-insist-below; }
  @keyframes balloon-insist-below {
    0%, 100% { transform: translate(-50%, 18px) rotate(0); }
    20% { transform: translate(-50%, 18px) rotate(-2deg) scale(1.035); }
    40% { transform: translate(-50%, 18px) rotate(2deg) scale(1.035); }
    60% { transform: translate(-50%, 18px) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(-50%, 18px) rotate(1.5deg) scale(1.015); }
  }
  .demo-balloon.below::after {
    top: -12px; bottom: auto;
    border: 0;
  }
  .demo-balloon.right {
    width: min(30rem, calc(100vw - 4.5rem));
    transform: translate(18px, -50%);
  }
  .demo-balloon.right::after {
    left: -12px; right: auto;
    top: var(--arrow-top, 50%); bottom: auto;
    transform: translateY(-50%) rotate(45deg);
    border: 0;
  }
  .demo-balloon.right.insist { animation-name: balloon-insist-right; }
  @keyframes balloon-insist-right {
    0%, 100% { transform: translate(18px, -50%) rotate(0); }
    20% { transform: translate(18px, -50%) rotate(-2deg) scale(1.035); }
    40% { transform: translate(18px, -50%) rotate(2deg) scale(1.035); }
    60% { transform: translate(18px, -50%) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(18px, -50%) rotate(1.5deg) scale(1.015); }
  }
  header {
    position: relative;
    width: 100%;
    text-align: center;
    padding: 1.4rem 1rem .4rem;
    z-index: 1;
    background:
      linear-gradient(rgba(2, 9, 26, .12), rgba(2, 9, 26, .3)),
      url('assets/cosmic-header.webp') center 47% / cover no-repeat;
    border-bottom: 1px solid #9d7629;
    box-shadow: inset 0 -1px 0 rgba(255, 224, 145, .18);
  }
  header h1 {
    font-family: 'Marcellus', serif; font-weight: 700;
    font-size: clamp(1.85rem, 5.2vw, 3.25rem);
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold);
    background: linear-gradient(105deg, #9f7020 0%, #f8e4a0 24%, #c38d2c 49%, #ffe9a6 72%, #a06d1d 100%);
    background-size: 220% 100%;
    background-position: 42% 50%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .85));
  }
  header p {
    margin-top: .5rem; font-size: clamp(1.02rem, 2vw, 1.3rem); font-weight: 300; font-style: italic;
    color: var(--gold); max-width: 36rem; margin-inline: auto;
    background: linear-gradient(100deg, #b9852a, #f5dda0 32%, #d5a746 62%, #ffe8ac);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .9));
  }

  /* The stage is the wheel's own box; the counting ring sits outside it, in
     the margin left here for it (see `svg { overflow: visible }` below). So
     the numbers cost the wheel about a tenth of its diameter and the whole
     composition still takes up what it always did. */
  .stage {
    position: relative;
    width: min(84vw, 580px, 66vh); aspect-ratio: 1;
    margin: .6rem auto; z-index: 1;
    touch-action: none;
  }

  /* Roomier spacing on larger (desktop) screens */
  @media (min-width: 760px) {
    header { padding: 2.6rem 1rem 1rem; }
    header p { margin-top: .9rem; }
    .stage { margin: 1.8rem auto; }
  }
  .mobile-guidance-slot,
  .mobile-correspondences { display: none; }
  @media (max-width: 899px) {
    header { transform: translateY(-.4rem); }
    .guide-help {
      position: absolute;
      top: calc(100% + .55rem);
      left: .65rem;
    }
    .stage { margin-top: 2.2rem; }
    body.intro-running .stage { pointer-events: none; }
    .demo-balloon {
      width: min(22rem, calc(100vw - 2rem));
      padding: .65rem 2.15rem .65rem .8rem;
      font-size: clamp(.8rem, 3.4vw, .94rem);
      line-height: 1.32;
    }
    .demo-balloon.right { width: min(22rem, calc(100vw - 4.5rem)); }
    .demo-balloon .continue { margin-top: .35rem; font-size: .62em; }
    #wheel .label-outer,
    #wheel .label-inner,
    #wheel .wheel-num {
      fill: #000 !important;
      stroke: none !important;
    }
    .demo-light {
      position: fixed;
      left: 50%; top: 50%;
      width: 15px; height: 15px;
      z-index: 9;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      background: #fff8cf;
      border: 1px solid rgba(91, 61, 9, .8);
      box-shadow: 0 0 6px 3px #fff7bd, 0 0 18px 7px rgba(226, 174, 51, .72);
      transition: left .8s cubic-bezier(.2, .72, .2, 1), top .8s cubic-bezier(.2, .72, .2, 1), opacity .3s ease;
    }
    .demo-light.on { opacity: 1; }
    #wheel .sector-outer.demo-focus,
    #wheel .sector-inner.demo-focus {
      stroke: #fff5b0;
      stroke-width: 6;
      filter: drop-shadow(0 0 5px rgba(213, 155, 25, .95));
    }
    #wheel .label-outer.demo-focus,
    #wheel .label-inner.demo-focus {
      font-weight: 700;
      filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #f4c95a);
    }
    .mobile-guidance-slot {
      display: block;
      position: relative;
      width: min(92vw, 42rem);
      height: 16.5rem;
      margin: .45rem auto 1.5rem;
    }
    .wheel-gesture-hint {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #b9852a;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, visibility .3s ease;
    }
    .wheel-gesture-hint.show { visibility: visible; opacity: 1; }
    .wheel-gesture-hint svg {
      width: min(48vw, 12rem);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 2px 2px rgba(26, 17, 3, .18));
    }
    .gesture-orbit {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 4 7;
      opacity: .55;
    }
    .gesture-hand {
      fill: rgba(250, 244, 230, .88);
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 110px 108px;
      animation: gesture-turn 1.55s ease-in-out infinite alternate;
    }
    @keyframes gesture-turn {
      from { transform: rotate(-23deg); }
      to { transform: rotate(23deg); }
    }
    .mobile-correspondences {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      box-sizing: border-box;
      padding: .65rem .75rem .75rem;
      border: 1px solid rgba(201, 151, 54, .7);
      border-top: 4px solid #d8a647;
      background:
        linear-gradient(rgba(2, 9, 26, .12), rgba(2, 9, 26, .3)),
        url('assets/cosmic-header.webp') center 47% / cover no-repeat;
      color: #ecd28e;
      box-shadow: inset 0 0 0 1px rgba(255, 224, 145, .13), 0 8px 24px rgba(0, 0, 0, .32);
      transition: border-color .25s ease, opacity .18s ease, transform .18s ease;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .mobile-correspondences.open { visibility: visible; opacity: 1; pointer-events: auto; }
    .mobile-correspondences.updating { opacity: .55; transform: translateY(3px); }
    .corr-close {
      position: absolute;
      top: .25rem;
      right: .35rem;
      width: 1.65rem;
      height: 1.65rem;
      border: 0;
      background: transparent;
      color: #e8c56e;
      font: 1.4rem/1 serif;
      cursor: pointer;
    }
    .corr-source {
      font-size: .62rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #cfa047;
    }
    .corr-title {
      margin: .1rem 1.7rem .4rem 0;
      font-family: 'Marcellus', serif;
      font-size: .96rem;
      font-weight: 700;
      color: #e9c66d;
      text-shadow: 0 1px 1px rgba(0, 0, 0, .8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .corr-grid { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: .28rem; min-height: 0; }
    .corr-field {
      display: grid;
      grid-template-columns: minmax(4.7rem, 27%) minmax(0, 1fr);
      align-items: start;
      gap: .45rem;
      min-height: 0;
      padding-top: .32rem;
      border-top: 1px solid rgba(239, 205, 126, .26);
      overflow: hidden;
    }
    .corr-field.demo-focus {
      background: rgba(22, 34, 60, .82);
      box-shadow: 0 0 0 2px rgba(222, 169, 43, .48), 0 0 15px rgba(222, 169, 43, .42);
    }
    .corr-key {
      font-size: clamp(.52rem, 2.25vw, .61rem);
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
      color: #cfa047;
    }
    .corr-value {
      font-size: clamp(.68rem, 2.9vw, .82rem);
      line-height: 1.22;
      color: #f1d993;
      overflow: hidden;
    }
  }
  @media (min-width: 640px) and (max-width: 899px) {
    .mobile-guidance-slot { height: 10.5rem; }
    .corr-grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: minmax(0, 1fr); gap: .65rem; }
    .corr-field { display: block; }
    .corr-key { margin-bottom: .2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gesture-hand { animation: none; }
  }
  /* The outer ring reaches r=344 in a 700-unit viewBox, so its halo — and the
     counting ring past it — would be clipped flat by the SVG viewport. Let
     them spill over the edge. */
  svg {
    width: 100%; height: 100%; display: block; overflow: visible;
    -webkit-user-select: none; user-select: none;
  }
  .ring-group { cursor: grab; }
  .ring-group:active { cursor: grabbing; }
  /* Promoted only while turning: a permanent layer would cost memory for a
     filtered subtree that is usually still. */
  body.spinning .ring-group { will-change: transform; }

  .sector-outer, .sector-inner {
    fill: var(--seg-color, var(--paper));
    stroke: rgba(52, 43, 34, .92);
    stroke-width: 1.4;
    stroke-linejoin: round;
    stroke-dasharray: 118 .55 47 .75;
    stroke-linecap: round;
    transition: fill .22s ease;
  }
  /* The wheel's outer rim and the two inner guide circles. */
  .wheel-rim  {
    stroke: rgba(52, 43, 34, .92);
    stroke-width: 1.4;
    stroke-dasharray: 165 .65 73 .85;
    stroke-linecap: round;
  }
  .wheel-guide { stroke: var(--line); stroke-width: 1; }

  /* ---- The counting ring ------------------------------------------------
     The twelve principle numbers used to be struck into the wedges, one set
     per wheel, each of them lighting up with its sector — twenty-four numerals
     competing with the words printed over them. They live outside the wheel
     now: a single scale on its own circle, clear of the rim and of the
     needle's tip, reading whichever wheel the hand last touched and turning
     with it (see numTrack in the JS). Nothing here lights up. It is the ruler
     the wheel is read against, not another thing on the wheel. */
  .num-ring { transition: opacity .18s ease; }
  .num-ring.switching { opacity: 0; }            /* while it changes wheels */
  .wheel-num {
    font-family: 'Marcellus', serif;
    font-size: 23px;
    fill: var(--ink);
    text-anchor: middle;
    pointer-events: none; user-select: none;
  }
  /* User units, so the numerals shrink with the wheel — on a phone that is a
     ten-pixel numeral. A little more size buys them back. */
  @media (max-width: 520px) { .wheel-num { font-size: 27px; } }

  /* Label text: black ink on the white wheel. */
  .label-outer, .label-inner {
    fill: var(--ink);
    font-family: 'Marcellus', serif;
    text-anchor: middle;
    pointer-events: none; user-select: none;
  }
  .label-outer { font-size: 15.5px; letter-spacing: .04em; }
  .label-inner { font-size: 13px; }

  /* ============ THE CENTRE DISC ============
     A plain white disc with a black outline; the result reads inside it. */
  .hub {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 42%; height: 42%; border-radius: 50%;
    overflow: hidden; isolation: isolate;
    background: var(--paper);
    border: 1.4px solid var(--line);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 4%; gap: .35rem;
  }
  .hub .result, .hub button { position: relative; z-index: 2; }
  .hub.demo-result {
    box-shadow: 0 0 0 4px rgba(255, 247, 189, .88), 0 0 24px 10px rgba(213, 155, 25, .65);
  }

  .hub .eyebrow { display: none; }
  .hub .match {
    font-family: 'Marcellus', serif;
    font-size: clamp(.68rem, 2vw, .92rem);
    line-height: 1.3; color: var(--ink);
  }
  /* The fit chooses the breaks, so each line is its own row and must not wrap. */
  .hub .result .line { display: block; white-space: nowrap; }
  /* Width is deliberately near the full diameter and the size is set from JS
     (fitHubText) so the block grows until its corners touch the inner circle. */
  .hub .result {
    font-size: clamp(.62rem, 1.8vw, .8rem);   /* fallback until JS measures */
    font-family: 'Marcellus', serif;          /* the book's voice, not the UI's */
    color: var(--ink); line-height: 1.24;
    width: 100%;
  }
  .hub button {
    margin-top: .25rem;
    font-family: 'Spectral', serif;
    font-size: .66rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); background: var(--result-color, var(--paper));
    border: 1px solid var(--line); border-radius: 2rem;
    padding: .38em 1.1em; cursor: pointer;
    transition: background .25s, color .25s;
  }
  @media (max-width: 520px) {
    .hub { padding: 3%; gap: .2rem; }
    .hub .eyebrow { display: none; }
    .hub .match { font-size: .68rem; }
    .hub button { font-size: .56rem; padding: .3em .8em; }
    .sector-outer, .sector-inner { stroke-width: 2; }
    body.spinning .sector-outer, body.spinning .sector-inner { transition: none; }
  }
  .hub button:hover, .hub button:focus-visible {
    background: var(--ink); color: var(--paper); outline: none;
  }

  .needle {
    position: absolute; top: -2.5%; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 26px solid var(--line);
    z-index: 2; pointer-events: none;
  }

  .hint {
    z-index: 1; font-size: .78rem; color: var(--ink);
    font-style: italic; text-align: center; padding: 0 1rem;
  }

  .controls {
    display: flex; gap: 2rem; justify-content: center;
    padding: .8rem 1rem 2rem; z-index: 1; flex-wrap: wrap;
  }
  .control-block { text-align: center; }

       around the wheel; the wheel sits on top, centred, and covers their inner
       ends, so a wedge shows only in the ring/corner the circle leaves free. */
    .pcbase {
      display: block;
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      align-self: center;
      margin: 0 auto;
      border: 1px solid rgba(52, 43, 34, .88);

      inset: 0;

      height: 100%;

       the way around it (including the split top and bottom). Centred on top. */

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 75%;
      width: auto;
      aspect-ratio: 1;
      max-width: 75%;
      margin: 0;
      z-index: 2;
      opacity: 1;

      12%  { opacity: 1; }

      100% { transform: translate(-50%, -50%) translateY(0) rotate(540deg); opacity: 1; }
    }
    #pcbase .stage::before {

      position: absolute;
      inset: .9%;
      z-index: 0;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;

    }

       ring. The centre result is removed too — the result is now read off the
       base, so the middle of the wheel is left clear. */

    }
    .base-wedge.event,
    .base-wedge.hover,
    .base-wedge:hover { fill: var(--seg-color, var(--paper)); }

    body.intro-selection-away .base-wedge.event { fill: transparent; }

ю"],"a":"То, как развиваются осуществление мечтаний семьи и жилищные условия ваших друзей, — это то, как развиваются ваша способность отстаивать себя, или самоутверждение, и ваша жизнь влечений.","i":"То, как развивается осуществление мечтаний относительно вашего образа жизни, связанного с удовольствиями, и финансов, — это то, как развиваются ваша способность отстаивать себя, или самоутверждение, и ваша жизнь влечений.","b":"Функциональное состояние стоп, солнечного сплетения и шишковидной железы матерей и отцов мужей или жён ваших друзей отражает вашу способность отстаивать себя, или самоутверждение, и вашу жизнь влечений (функциональное состояние вашей головы, желчи и мышц).","s":["Чем больше человек разрабатывает альтернативы в","экономических способностях","способности обеспечивать собственную защищённость","способности наслаждаться","способности создавать себе собственное пространство","тем больше развиваются","успех самореализации и самостоятельности","способность отстаивать себя","реализация естественных телесных влечений"]},"7-6":{"m":["Умеет наслаждаться тот, кто связывает себя из любви"],"a":"То, как развивается партнёрство ваших бывших партнёров, — это и есть то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развивается любовь в отношении ваших планов и привязанности, — это и есть то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функционирование почек, мочевых пузырей и поясничных областей ваших бывших партнёров отражает ваше наслаждение жизнью и обращение с финансами (функционирование вашей шеи/горла, миндалин, желёз и вен).","s":["Чем больше человек развивает готовность принимать решения","разрабатывать собственную жизненную программу и жить в соответствии с ней","разрабатывать собственные планы и концепции","идти собственным путём","вступать в отношения","обретать власть над собой","изменяться","освобождаться от принуждения","тем больше развиваются","способность устанавливать границы","экономические способности","способность обеспечивать собственную защищённость","способность наслаждаться","способность создавать себе собственное пространство"]},"6-7":{"m":["Умеет наслаждаться тот, кто идёт путём любви"],"a":"То, как развиваются планы ваших спутников жизни и детей ваших братьев, сестёр и соседей, — это и есть то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развиваются планы и совместный образ жизни в вашем партнёрстве, — это и есть то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функционирование половых и выделительных органов вашего спутника жизни, детей ваших братьев, сестёр и соседей отражает ваше наслаждение жизнью и обращение с финансами (функционирование вашей шеи/горла, миндалин, желёз и вен).","s":["Чем больше человек идёт собственными путями и формирует собственное мнение в","способности налаживать контакты","способности к партнёрству","способности флиртовать и соблазнять","способности идти на компромисс","способности выбирать","художественных способностях","способности делать собственную жизнь приятной","тем больше развиваются","способность устанавливать границы","экономические способности","способность обеспечивать собственную защищённость","способность наслаждаться","способность создавать себе собственное пространство"]},"5-8":{"m":["Умеет наслаждаться тот, кто радуется работе"],"a":"То, как развивается успех ваших дядей и тёть по материнской линии, — это и есть то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развивается совершенствование ваших методов работы, — это и есть то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функционирование бёдер, функции питания (роста в толщину) и печени ваших дядей и тёть по материнской линии отражает ваше наслаждение жизнью и обращение с финансами (функционирование вашей шеи/горла, миндалин, желёз и вен).","s":["Чем больше человек повышает свою квалификацию и развивает себя","находить удов ть себя, или самоутверждение, а также жизнь влечений.","i":"То, как развивается смелость в том, что касается твоего умения добиваться своего, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","b":"Функциональная способность головы, желчного пузыря и мышц братьев и сестёр твоих друзей отражает твою способность отстаивать себя, или самоутверждение, а также жизнь влечений (функциональная способность твоей головы, желчного пузыря и мышц).","s":["Чем больше человек проявляет инициативу,","тем больше развиваются","успех самореализации и самостоятельности","способность отстаивать себя","реализация естественных телесных влечений","спортивные способности"]},"11-1":{"m":["Смел тот, кто наслаждается осуществлением мечтаний","- «Если твои дяди и тёти — ценители удовольствий,","- то и ты в своих влечениях не обыватель».","- Добрин М. Антонов"],"a":"То, как у твоих дядей и тёть по отцовской линии развивается обращение с финансами, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","i":"То, как развивается ценность осуществления твоих мечтаний, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","b":"Функциональная способность шеи, миндалин, гормональной системы, желёз и вен твоих дядей и тёть по отцовской линии отражает твою способность отстаивать себя, или самоутверждение, а также жизнь влечений (функциональная способность твоей головы, желчного пузыря и мышц).","s":["Чем больше человек вкладывается в развитие способности:","осуществлять собственные мечты","развивать альтернативы","выражать собственные права","тем больше развиваются","успех самореализации и самостоятельности","способность отстаивать себя","реализация естественных телесных влечений"]},"10-2":{"m":["Смел тот, кто свободно и","независимо выражает свои мысли","«Как говорят твои друзья —","так ты отстаиваешь себя в своей жизни».","Добрин М. Антонов"],"a":"То, как развивается красноречие твоих друзей, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","i":"То, как развивается способность к общению в связи с твоим участием в принятии решений и совместными начинаниями, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","b":"Функциональная способность лёгких, рук, органов речи и слуха твоих друзей и партнёров по жизни твоих детей отражает твою способность отстаивать себя, или самоутверждение, а также жизнь влечений (функциональная способность твоей головы, желчного пузыря и мышц).","s":["Чем больше человек учится:","становиться свободным и независимым","вместе начинать новые дела","обеспечивать разнообразие","использовать возможности","тем больше развиваются","успех самореализации и самостоятельности","способность отстаивать себя","реализация естественных телесных влечений"]},"9-3":{"m":["Смел тот, кто берёт на себя ответственность за своё благополучие"],"a":"То, как развивается чувство благополучия у твоего отца, тёщи или свекрови, а также двоюродных братьев и сестёр по материнской линии, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","i":"То, как развивается чувство благополучия в связи с твоими целями и профессией, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","b":"Функциональная способность груди, желудка, иммунной системы и слизистых оболочек твоего отца, тёщи или свекрови, а также двоюродных братьев и сестёр по материнской линии отражает твою способность отстаивать себя, или самоутверждение, а также жизнь влечений (функциональная способность твоей головы, желчного пузыря и мышц).","s":["Чем больше человек развивает доверие к способности","открывать и отстаивать собственные права","брать на себя ответственность перед жизнью","развивать собственные цели","следовать своему призванию","тем больше развиваются","успех самореализации и самостоятельности","способность отстаивать себя","реализация естественных телесных влечений"]},"8-4":{"m":["Смел тот, кто сам управляет своим счастьем"],"a":"То, как развиваются самореализация и способность действовать у твоих родственников и родственниц по браку, а также у братьев и сестёр твоего спутника жизни, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","i":"То, как развиваются способность действовать и самостоятельность в том, что касается улучшения тобой условий жизни, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","b":"Функциональная способность сердца, системы кровообращения и 5-го–9-го позвонков позвоночника твоих родственников и родственниц по браку, а также братьев и сестёр твоих спутников жизни отражает твою способность отстаивать себя, или самоутверждение, а также жизнь влечений (функциональная способность твоей головы, желчного пузыря и мышц).","s":["Чем больше человек развивает самостоятельность и готовность действовать, чтобы","продолжать образование","развивать терпимость","способствовать собственному развитию и делать себя счастливым","что-либо улучшать и оптимально организовывать","тем больше развиваются","успех самореализации и самостоятельности","способность отстаивать себя","реализация естественных телесных влечений"]},"7-5":{"m":["Смел был тот, кому удалось","освободиться от принуждений, связанных с работой"],"a":"То, как развиваются трудовые отношения твоих бывших партнёров, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","i":"То, как развиваются собственные методы работы в связи с твоими планами и отношениями, — это то, как развиваются твоя способность отстаивать себя, или самоутверждение, а также жизнь влечений.","b":"Функциональная способность органов пищеварения и кишечника твоих бывших партнёров отражает твою способность отстаивать себя, или самоутверждение, а также жизнь влечений (функциональная способность твоей головы, желчного пузыря и мышц).","s":["Чем больше человек развивает собственные методы работы, чтобы","развивать собственные планы и концепции","идти собственным путём","вступать в отношения","обретать власть над собой","изменяться","тем больше развиваются","успех самореализации и самостоятельности","способность отстаивать себя","реализация естественных телесных влечений"]},"1-0":{"m":["Человек, умеющий наслаждаться, — это тот, у кого хватает смелости","устанавливать свои границы и обеспечивать себе защиту"],"a":"То, как развиваются семейная жизнь и жилищные условия ваших друзей, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развивается смелость устанавливать свои границы, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функциональное состояние головы, желчного пузыря и мышц у матерей, отцов супругов и двоюродных братьев и сестёр по отцовской линии ваших друзей отражает ваше наслаждение жизнью и обращение с финансами (функциональное состояние вашей шеи, миндалин, желёз и вен).","s":["Чем больше человек развивает инициативу, чтобы утвердить собственное ценностное самосознание, тем больше развиваются","способность устанавливать границы","экономические способности","способность в сфере обеспечения собственной защищённости","способность наслаждаться"]},"0-1":{"m":["Человек, умеющий наслаждаться, — это тот, кто считает важным","отстаивать себя в жизни"],"a":"То, как развивается обращение с финансами у братьев, сестёр и соседей ваших друзей, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развивается защищённость при отстаивании себя как личности в жизни, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функциональное состояние шеи, миндалин, желёз и вен у братьев, сестёр и соседей ваших друзей отражает ваше наслаждение жизнью и обращение с финансами (функциональное состояние вашей шеи, миндалин, желёз и вен).","s":["Чем больше человек придаёт значение","способности проявлять инициативу","способности отстаивать себя","реализации естественных телесных влечений","спортивным способностям","тем больше развиваются","способность устанавливать границы","экономические способности","способность в сфере обеспечения собственной защищённости","способность наслаждаться","способность создавать себе собственное пространство"]},"11-2":{"m":["Человек, умеющий наслаждаться, — это тот, кто разрабатывает альтернативы для улучшения партнёрских отношений"],"a":"То, как развиваются ремесленные способности ваших дядей и тёть по отцовской линии, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развивается выражение собственных ожиданий, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функциональное состояние лёгких, рук, органов речи и слуха у ваших дядей и тёть по отцовской линии отражает ваше наслаждение жизнью и обращение с финансами (функциональное состояние вашей шеи, миндалин, желёз и вен).","s":["Чем больше человек развивает способность к обучению","воплощать собственные мечты","разрабатывать альтернативы","выявлять и анализировать предпосылки","выражать собственные права и собственную ответственность","тем больше развиваются","способность устанавливать границы","экономические способности","способность в сфере обеспечения собственной защищённости","способность наслаждаться","способность создавать себе собственное пространство"]},"10-3":{"m":["Человек, умеющий наслаждаться, — это тот,","кто независим в своём благоденствии"],"a":"То, как развиваются ощущение комфорта, семейная жизнь и жилищные условия ваших друзей, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развивается ощущение благополучия в ваших стремлениях к реформам и совместных начинаниях, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функциональное состояние груди, желудка и слизистых оболочек у ваших друзей и спутников жизни ваших детей отражает ваше наслаждение жизнью и обращение с финансами (функциональное состояние вашей шеи, миндалин, желёз и вен).","s":["Чем больше человек развивает доверие","к свободе и независимости","к тому, чтобы изменяться","организовывать свободное время","к совместным начинаниям","использовать возможности","выражать собственную оригинальность","тем больше развиваются","способность устанавливать границы","экономические способности","способность в сфере обеспечения собственной защищённости","способность наслаждаться","способность создавать себе собственное пространство","Пример с самозанятой женщиной (клиенткой): 4 из 11 (матери ваших друзей) = ваш 2-й жизненный принцип.","У матери вашей подруги (2-й жизненный принцип) проблемы с сердцем. Чтобы классифицировать ваше сердце, нужно, начиная со 2-го жизненного принципа, отсчитать ещё пять, и так получается ваш 6-й жизненный принцип (2+5-1=6), то есть состояние трудовых отношений. В то время, когда матери подруги сделали операцию шунтирования, в том месяце у неё совсем не было работы и, соответственно, она не заработала никаких денег. Мать подруги отражает ваши финансы (ваш 2-й жизненный принцип), поэтому у неё также были проблемы с деньгами. Вскоре после успешной операции шунтирования у матери вашей подруги всё снова было в порядке.","Например: 5 из 10 = 2-й жизненный принцип. У моего отца было два инфаркта за один год. В том же году я продал два своих заведения и проиграл эти деньги в казино. Я потерял невероятно много денег. Я израсходовал все свои сбережения."]},"9-4":{"m":["Человек, умеющий наслаждаться, — это тот, у кого в профессии есть игра и веселье"],"a":"То, как развивается самореализация вашего отца, матери вашего супруга или супруги и двоюродных братьев и сестёр по материнской линии, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развивается способность действовать применительно к вашим целям и профессии, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функциональное состояние сердца, кровообращения и позвонков с 5-го по 9-й у твоего отца, матери вашего супруга или супруги и двоюродных братьев и сестёр по материнской линии отражает ваше наслаждение жизнью и обращение с финансами (функциональное состояние вашей шеи, миндалин, желёз и вен).","s":["Чем больше человек развивает самостоятельность и готовность действовать","обнаружение и отстаивание собственных прав","к ответственности перед жизнью","развивать собственные цели","распознавать своё призвание","тем больше развиваются","способность устанавливать границы","экономические способности","способность в сфере обеспечения собственной защищённости","способность наслаждаться","способность создавать себе собственное пространство"]},"8-5":{"m":["Человек, умеющий наслаждаться, — это тот, кто работает, чтобы обрести удовлетворение","«Если выражение твоих чувств искренне —","твоя самоценность развивается чудесно».","Добрин М. Антонов"],"a":"То, как развиваются трудовые отношения ваших родственников по браку мужского и женского пола, а также братьев и сестёр вашего спутника жизни, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","i":"То, как развивается работа по улучшению вашей жизни, — это то, как развиваются ваше наслаждение жизнью и обращение с финансами.","b":"Функциональное состояние органов пищеварения и кишечника у ваших родственников по браку мужского и женского пола, а также у братьев и сестёр вашего спутника жизни отражает ваше наслаждение жизнью и обращение с финансами (функциональное состояние вашей шеи, миндалин, желёз и вен).","s":["Чем больше человек развивает собственные методы работы в жизни","продолжать своё образование","к терпимости","развивать собственную жизненную философию","находить свой смысл в мире","что-либо улучшать и оптимально организовывать","тем больше развиваются","способность устанавливать границы","экономические способности","способность в сфере обеспечения собственной защищённости","способность наслаждаться","способность создавать себе собственное пространство"]},"8-6":{"m":["Успех в партнёрстве заключается в том,","чтобы делать друг друга счастливыми"],"a":"То, как развиваются способности любить и устанавливать контакты у ваших родственников и родственниц по браку, а также у братьев и сестёр вашего спутника жизни, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развивается любовь в отношении улучшения вашей жизни, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функционирование почек, мочевых пузырей и поясничных областей у ваших родственников и родственниц по браку, а также у братьев и сестёр вашего спутника жизни, отражает вашу коммуникативную жизнь и успех вашего партнёрства (функционирование ваших лёгких, кистей рук, органов речи и слуха).","s":["Чем больше человек развивает готовность принимать решения","продолжать образование","развивать и радовать себя","находить собственный смысл в мире","что-либо улучшать и оптимально организовывать","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","способность к обучению"]},"7-7":{"m":["Успех в партнёрстве заключается в том,","чтобы уважать образ жизни другого"],"a":"То, как развиваются планы и отношения ваших бывших партнёров, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развиваются планы и общий образ жизни применительно к вашим отношениям, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функционирование половых и выделительных органов ваших бывших партнёров отражает вашу коммуникативную жизнь и успех вашего партнёрства (функционирование ваших лёгких, кистей рук, органов речи и слуха).","s":["Чем больше человек идёт собственным путём и формирует собственное мнение","разрабатывать собственную жизненную программу и жить в соответствии с ней","идти собственным путём","вступать в отношения","обретать власть над собой","освобождение от принуждений","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","способность к обучению"]},"6-8":{"m":["Успех в партнёрстве заключается в том,","чтобы развивать терпимость по отношению к своему партнёру"],"a":"То, как развивается успех вашего спутника жизни, а также успех детей ваших братьев, сестёр и соседей, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развиваются дальнейшее развитие и совершенствование ваших способностей любить и устанавливать контакты, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функционирование бёдер, функция питания (рост в толщину) и функционирование печени у вашего спутника жизни, а также у детей ваших братьев, сестёр и соседей, отражают вашу коммуникативную жизнь и успех вашего партнёрства (функционирование ваших лёгких, кистей рук, органов речи и слуха).","s":["Чем больше человек продолжает образование и развивает себя в области","способности к контактам и партнёрству","способности к компромиссу","способности выбирать","художественных способностей","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","способность к обучению"]},"5-9":{"m":["Успех в партнёрстве заключается в том,","чтобы комфортно чувствовать себя при совместной организации повседневной жизни"],"a":"То, как развиваются цели и профессия ваших дядей и тёть по материнской линии, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развивается совместное ощущение благополучия в повседневной жизни, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функционирование кожной и костной структур, коленей, суставов и зубов ваших дядей и тёть по материнской линии отражает вашу коммуникативную жизнь и успех вашего партнёрства (функционирование ваших лёгких, кистей рук, органов речи и слуха).","s":["Чем больше человек берёт на себя ответственность","находить удовлетворение в работе","к собственному методу работы","в выражение собственных чувств","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","способность к обучению"]},"4-10":{"m":["Успех в партнёрстве заключается в том, чтобы играть и веселиться во время совместных занятий"],"a":"То, как развиваются стремления к реформам и совместные начинания ваших детей и спутников жизни ваших друзей, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развиваются стремления к реформам и участие в принятии решений, касающихся организации вашего совместного досуга, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функционирование голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга у ваших детей и спутников жизни ваших друзей отражает вашу коммуникативную жизнь и успех вашего партнёрства (функционирование ваших лёгких, кистей рук, органов речи и слуха).","s":["Чем больше человек свободно и независимо развивается в","способности естественно относиться к сексуальности","творческой способности","способности играть и веселиться","способности к самореализации","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","способность к обучению"]},"3-11":{"m":["Успех в партнёрстве заключается в том,","чтобы комфортно чувствовать себя при совместной организации повседневной жизни"],"a":"То, как у вашей матери, отца вашего супруга или супруги, вашего двоюродного брата и двоюродных сестёр по отцовской линии развиваются осуществление мечтаний и чувство счастья, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развиваются совместная организация повседневной жизни и ощущение счастья в вашей семье, соответствует тому, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функционирование стоп, шишковидной железы и солнечного сплетения у вашей матери, отца вашего супруга или супруги, ваших двоюродных братьев и двоюродных сестёр по отцовской линии отражает вашу коммуникативную жизнь и успех вашего партнёрства (функционирование ваших лёгких, кистей рук, органов речи и слуха).","s":["Чем больше человек разрабатывает альтернативы","создавать и передавать чувство защищённости","открывать собственную идентичность","принимать и признавать других людей","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","способность к обучению"]},"2-0":{"m":["Успех в партнёрстве заключается в том, чтобы проявлять инициативу, чтобы что-то улучшить"],"a":"То, как развивается способность отстаивать себя у ваших братьев и сестёр, соседей и детей ваших друзей, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развивается мотивация в вашей коммуникации, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функциональное состояние головы, желчи/желчного пузыря и мышц ваших братьев и сестёр, соседей и детей ваших друзей отражает вашу коммуникативную жизнь и успех вашего партнёрства (функциональное состояние ваших лёгких, рук, органов речи и слуха).","s":["Чем больше у человека мужества выражать себя,","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","способность к дискуссии","способность к свободной речи","ремесленные способности","способность к обучению"]},"1-1":{"m":["Успех в партнёрстве заключается в том,","чтобы совместно планировать и наслаждаться этим"],"a":"То, как развивается обращение с финансами матерей ваших друзей, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развивается ценность вашего совместного планирования, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функциональное состояние шеи/горла, миндалин, желёз и вен матерей и отцов супругов ваших друзей отражает вашу коммуникативную жизнь и успех вашего партнёрства (функциональное состояние ваших лёгких, рук, органов речи и слуха).","s":["Чем больше человек придаёт значение развитию в","способности устанавливать границы","экономических способностях","способности в обеспечении собственной безопасности","способности получать удовольствие","способности создавать себе собственное пространство","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","способность к дискуссии","способность к обучению"]},"0-2":{"m":["Успех в партнёрстве заключается в том,","чтобы совместно развиваться дальше"],"a":"То, как развиваются коммуникативная жизнь и успех партнёрства братьев и сестёр и соседей ваших друзей, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развивается выражение собственной воли, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функциональное состояние лёгких, рук, органов речи и слуха братьев и сестёр и соседей ваших друзей отражает вашу коммуникативную жизнь и успех вашего партнёрства (функциональное состояние ваших лёгких, рук, органов речи и слуха).","s":["Чем больше человек учится развивать следующее,","способность проявлять инициативу","способность отстаивать себя","способность осмелиться на что-либо","реализацию естественных телесных влечений","спортивные способности","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности"]},"11-3":{"m":["Успех в партнёрстве заключается в том,","чтобы развивать альтернативы в общих целях"],"a":"То, как развиваются семейная жизнь и жилищные условия ваших дядей и тёть по отцовской линии, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развиваются общие цели в отношении осуществления ваших мечтаний, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функциональное состояние груди, желудка и слизистых оболочек ваших дядей и тёть по отцовской линии отражает вашу коммуникативную жизнь и успех вашего партнёрства (функциональное состояние ваших лёгких, рук, органов речи и слуха).","s":["Чем больше человек развивает доверие и способность к самоотдаче","осуществлять собственные мечты","развивать альтернативы","раскрывать и анализировать подоплёку","выражать собственные права и собственную ответственность","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","способность к обучению"]},"10-4":{"m":["Успех в партнёрстве заключается в том,","чтобы участвовать в принятии решений о совместном досуге"],"a":"То, как развивается самореализация ваших друзей и спутников жизни ваших детей, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развиваются самостоятельность и способность действовать в отношении ваших стремлений к реформам и совместных начинаний, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функциональное состояние сердца, кровообращения и позвонков с 5-го по 9-й у ваших друзей и спутников жизни ваших детей отражает вашу коммуникативную жизнь и успех вашего партнёрства (функциональное состояние ваших лёгких, рук, органов речи и слуха).","s":["Чем больше человек развивает самостоятельность и готовность действовать","ради свободы и независимости","организовывать свободное время","ради совместных мероприятий","обеспечивать разнообразие","использовать возможности","выражать собственную оригинальность","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","Пример для 5 из 11 = мой 3-й LP","Пример из моей жизни.","В этом году, когда у всех моих друзей родились дети и роды завершились без кесарева сечения и операции, развитие моего партнёрства и моих контактов было самым счастливым. Поскольку родившиеся у моих друзей дети отражают мой 3-й LP и развивались здоровыми, развиваются мои контакты и моё партнёрство."]},"9-5":{"m":["Успех в партнёрстве заключается в том,","чтобы брать на себя ответственность за организацию повседневной жизни"],"a":"То, как развиваются трудовые отношения вашего отца, матери вашего супруга/супруги, а также двоюродных братьев и сестёр по материнской линии, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","i":"То, как развивается выражение чувств в совместной жизни, — это то, как развиваются ваша коммуникативная жизнь и успех вашего партнёрства.","b":"Функциональное состояние органов пищеварения и кишечника вашего отца, матери вашего супруга/супруги, а также двоюродных братьев и сестёр по материнской линии отражает вашу коммуникативную жизнь и успех вашего партнёрства (функциональное состояние ваших лёгких, рук, органов речи и слуха).","s":["Чем больше человек развивает собственные методы работы, чтобы","обнаруживать и отстаивать собственные права","брать на себя ответственность перед жизнью","развивать собственные цели","распознавать своё призвание","тем больше развиваются","успех и счастье в партнёрстве","способность к коммуникации","ремесленные способности","способность к обучению"]},"3-0":{"m":["Заботиться о собственном благополучии означает,","иметь смелость удовлетворять собственные потребности"],"a":"То, как развивается способность отстаивать себя у вашей матери, вашего тестя/свёкра и ваших двоюродных братьев и сестёр по отцовской линии, — это то, как развиваются ваше благополучие, ваша семья и ваши жилищные условия.","i":"То, как развивается способность ваших потребностей отстаивать себя, — это то, как развиваются ваше благополучие, ваша семья и ваши жилищные условия.","b":"Функционирование головы, желчного пузыря и мышц у вашей матери, вашего тестя/свёкра и ваших двоюродных братьев и сестёр по отцовской линии отражает ваше благополучие, вашу семью и ваши жилищные условия (функционирование вашей груди, желудка и слизистых оболочек).","s":["Чем больше человек проявляет инициативу, чтобы заботиться о собственном благополучии,","тем больше развиваются","способность создавать и передавать чувство защищённости","способность сопереживать другим","способность прислушиваться к голосу собственной природы","способность раскрывать собственную идентичность","способность принимать и признавать других людей"]},"2-1":{"m":["Заботиться о собственном благополучии означает,","вести доставляющие удовольствие беседы"],"a":"То, как развивается обращение с финансами ваших братьев и сестёр, соседей и детей ваших друзей, — это то, как развиваются ваше благополучие, ваша семья и ваши жилищные условия.","i":". То, как развивается ценность общего смысла, — это то, как развиваются ваше благополучие, ваша семья и ваши жилищные условия.","b":"Функционирование горла, миндалин, желёз и вен у ваших братьев, сестёр и соседей отражает ваше благополучие, вашу семью и ваши жилищные условия (функционирование вашей груди, желудка и слизистых оболочек).","s":["Чем больше человек придаёт значение дальнейшему развитию в","способности к коммуникации","ремесленных умениях","способности к обучению","тем больше развиваются","создавать и передавать чувство защищённости","сопереживать другим","раскрывать собственную идентичность","принимать и признавать других людей"]},"1-2":{"m":["Заботиться о собственном благополучии означает,","вкладываться в улучшение партнёрских отношений","- «Кто плохо говорит о собственной самоценности,","- тот душевно вонзает в себя меч.»","Ясмин Ховорка"],"a":"То, как развивается коммуникация в семье ваших друзей, — это то, как развиваются ваше благополучие, ваша семья и ваши жи ь голос жизни (собственной природы)","раскрывать собственную идентичность","принимать и признавать других людей"]},"9-6":{"m":["Заботиться о собственном ощущении благополучия означает,","брать на себя ответственность за приятную сторону жизни"],"a":"То, как развиваются способность любить и вступать в контакт у вашего отца, матери вашего супруга или супруги и двоюродных братьев и сестёр по материнской линии, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","i":"То, как развивается любовь в отношении ваших целей и в профессии, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","b":"Функциональная способность почек, мочевых пузырей и поясничных областей вашего отца, матери вашего супруга или супруги и двоюродных братьев и сестёр по материнской линии отражает ваше ощущение благополучия, вашу семью и ваши жилищные условия (функциональную способность вашей груди, желудка и слизистых оболочек).","s":["Чем больше развивают готовность принимать решения в","осознании собственных прав и отстаивании себя","ответственности перед жизнью","разработке собственных целей","следовании своему призванию","последовательности и настойчивости","тем больше развиваются","создавать и передавать чувство защищённости","слышать голос жизни (собственной природы)","принимать и признавать других людей"]},"8-7":{"m":["Заботиться о собственном ощущении благополучия означает,","разрабатывать собственную концепцию, улучшающую твои жизненные обстоятельства"],"a":"То, как развиваются планы ваших братьев и сестёр по браку, а также братьев и сестёр ваших спутников жизни, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","i":"То, как развиваются планы того, как вам способствовать собственному развитию и сделать себя счастливой, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","b":"Функциональная способность половых и выделительных органов ваших  что знает».","Добрин М. Антонов"],"a":"То, как развиваются цели и профессия вашего спутника жизни, детей ваших братьев и сестёр, а также детей ваших соседей, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","i":"То, как развивается значение вашего партнёрства и ваших контактов, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","b":"Функциональная способность кожи и костного каркаса, коленей, суставов и зубов вашего спутника жизни, детей ваших братьев и сестёр, а также детей ваших соседей отражает ваше ощущение благополучия, вашу семью и ваши жилищные условия (функциональную способность вашей груди, желудка и слизистых оболочек).","s":["Чем больше берут на себя ответственность и развивают ответственность в","способности вступать в контакт","способности к партнёрству","способности к компромиссу","способности принимать решения","художественных способностях","тем больше развиваются","создавать и передавать чувство защищённости","слышать голос жизни (собственной природы)"]},"5-10":{"m":["Заботиться о собственном ощущении благополучия означает,","свободное и независимое выражение чувств"],"a":"То, как развиваются стремления к реформам и совместные начинания ваших дядей и тёть по материнской линии, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","i":"То, как развиваются стремления к реформам и участие в принятии решений в отношении вашего рабочего места и организации повседневной жизни, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","b":"Функциональная способность голеней, икр, пульса и дыхания, мозговых оболочек и спинного мозга ваших дядей и тёть по материнской линии отражает ваше ощущение благополучия, вашу семью и ваши жилищные условия (функциональную способность вашей груди, желудка и слизистых оболочек).","s":["Чем больше развивают участие в принятии решений","находить удовлетворение в работе","к собственным методам работы","анализировать","в выражении собственных чувств","тем больше развиваются","создавать и передавать чувство защищённости","слышать голос жизни (собственной природы)","принимать и признавать других людей"]},"4-11":{"m":["Заботиться о собственном ощущении благополучия означает,","разрабатывать альтернативы в своей самореализации"],"a":"То, как развиваются осуществление мечтаний и ощущение счастья ваших детей и спутников жизни ваших друзей, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","i":"То, как развиваются осуществление мечтаний и ощущение счастья в отношении вашей самореализации, креативности и сексуальности, — это то, как развиваются ваше ощущение благополучия, ваша семья и ваши жилищные условия.","b":"Функциональная способность ступней, шишковидной железы и солнечного сплетения ваших детей и спутников жизни ваших друзей отражает ваше ощущение благополучия, вашу семью и ваши жилищные условия (функциональную способность вашей груди, желудка и слизистых оболочек).","s":["Чем больше развивают способность осуществлять собственные представления в","управленческой способности","способности естественно обращаться с сексуальностью","творческой способности","способности играть и веселиться","способности самореализовываться","тем больше развиваются","создавать и передавать чувство защищённости","слышать голос жизни (собственной природы)","открывать собственную идентичность","принимать и признавать других людей"]},"4-0":{"m":["Самореализоваться значит,","иметь мужество управлять собой","«Кто может отстоять себя в сексе —","тот затем может действовать самостоятельно».","Добрин М. Антонов"],"a":"То, как развивается способность отстаивать себя у ваших детей и партнёров по жизни ваших друзей, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развивается ваша способность отстаивать себя, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","b":"Функционирование головы, желчного пузыря и мышц ваших детей и партнёров по жизни ваших друзей отражает вашу самореализацию, способность действовать, сексуальность и спекуляции (функционирование вашего сердца, кровообращения и позвонков с 5-го по 9-й).","s":["Чем больше человек проявляет инициативу, чтобы отстаивать себя,","тем больше развиваются","смысл и успех вашего дальнейшего образования и знаний","способность к управлению","естественное отношение к сексуальности","творческая способность","способность к игре и веселью","способность к самореализации"]},"3-1":{"m":["Самореализоваться значит,","доверять собственной ценности"],"a":"То, как развивается обращение с финансами вашей матери, отца вашего супруга или вашей супруги, а также ваших двоюродных братьев и сестёр по отцовской линии, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развиваются ценность вашей семьи и жилищные условия, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","b":"Функционирование шеи, миндалин, желёз и вен вашей матери, отца вашего супруга или вашей супруги, а также ваших двоюродных братьев и сестёр по отцовской линии отражает вашу самореализацию, способность действовать, сексуальность и спекуляции (функционирование вашего сердца, кровообращения и позвонков с 5-го по 9-й).","s":["Чем больше человек придаёт значение тому, чтобы:","дарить и принимать нежность и душевную любовь","создавать и дарить чувство защищённости","слышать голос жизни (собственной природы)","тем больше развиваются:","смысл и успех вашего дальнейшего образования и знаний","способность к управлению","естественное отношение к сексуальности","творческая способность","способность к игре и веселью","способность к самореализации"]},"2-2":{"m":["Самореализоваться значит,","приобретать ремесленные навыки"],"a":"То, как развиваются ремесленные навыки ваших братьев и сестёр, соседей и детей ваших друзей, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развиваются приобретённые ремесленные навыки, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","b":"Функционирование лёгких, кистей рук, органов речи и слуха ваших братьев и сестёр, соседей и детей ваших друзей отражает вашу самореализацию, способность действовать, сексуальность и спекуляции (функционирование вашего сердца, кровообращения и позвонков с 5-го по 9-й).","s":["Чем больше человек развивает способности к самовыражению и обучению в","общении","ремесленных навыках","технических навыках","тем больше развиваются","смысл и успех вашего дальнейшего образования и знаний","способность к управлению","естественное отношение к сексуальности","способность к игре и веселью","способность к самореализации"]},"1-3":{"m":["Самореализоваться значит,","развивать доверие к собственным экономическим способностям","— «Если ты можешь всей душой наслаждаться —","— твои страсти будут струиться».","Добрин М. Антонов"],"a":"То, как развиваются жилищные условия и благополучная жизнь семьи ваших друзей, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развивается ощущение благополучия при обращении с вашими финансами, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","b":"Функционирование груди, желудка и слизистых оболочек матерей и отцов супругов ваших друзей отражает вашу самореализацию, способность действовать, сексуальность и спекуляции (функционирование вашего сердца, кровообращения и позвонков с 5-го по 9-й).","s":["Чем больше человек развивает доверие к","установлению границ","экономическим способностям","способности создавать себе собственное пространство","тем больше развиваются","смысл и успех вашего дальнейшего образования и знаний","естественное отношение к сексуальности","творческая способность","способность к игре и веселью"]},"0-4":{"m":["Самореализоваться значит мотивировать самого себя"],"a":"То, как развиваются самореализация, способность действовать, сексуальность и спекуляции братьев и сестёр и соседей ваших друзей, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развиваются самостоятельность и креативность в отношении вашей способности отстаивать себя, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","b":"Функционирование сердца, кровообращения и позвонков с 5-го по 9-й у братьев и сестёр и соседей ваших друзей отражает вашу самореализацию, способность действовать, сексуальность и спекуляции (функционирование вашего сердца, кровообращения и позвонков с 5-го по 9-й).","s":["Чем больше человек развивает самостоятельность и готовность к действию","в способности проявлять инициативу","в способности отстаивать себя","в реализации естественных телесных влечений","в спортивных способностях","тем больше развиваются","смысл и успех вашего дальнейшего образования и знаний","способность к управлению","естественное отношение к сексуальности","творческая способность","способность к игре и веселью","способность к самореализации"]},"11-5":{"m":["Самореализоваться значит,","работать, чтобы осуществить свои мечты"],"a":"То, как развиваются трудовые отношения ваших дядей и тёть по отцовской линии, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развивается работа, направленная на осуществление ваших мечтаний, — это то, как развиваются ваша самореализация, способность действовать, сексуальность и спекуляции.","b":"Функционирование органов пищеварения и кишечника ваших дядей и тёть по отцовской линии отражает вашу самореализацию, способность действовать, сексуальность и спекуляции (функционирование вашего сердца, кровообращения и позвонков с 5-го по 9-й).","s":["Чем больше человек разрабатывает собственные методы работы,","чтобы осуществлять собственные мечты,","разрабатывать альтернативы","и выражать собственные права и собственную ответственность,","тем больше развиваются","смысл и успех вашего дальнейшего образования и знаний","способность к управлению","естественное отношение к сексуальности","творческая способность","способность к игре и веселью","способность к самореализации"]},"10-6":{"m":["Реализовать себя — значит,","участвовать в принятии решений в партнёрстве","«Если изыскан выбор твоего участия в принятии решений —","в твоей сущности разгорается страсть».","Добрин М. Антонов"],"a":"То, как развиваются партнёрские отношения ваших друзей, — это то, как развиваются ваши самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развивается любовь в том, что касается организации вашего свободного времени и совместных занятий, — это то, как развиваются ваши самореализация, способность действовать, сексуальность и спекуляции.","b":"Функциональная способность почек, мочевых пузырей и поясничных областей у ваших друзей, а также у спутников жизни ваших детей отражает ваши самореализацию, способность действовать, сексуальность и спекуляции (функциональную способность вашего сердца, системы кровообращения и спинных позвонков с пятого по девятый).","s":["Чем больше человек развивает готовность принимать решения","ради свободы и независимости","чтобы организовывать свободное время","для совместной деятельности","чтобы использовать возможности","тем больше развиваются","смысл и успех вашего дальнейшего образования и знаний","естественное отношение к сексуальности","способность к игре и веселью","способность реализовать себя"]},"9-7":{"m":["Реализовать себя — значит,","идти путём собственного призвания"],"a":"То, как развиваются планы вашего отца, вашей тёщи/свекрови и двоюродных братьев и сестёр по материнской линии, — это то, как развиваются ваши самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развиваются планы и отношения, связанные с вашими целями и профессиональной деятельностью, — это то, как развиваются ваши самореализация, способность действовать, сексуальность и спекуляции.","b":"Функциональная способность половых и выделительных органов вашего отца, вашей тёщи/свекрови и двоюродных братьев и сестёр по материнской линии отражает ваши самореализацию, способность действовать, сексуальность и спекуляции (функциональную способность вашего сердца, системы кровообращения и спинных позвонков с пятого по девятый).","s":["Чем больше человек разрабатывает собственные концепции и формирует собственное мнение","чтобы выявлять и отстаивать собственные права","для принятия ответственности перед жизнью","чтобы вырабатывать собственные цели","чтобы откликаться на своё призвание","тем больше развиваются","способность к управлению","естественное отношение к сексуальности","способность к игре и веселью","способность реализовать себя"]},"8-8":{"m":["Реализовать себя — значит,","видеть смысл в улучшении своих жизненных условий"],"a":"То, как развивается успех ваших братьев и сестёр по браку, а также братьев и сестёр вашего спутника жизни, — это то, как развиваются ваши самореализация, способность действовать, сексуальность и спекуляции.","i":"То, как развивается смысл в улучшении вашей жизни, — это то, как развиваются ваши самореализация, способность действовать, сексуальность и спекуляции.","b":"Функциональная способность бёдер, функция питания (рост в толщину) и функциональная способность печени у ваших братьев и сестёр по браку, а также у братьев и сестёр вашего спутника жизни отражают ваши самореализацию, способность действовать, сексуальность и спекуляции (функциональную способность вашего сердца, системы кровообращения и спинных позвонков с пятого по девятый).","s":["Чем больше человек способствует собственному развитию в","дальнейшем образовании","терпимости","улучшении и оптимальном устройстве чего-либо","тем больше развива
