<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script>
/* "Request Desktop Site" on a phone only swaps the user-agent — it leaves the
   layout viewport at device-width because of the meta above, so a width-based
   breakpoint never fires and the mobile view stays. Detect a touch device whose
   UA has dropped its "Mobile" token (i.e. desktop mode is on) and widen the
   viewport, so the >=900px PC layout activates and scales to the screen. Runs
   before first layout to avoid a mobile flash; harmless on real desktops
   (no touch) and on phones in normal mode (UA still says "Mobile"). */
(function () {
  try {
    var touch = (navigator.maxTouchPoints || 0) > 1;
    var desktopUA = !/Mobile/i.test(navigator.userAgent);
    var smallScreen = Math.min(screen.width, screen.height) < 820;
    if (touch && desktopUA && smallScreen) {
      var m = document.querySelector('meta[name=viewport]');
      if (m) m.setAttribute('content', 'width=1024');
    }
  } catch (e) {}
})();
</script>
<title>Der Code des Lebens — Rad der 12 Lebensprinzipien (Originaltexte)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  /* ====================================================================
     BLANK VERSION — flat black-on-white.
     All colour lives in these three tokens; the app is otherwise a
     line drawing (black strokes/text on white). Redesign colour by
     editing these and LP_COLORS in the script.
     ==================================================================== */
  :root {
    color-scheme: light;   /* render light even when the OS is in dark mode */
    --paper: #fff;   /* page + every surface */
    --ink:   #000;   /* text */
    --line:  #000;   /* borders and strokes */
    --gold:  #b4872d; /* title and subtitle */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Spectral', Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---- language switch ---- */
  .lang-switch {
    position: fixed; top: .9rem; right: .9rem; z-index: 5;
    display: flex; gap: .3rem;
  }
  .lang-switch button {
    font-family: 'Spectral', serif;
    font-size: .72rem; letter-spacing: .12em;
    padding: .35em .7em;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2rem;
    color: var(--ink); cursor: pointer;
    transition: all .2s;
  }
  .lang-switch button.active,
  .lang-switch button:hover { background: var(--ink); color: var(--paper); border-color: var(--line); }

  .guide-help {
    position: fixed;
    top: .85rem; left: .9rem;
    z-index: 6;
    width: 2.15rem; height: 2.15rem;
    display: grid; place-items: center;
    border: 1px solid #c99a39;
    border-radius: 50%;
    background: rgba(4, 13, 34, .9);
    color: #f2cf78;
    font-family: 'Marcellus', serif;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 9px rgba(0, 0, 0, .28);
    transition: transform .18s ease, background .18s ease, color .18s ease;
  }
  .guide-help:hover, .guide-help:focus-visible {
    transform: scale(1.08);
    background: #f2cf78;
    color: #08142e;
    outline: none;
  }
  .guide-help.attention {
    animation: guide-pulse 1.4s ease-in-out infinite;
  }
  @keyframes guide-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(242, 207, 120, .62), 0 2px 9px rgba(0, 0, 0, .28); }
    50% { box-shadow: 0 0 0 9px rgba(242, 207, 120, 0), 0 2px 12px rgba(0, 0, 0, .4); }
  }
  .demo-balloon {
    position: fixed;
    left: 50%; top: 50%;
    z-index: 9;
    width: min(30rem, calc(100vw - 1rem));
    padding: 1rem 2.5rem 1rem 1.2rem;
    border: 3px solid #853b38;
    border-radius: 10px;
    background: #b85a56;
    color: #fff;
    font-size: clamp(1rem, 2.1vw, 1.18rem);
    line-height: 1.45;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, calc(-100% - 18px));
    box-shadow: 0 5px 20px rgba(15, 10, 2, .28);
    transition: left .8s cubic-bezier(.2, .72, .2, 1), top .8s cubic-bezier(.2, .72, .2, 1), opacity .25s ease;
  }
  .demo-balloon::after {
    content: '';
    position: absolute;
    left: 50%; bottom: -8px;
    width: 14px; height: 14px;
    transform: translateX(-50%) rotate(45deg);
    background: #b85a56;
    border-right: 3px solid #853b38;
    border-bottom: 3px solid #853b38;
  }
  .demo-balloon.on {
    opacity: 1;
    pointer-events: auto;
    cursor: pointer;
  }
  .demo-balloon.on:hover, .demo-balloon.on:focus-visible {
    border-color: #672724;
    box-shadow: 0 7px 24px rgba(15, 10, 2, .35), 0 0 0 3px rgba(242, 207, 120, .5);
    outline: none;
  }
  .demo-balloon .continue {
    display: block;
    margin-top: .5rem;
    font-size: .68em;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #fff3ed;
  }
  .demo-balloon .tutorial-close {
    position: absolute;
    top: .22rem;
    right: .35rem;
    width: 1.65rem;
    height: 1.65rem;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #fff;
    font: 700 1.25rem/1 'Spectral', serif;
    cursor: pointer;
  }
  .demo-balloon .tutorial-close:hover,
  .demo-balloon .tutorial-close:focus-visible {
    background: rgba(70, 18, 18, .35);
    outline: 2px solid #fff3ed;
    outline-offset: 1px;
  }
  .demo-balloon.insist { animation: balloon-insist .48s ease both; }
  @keyframes balloon-insist {
    0%, 100% { transform: translate(-50%, calc(-100% - 18px)) rotate(0); }
    20% { transform: translate(-50%, calc(-100% - 18px)) rotate(-2deg) scale(1.035); }
    40% { transform: translate(-50%, calc(-100% - 18px)) rotate(2deg) scale(1.035); }
    60% { transform: translate(-50%, calc(-100% - 18px)) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(-50%, calc(-100% - 18px)) rotate(1.5deg) scale(1.015); }
  }
  .demo-balloon.below { transform: translate(-50%, 18px); }
  .demo-balloon.below.insist { animation-name: balloon-insist-below; }
  @keyframes balloon-insist-below {
    0%, 100% { transform: translate(-50%, 18px) rotate(0); }
    20% { transform: translate(-50%, 18px) rotate(-2deg) scale(1.035); }
    40% { transform: translate(-50%, 18px) rotate(2deg) scale(1.035); }
    60% { transform: translate(-50%, 18px) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(-50%, 18px) rotate(1.5deg) scale(1.015); }
  }
  .demo-balloon.below::after {
    top: -8px; bottom: auto;
    border: 0;
    border-left: 3px solid #853b38;
    border-top: 3px solid #853b38;
  }
  .demo-balloon.right {
    width: min(30rem, calc(100vw - 4.5rem));
    transform: translate(18px, -50%);
  }
  .demo-balloon.right::after {
    left: -8px; right: auto;
    top: var(--arrow-top, 50%); bottom: auto;
    transform: translateY(-50%) rotate(45deg);
    border: 0;
    border-left: 3px solid #853b38;
    border-bottom: 3px solid #853b38;
  }
  .demo-balloon.right.insist { animation-name: balloon-insist-right; }
  @keyframes balloon-insist-right {
    0%, 100% { transform: translate(18px, -50%) rotate(0); }
    20% { transform: translate(18px, -50%) rotate(-2deg) scale(1.035); }
    40% { transform: translate(18px, -50%) rotate(2deg) scale(1.035); }
    60% { transform: translate(18px, -50%) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(18px, -50%) rotate(1.5deg) scale(1.015); }
  }
  header {
    width: 100%;
    text-align: center;
    padding: 1.4rem 1rem .4rem;
    z-index: 1;
    background:
      linear-gradient(rgba(2, 9, 26, .12), rgba(2, 9, 26, .3)),
      url('assets/cosmic-header.webp') center 47% / cover no-repeat;
    border-bottom: 1px solid #9d7629;
    box-shadow: inset 0 -1px 0 rgba(255, 224, 145, .18);
  }
  header h1 {
    font-family: 'Marcellus', serif; font-weight: 700;
    font-size: clamp(1.85rem, 5.2vw, 3.25rem);
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold);
    background: linear-gradient(105deg, #9f7020 0%, #f8e4a0 24%, #c38d2c 49%, #ffe9a6 72%, #a06d1d 100%);
    background-size: 220% 100%;
    background-position: 42% 50%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .85));
  }
  header p {
    margin-top: .5rem; font-size: clamp(1.02rem, 2vw, 1.3rem); font-weight: 300; font-style: italic;
    color: var(--gold); max-width: 36rem; margin-inline: auto;
    background: linear-gradient(100deg, #b9852a, #f5dda0 32%, #d5a746 62%, #ffe8ac);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .9));
  }

  /* The stage is the wheel's own box; the counting ring sits outside it, in
     the margin left here for it (see `svg { overflow: visible }` below). So
     the numbers cost the wheel about a tenth of its diameter and the whole
     composition still takes up what it always did. */
  .stage {
    position: relative;
    width: min(84vw, 580px, 66vh); aspect-ratio: 1;
    margin: .6rem auto; z-index: 1;
    touch-action: none;
  }

  /* Roomier spacing on larger (desktop) screens */
  @media (min-width: 760px) {
    header { padding: 2.6rem 1rem 1rem; }
    header p { margin-top: .9rem; }
    .stage { margin: 1.8rem auto; }
  }
  .mobile-correspondences { display: none; }
  @media (max-width: 899px) {
    header { transform: translateY(-.4rem); }
    .stage { margin-top: 2.2rem; }
    body.intro-running .stage { pointer-events: none; }
    .demo-balloon {
      width: min(22rem, calc(100vw - 2rem));
      padding: .65rem 2.15rem .65rem .8rem;
      font-size: clamp(.8rem, 3.4vw, .94rem);
      line-height: 1.32;
    }
    .demo-balloon.right { width: min(22rem, calc(100vw - 4.5rem)); }
    .demo-balloon .continue { margin-top: .35rem; font-size: .62em; }
    #wheel .label-outer,
    #wheel .label-inner,
    #wheel .wheel-num {
      fill: #000 !important;
      stroke: none !important;
    }
    .demo-light {
      position: fixed;
      left: 50%; top: 50%;
      width: 15px; height: 15px;
      z-index: 9;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      background: #fff8cf;
      border: 1px solid rgba(91, 61, 9, .8);
      box-shadow: 0 0 6px 3px #fff7bd, 0 0 18px 7px rgba(226, 174, 51, .72);
      transition: left .8s cubic-bezier(.2, .72, .2, 1), top .8s cubic-bezier(.2, .72, .2, 1), opacity .3s ease;
    }
    .demo-light.on { opacity: 1; }
    #wheel .sector-outer.demo-focus,
    #wheel .sector-inner.demo-focus {
      stroke: #fff5b0;
      stroke-width: 6;
      filter: drop-shadow(0 0 5px rgba(213, 155, 25, .95));
    }
    #wheel .label-outer.demo-focus,
    #wheel .label-inner.demo-focus {
      font-weight: 700;
      filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #f4c95a);
    }
    .mobile-correspondences {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      position: relative;
      width: min(92vw, 42rem);
      margin: .45rem auto 1.5rem;
      height: 16.5rem;
      box-sizing: border-box;
      padding: .65rem .75rem .75rem;
      border: 1px solid var(--line);
      border-top: 4px solid var(--principle-color, var(--gold));
      background: #faf4e6 url('assets/parchment-base.webp') center / cover;
      color: var(--ink);
      box-shadow: 0 5px 18px rgba(31, 21, 5, .14);
      transition: border-color .25s ease, opacity .18s ease, transform .18s ease;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .mobile-correspondences.open { visibility: visible; opacity: 1; pointer-events: auto; }
    .mobile-correspondences.updating { opacity: .55; transform: translateY(3px); }
    .corr-close {
      position: absolute;
      top: .25rem;
      right: .35rem;
      width: 1.65rem;
      height: 1.65rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 1.4rem/1 serif;
      cursor: pointer;
    }
    .corr-source {
      font-size: .62rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #6e521e;
    }
    .corr-title {
      margin: .1rem 1.7rem .4rem 0;
      font-family: 'Marcellus', serif;
      font-size: .96rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .corr-grid { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: .28rem; min-height: 0; }
    .corr-field {
      display: grid;
      grid-template-columns: minmax(4.7rem, 27%) minmax(0, 1fr);
      align-items: start;
      gap: .45rem;
      min-height: 0;
      padding-top: .32rem;
      border-top: 1px solid rgba(0, 0, 0, .24);
      overflow: hidden;
    }
    .corr-field.demo-focus {
      background: rgba(255, 239, 166, .72);
      box-shadow: 0 0 0 3px rgba(222, 169, 43, .42), 0 0 15px rgba(222, 169, 43, .6);
    }
    .corr-key {
      font-size: clamp(.52rem, 2.25vw, .61rem);
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .corr-value {
      font-size: clamp(.68rem, 2.9vw, .82rem);
      line-height: 1.22;
      overflow: hidden;
    }
  }
  @media (min-width: 640px) and (max-width: 899px) {
    .mobile-correspondences { height: 10.5rem; }
    .corr-grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: minmax(0, 1fr); gap: .65rem; }
    .corr-field { display: block; }
    .corr-key { margin-bottom: .2rem; }
  }
  /* The outer ring reaches r=344 in a 700-unit viewBox, so its halo — and the
     counting ring past it — would be clipped flat by the SVG viewport. Let
     them spill over the edge. */
  svg {
    width: 100%; height: 100%; display: block; overflow: visible;
    -webkit-user-select: none; user-select: none;
  }
  .ring-group { cursor: grab; }
  .ring-group:active { cursor: grabbing; }
  /* Promoted only while turning: a permanent layer would cost memory for a
     filtered subtree that is usually still. */
  body.spinning .ring-group { will-change: transform; }

  .sector-outer, .sector-inner {
    fill: var(--seg-color, var(--paper));
    stroke: var(--line);
    stroke-width: 1.4;
    stroke-linejoin: round;
    transition: fill .22s ease;
  }
  /* The wheel's outer rim and the two inner guide circles. */
  .wheel-rim  { stroke: var(--line); stroke-width: 1.4; }
  .wheel-guide { stroke: var(--line); stroke-width: 1; }

  /* ---- The counting ring ------------------------------------------------
     The twelve principle numbers used to be struck into the wedges, one set
     per wheel, each of them lighting up with its sector — twenty-four numerals
     competing with the words printed over them. They live outside the wheel
     now: a single scale on its own circle, clear of the rim and of the
     needle's tip, reading whichever wheel the hand last touched and turning
     with it (see numTrack in the JS). Nothing here lights up. It is the ruler
     the wheel is read against, not another thing on the wheel. */
  .num-ring { transition: opacity .18s ease; }
  .num-ring.switching { opacity: 0; }            /* while it changes wheels */
  .wheel-num {
    font-family: 'Marcellus', serif;
    font-size: 23px;
    fill: var(--ink);
    text-anchor: middle;
    pointer-events: none; user-select: none;
  }
  /* User units, so the numerals shrink with the wheel — on a phone that is a
     ten-pixel numeral. A little more size buys them back. */
  @media (max-width: 520px) { .wheel-num { font-size: 27px; } }

  /* Label text: black ink on the white wheel. */
  .label-outer, .label-inner {
    fill: var(--ink);
    font-family: 'Marcellus', serif;
    text-anchor: middle;
    pointer-events: none; user-select: none;
  }
  .label-outer { font-size: 15.5px; letter-spacing: .04em; }
  .label-inner { font-size: 13px; }

  /* ============ THE CENTRE DISC ============
     A plain white disc with a black outline; the result reads inside it. */
  .hub {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 42%; height: 42%; border-radius: 50%;
    overflow: hidden; isolation: isolate;
    background: var(--paper);
    border: 1.4px solid var(--line);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 4%; gap: .35rem;
  }
  .hub .result, .hub button { position: relative; z-index: 2; }
  .hub.demo-result {
    box-shadow: 0 0 0 4px rgba(255, 247, 189, .88), 0 0 24px 10px rgba(213, 155, 25, .65);
  }

  .hub .eyebrow { display: none; }
  .hub .match {
    font-family: 'Marcellus', serif;
    font-size: clamp(.68rem, 2vw, .92rem);
    line-height: 1.3; color: var(--ink);
  }
  /* The fit chooses the breaks, so each line is its own row and must not wrap. */
  .hub .result .line { display: block; white-space: nowrap; }
  /* Width is deliberately near the full diameter and the size is set from JS
     (fitHubText) so the block grows until its corners touch the inner circle. */
  .hub .result {
    font-size: clamp(.62rem, 1.8vw, .8rem);   /* fallback until JS measures */
    font-family: 'Marcellus', serif;          /* the book's voice, not the UI's */
    color: var(--ink); line-height: 1.24;
    width: 100%;
  }
  .hub button {
    margin-top: .25rem;
    font-family: 'Spectral', serif;
    font-size: .66rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); background: var(--result-color, var(--paper));
    border: 1px solid var(--line); border-radius: 2rem;
    padding: .38em 1.1em; cursor: pointer;
    transition: background .25s, color .25s;
  }
  @media (max-width: 520px) {
    .hub { padding: 3%; gap: .2rem; }
    .hub .eyebrow { display: none; }
    .hub .match { font-size: .68rem; }
    .hub button { font-size: .56rem; padding: .3em .8em; }
    .sector-outer, .sector-inner { stroke-width: 2; }
    body.spinning .sector-outer, body.spinning .sector-inner { transition: none; }
  }
  .hub button:hover, .hub button:focus-visible {
    background: var(--ink); color: var(--paper); outline: none;
  }

  .needle {
    position: absolute; top: -2.5%; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 26px solid var(--line);
    z-index: 2; pointer-events: none;
  }

  .hint {
    z-index: 1; font-size: .78rem; color: var(--ink);
    font-style: italic; text-align: center; padding: 0 1rem;
  }

  .controls {
    display: flex; gap: 2rem; justify-content: center;
    padding: .8rem 1rem 2rem; z-index: 1; flex-wrap: wrap;
  }
  .control-block { text-align: center; }
  .control-block .name {
    font-size: .66rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink); margin-bottom: .35rem;
  }
  .control-block .btns { display: flex; gap: .5rem; justify-content: center; }
  .control-block button {
    width: 2.3rem; height: 2.3rem; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); font-size: 1rem; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .control-block button:hover, .control-block button:focus-visible {
    background: var(--ink); color: var(--paper); outline: none;
  }

  footer {
    font-size: .7rem; color: var(--ink);
    padding-bottom: 1.5rem; z-index: 1; text-align: center; max-width: 34rem;
  }
  footer a.deuter-link {
    display: inline-block; margin-top: .55rem;
    color: var(--ink); text-decoration: none;
    font-size: .78rem; letter-spacing: .04em;
  }
  footer a.deuter-link:hover, footer a.deuter-link:focus-visible {
    text-decoration: underline; outline: none;
  }

  /* ---- modal ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    padding: 1.2rem; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--paper); color: var(--ink);
    max-width: 34rem; width: 100%; max-height: 84vh; overflow-y: auto;
    border-radius: 6px; border: 1px solid var(--line);
    padding: 2.1rem 2.3rem 1.9rem; position: relative;
  }
  .modal .eyebrow {
    font-size: .6rem; letter-spacing: .28em;
    text-transform: uppercase; color: var(--ink);
  }
  .modal h2 {
    font-family: 'Marcellus', serif; font-weight: 400;
    font-size: 1.35rem; margin: .35rem 0 .9rem; color: var(--ink);
  }
  /* Result hierarchy remains bold outside the guided tutorial as well. */
  #overlay .modal .eyebrow,
  #overlay .modal h2,
  #overlay .modal .field .k,
  #overlay .modal .impulse .k {
    font-weight: 700;
  }
  .modal .rule {
    height: 1px;
    background: var(--line);
    margin-bottom: 1rem;
  }
  .modal p { font-size: .96rem; line-height: 1.62; margin-bottom: .9rem; }
  .modal .field { margin-bottom: 1.15rem; }
  .modal .field .k {
    font-size: .72rem; letter-spacing: .2em; text-transform: uppercase;

их побуждений"]},"1-0":{"m":["Знаток — это тот, у кого есть смелость","отличиться и защитить себя"],"a":"То, как развивается семейная жизнь и жилищные условия их друзей, - это то, как развиваются их удовольствие от жизни и управление финансами.","i":"То, как развивается смелость выделиться, — это то, как развивается ваше удовольствие от жизни и то, как вы справляетесь с финансами.","b":"Функционирование головы, желчного пузыря и мышц матерей, свекров и двоюродных братьев и сестер по отцовской линии их друзей отражает их удовольствие от жизни и управление финансами (функционирование их шеи, миндалин, желез и вен).","s":["Чем больше вы развиваете инициативу по утверждению собственных ценностей, тем больше вы развиваете","способность дифференцировать","экономические возможности","способность защитить себя","способность получать удовольствие"]},"0-1":{"m":["Знаток – это тот, кто ценит","самоутвердиться в жизни"],"a":"То, как развиваются способы обращения с финансами братьев, сестер и соседей их друзей, соответствует их способам получения удовольствия от жизни и управления финансами.","i":"То, как развивается уверенность в самоутверждении в жизни, — это то, как развивается ваше удовольствие от жизни и то, как вы справляетесь со своими финансами.","b":"Функционирование шеи, миндалин, желез и вен братьев и сестер и соседей их друзей отражает их удовольствие от жизни и управление финансами (функционирование их шеи, миндалин, желез и вен).","s":["Чем больше вы это цените","способность проявлять инициативу","напористость","выражение естественных физических побуждений","спортивные способности","тем больше они развиваются","Умение дифференцировать","экономические навыки","Умение защитить себя","Умение получать удовольствие","Возможность создать свое пространство."]},"11-2":{"m":["Знаток — это тот, кто разрабатывает альтернативы для улучшения партнерства."],"a":"То, как их дяди и тети по отцовской линии развивают свои ремесленные навыки, - это то, как развивается их удовольствие от жизни и управление финансами.","i":"То, как развивается выражение собственных ожиданий, - это то, как развивается их удовольствие от жизни и обращение с финансами.","b":"Функциональность легких, рук, органов речи и слуха ее дядей и теток по отцовской линии отражает ее удовольствие от жизни и управление финансами (функциональность ее шеи, миндалин, желез и вен).","s":["Чем больше у вас развивается способность учиться","реализовать свои собственные мечты","разрабатывать альтернативы","раскрыть и проанализировать предысторию","выражать свои права и обязанности","тем больше они развиваются","Умение дифференцировать","экономические навыки","Умение защитить себя","Умение получать удовольствие","Возможность создать свое пространство."]},"10-3":{"m":["Знаток - это","кто независим в своем благополучии"],"a":"То, как развиваются благополучие, семейная жизнь и условия жизни их друзей, зависит от того, как развиваются их наслаждение жизнью и обращение с финансами.","i":"То, как развивается их чувство благополучия в результате реформ и совместных предприятий, соответствует тому, как развивается их удовольствие от жизни и управление финансами.","b":"Функциональность грудной клетки, желудка и слизистых оболочек ее друзей и партнеров ее детей отражает их удовольствие от жизни и то, как они распоряжаются финансами (функциональность их горла, миндалин, желез и вен).","s":["Чем больше вы развиваете доверие","к свободе и независимости","изменить","организовать свое свободное время","совместным предприятиям","чтобы воспользоваться возможностями","проявить свою оригинальность","тем больше они развиваются","Умение дифференцировать","экономические навыки","Умение защитить себя","Умение получать удовольствие","Возможность создать свое пространство.","Пример для самозанятой женщины (клиента) 4 из 11 (матери своих друзей) = ее 2-й LP.","У матери ее подруги (2-я ЛП) проблемы с сердцем. Чтобы классифицировать ее сердце, вам нужно начать со 2-го LP. Продолжайте считать пять, и в результате вы получите шестой ЛП (2+5-1=6) — состояние трудовых отношений. За это время, когда матери подруги сделали операцию по шунтированию, она в тот месяц вообще не работала и, следовательно, не зарабатывала денег. Мама подруги отражает свои финансы (ее 2-й ЛП), поэтому с деньгами у нее тоже были проблемы. Вскоре после успешной операции шунтирования матери ее подруги все вернулось на круги своя.","Например: 5 из 10 = 2LP. У моего отца было два сердечных приступа за один год. В том же году я продал два своих ресторана и спекулировал на этих деньгах казино. Я потерял очень много денег. Я израсходовал все свои сбережения."]},"9-4":{"m":["Знаток — это тот, кто любит играть и получать удовольствие от работы."],"a":"То, как развивается самореализация ее отца, свекрови и двоюродных братьев по материнской линии, - это то, как развивается ее наслаждение жизнью и обращение с финансами.","i":"То, как развивается способность действовать в соответствии со своими целями и на работе, — это то, как развивается их удовольствие от жизни и управление финансами.","b":"Функциональность сердца, кровообращения, 5-9 позвонков вашего отца, ее свекрови и двоюродных братьев по материнской линии отражают ее удовольствие от жизни и управление финансами (функциональность ее шеи, миндалин, желез и вен).","s":["Чем больше вы развиваете независимость и готовность действовать","открытие и защита ваших собственных прав","к ответственности перед жизнью","развивайте свои собственные цели","исполнить свое призвание","тем больше они развиваются","Умение дифференцировать","экономические навыки","Умение защитить себя","Умение получать удовольствие","Возможность создать свое пространство."]},"8-5":{"m":["Знаток — это тот, кто работает, чтобы найти удовлетворение.","«Честно ли выражение своих чувств –","ваша внутренняя ценность чудесным образом возрастает».","Добрин Михайлович Антонов"],"a":"То, как развиваются рабочие отношения с вашими зятьями, невестками, братьями и сестрами вашего спутника жизни, — это то, как развивается ваше удовольствие от жизни и то, как вы справляетесь со своими финансами.","i":"То, как развивается работа по улучшению их жизни, — это то, как развивается их удовольствие от жизни и обращение с финансами.","b":"Функционирование органов пищеварения и кишечника ее братьев и невесток, а также братьев и сестер ее спутника жизни отражает их удовольствие от жизни и управление финансами (функционирование их горла, миндалин, желез и вен).","s":["Чем больше вы развиваете свои собственные методы работы в жизни","чтобы учиться дальше","к толерантности","выработать свою собственную жизненную философию","найти свой смысл в мире","улучшить что-то и спроектировать это оптимально","тем больше они развиваются","Умение дифференцировать","экономические навыки","Умение защитить себя","Умение получать удовольствие","Возможность создать свое пространство."]},"7-6":{"m":["Знаток — это тот, кто связывает себя любовью"],"a":"То, как развиваются отношения вашего бывшего партнера, зависит от того, как развивается его удовольствие от жизни и управление финансами.","i":"То, как развивается любовь с точки зрения ее планов и обязательств, - это то, как развивается ее удовольствие от жизни и управление финансами.","b":"Функционирование почек, мочевого пузыря и поясницы их бывших партнеров отражает их удовольствие от жизни и управление финансами (функционирование их шеи, миндалин, желез и вен).","s":["Чем больше вы развиваете навыки принятия решений","разработать свою собственную жизненную программу и жить в соответствии с ней","разрабатывать свои собственные планы и концепции","идти своим путем","вступать в отношения","Чтобы обрести власть над собой","изменить","освободиться от ограничений","тем больше они развиваются","Умение дифференцировать","экономические навыки","Умение защитить себя","Умение получать удовольствие","Возможность создать свое пространство."]},"6-7":{"m":["Знаток – это тот, кто идет по пути любви."],"a":"То, как развиваются планы их партнеров, детей их братьев, сест и"]},"7-11":{"m":["Любовь – это секрет того, как сделать шаг","связать себя"],"a":"То, как сбываются мечты их бывших партнеров и развивается их чувство счастья, - это то, как развивается их любовь и жизнь в отношениях.","i":"То, как развивается реализация мечты и ощущение счастья в их совместном образе жизни, - это то, как развивается их жизнь в любви и отношениях.","b":"Функциональность стоп, шишковидной железы и солнечного сплетения вашего бывшего партнера отражает его любовную и семейную жизнь (функциональность его почек, мочевого пузыря и поясницы).","s":["Чем больше вы развиваете способность реализовывать свои собственные идеи и мечты","разрабатывать свои собственные планы и концепции","идти своим путем","вступать в отношения","Чтобы обрести власть над собой","освободиться от ограничений","тем больше он развивается","Контактная способность","Возможность встретиться","Способность партнера","Умение идти на компромисс","Способность принимать решения","Мирная способность","художественные навыки","Пример заказчика из 5 из 3 = 7-й ЛП","Сестра моего клиента (3-я ЛП) внезапно забеременела. То есть в их 7-м LP. Она встретит человека, в которого внезапно влюбится. Для вас дети ваших братьев и сестер попадают в вашу 7-ю ЛП. И [на самом деле](http://www.google.de/url?sa=t&source=web&cd=3&ved=0CC0QFjAC&url=http%3A%2F%2Fwww.dict2.de%2Fueberstellen %2FНемецко-Английский%2Ftats%25E4tzlich%2C494289.html&ei=3X5mTfblEIrLswatlsXaDA&usg=AFQjCNFm96rd_VsevvgAyf5ain3O5EhcIQ), она влюбилась. Развитие этого партнерства отражается на состоянии здоровья рожденного ребенка ее сестры. Если бы у этой женщины был партнер, в ее жизни сложились бы новые контакты.","В этом случае вам также придется посмотреть, хотят ли этого ребенка обе стороны или только одна сторона. Решения о новом партнерстве могут быть приняты таким же образом. Если ребенок развивается здоровым, новые отношения также будут развиваться здоровыми."]},"7-0":{"m":["Реализация собственных концепций означает","иметь смелость идти ествените физически пориви"]},"1-11":{"m":["Този, който следва собствените си идеи, е смел","радва се на живота"],"a":"Начинът, по който се развиват реализацията на семейните мечти и условията на живот на техните приятели, е начинът, по който се развива тяхната асертивност, самоутвърждаване и инстинктивен живот.","i":"Начинът, по който се развива реализацията на мечтите им по отношение на техния живот с удоволствие и финанси, е начинът, по който се развива тяхната увереност, самоутвърждаване и инстинктивен живот.","b":"Функционалността на стъпалата, слънчевия сплит и епифизната жлеза на майките и свекърите на техните приятели отразяват тяхната увереност или самоутвърждаване и инстинктивен живот (функционалността на главата, жлъчния мехур и мускулите им).","s":["Колкото повече алтернативи се разработват","икономическите възможности","способността да се защитава","способността да се наслаждавате","способността да създадете свое собствено пространство","толкова повече се развиват","успехът на себереализацията и независимостта","асертивността","израз на естествените физически пориви"]},"1-0":{"m":["Ценител е този, който има смелостта","за да се разграничите и защитите"],"a":"Начинът, по който се развиват семейният живот и условията на живот на техните приятели, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","i":"Начинът, по който се развива смелостта да се отличаваш, е начинът, по който се развива удоволствието ти от живота и начина, по който се справяш с финансите.","b":"Функционирането на главата, жлъчния мехур и мускулите на майките, свекърите и братовчедите, братовчедите по бащина линия на техните приятели, отразява тяхното удоволствие от живота и управлението на финансите (функционирането на техните вратове, сливици, жлези и вени).","s":["Колкото повече развивате инициативата да отстоявате собственото си чувство за ценности, толкова повече се развивате","способността за разграничаване","икономическите възможности","способността да се защитите","способността да се наслаждавате"]},"0-1":{"m":["Познавателят е някой, който цени","да се утвърдиш в живота"],"a":"Начинът, по който братята и сестрите на техните приятели и съседите им се развиват в управлението на финансите, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","i":"Начинът, по който се развива сигурността при утвърждаването ви в живота, е начинът, по който се развива удоволствието ви от живота и начина, по който се справяте с финансите си.","b":"Функционирането на шията, сливиците, жлезите и вените на братята и сестрите и съседите на техните приятели отразява тяхното удоволствие от живота и управлението на финансите (функционирането на шията, сливиците, жлезите и вените им).","s":["Колкото повече го цените","способност за поемане на инициатива","асертивността","израз на естествените физически пориви","спортните способности","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство"]},"11-2":{"m":["Познавач е някой, който разработва алтернативи за подобряване на партньорството"],"a":"Начинът, по който техните чичовци и лели по бащина линия развиват занаятчийските си умения, е начинът, по който се развиват удоволствието от живота и управлението на финансите.","i":"Начинът, по който се развива изразяването на собствените очаквания, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","b":"Функционалността на белите дробове, ръцете, говора и слуховите органи на нейните чичовци и лели по бащина линия отразяват нейното удоволствие от живота и управлението на финансите (функционалността на врата, сливиците, жлезите и вените).","s":["Колкото повече развивате способността за учене","да реализираш собствените си мечти","за разработване на алтернативи","открийте и анализирайте фонове","изразяват собствените си права и отговорности","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство"]},"10-3":{"m":["Познавач е","който е независим в своето благополучие"],"a":"Начинът, по който се развива благосъстоянието, семейният живот и условията на живот на техните приятели, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","i":"Начинът, по който се развива чувството им за благополучие в усилията им за реформи и съвместни предприятия, е начинът, по който се развиват удоволствието от живота и управлението на финансите.","b":"Функционалността на гръдния кош, стомаха и лигавиците на нейните приятели и партньорите на децата й отразява тяхното удоволствие от живота и начина, по който управляват финансите (функционалността на гърлото, сливиците, жлезите и вените им).","s":["Колкото повече развивате доверие","към свободата и независимостта","да се промени","да организира свободното си време","към съвместни предприятия","да се възползват от възможностите","изразете собствената си оригиналност","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство","Пример за самостоятелно заета жена (клиент) 4 от 11 (майките нейни приятели) = нейният 2-ри албум.","Майката на нейния приятел (2-ри LP) има проблеми със сърцето. За да класифицирате сърцето й, трябва да отидете от 2-ри LP. Продължете да броите пет и това води до вашия 6-ти LP (2+5-1=6), състоянието на трудовите взаимоотношения. През това време, когато майката на приятеля й беше оперирана с байпас, тя изобщо не работеше този месец и следователно не печелеше пари. Майката на приятелката отразява нейните финанси (нейния 2-ри LP), така че тя също имаше проблеми с парите. Малко след успешната операция за поставяне на байпас на майката на нейна приятелка, всичко се нормализира.","Например: 5 от 10 = 2LP. Баща ми имаше два инфаркта за една година. През същата година продадох двата си ресторанта и спекулирах парите в казиното. Загубих страшно много пари. Изразходвах всичките си спестявания."]},"9-4":{"m":["Ценител е някой, който обича да играе и да се забавлява на работа"],"a":"Начинът, по който се развива самореализацията на нейния баща, свекърва и братовчедите по майчина линия, е начинът, по който се развива нейното удоволствие от живота и управлението на финансите.","i":"Начинът, по който се развива способността да действат по отношение на техните цели и в работата, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","b":"Функционалността на сърцето, кръвообращението, 5-ти - 9-ти гръбначен прешлен на вашия баща, нейната свекърва и братовчедите от страна на майка й отразяват нейното удоволствие от живота и управлението на финансите (функционалността на нейния врат, сливици, жлези и вени).","s":["Колкото повече развивате независимост и желание за действие","откриването и налагането на вашите собствени права","на отговорност към живота","развийте свои собствени цели","да изпълни призванието си","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство"]},"8-5":{"m":["Познавателят е някой, който работи, за да намери удовлетворение","„Честно ли е изразяването на вашите чувства –","вашата присъща стойност се развива чудесно.","Добрин М. Антонов"],"a":"Начинът, по който се развиват работните взаимоотношения на вашите зетове, снахите и братята и сестрите на вашия партньор в живота, е начинът, по който се развива вашето удоволствие от живота и начина, по който се справяте с финансите си.","i":"Начинът, по който се развива работата за подобряване на живота им, е начинът, по който се развиват удоволствието от живота и управлението на финансите.","b":"Функционирането на храносмилателните органи и червата на нейните братя и снахи, както и на братята и сестрите на нейния партньор в живота, отразява тяхното удоволствие от живота и управлението на финансите (функционирането на гърлото, сливиците, жлезите и вените им).","s":["Колкото повече развивате собствените си методи на работа в живота","да се образовате допълнително","към толерантност","да развиете своя собствена философия за живота","да намериш своя смисъл в света","да подобрим нещо и да го проектираме оптимално","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство"]},"7-6":{"m":["Ценител е някой, който се обвързва от любов"],"a":"Начинът, по който се развива връзката на бившия ви партньор, е начинът, по който се развива удоволствието от живота и управлението на финансите.","i":"Начинът, по който любовта се развива по отношение на нейните планове и ангажираност, е начинът, по който се развива удоволствието от живота и управлението на финансите.","b":"Функционирането на бъбреците, пикочния мехур и слабините на техните бивши партньори отразява тяхното удоволствие от живота и тяхното боравене с финансите (функционирането на врата, сливиците, жлезите и вените).","s":["Колкото повече развивате умения за вземане на решения","да съставите собствена жизнена програма и да живеете според нея","разработете свои собствени планове и концепции","да вървиш по своя път","да влиза в отношения","Да придобиеш власт над себе си","да се промени","да се освободите от ограниченията","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство"]},"6-7":{"m":["Ценител е някой, който следва пътя на любовта"],"a":"Начинът, по който се развиват плановете на техните партньори и децата на техните братя и сестри и съседи, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","i":"Начинът, по който се развиват плановете и споделеният начин на живот на връзката им, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","b":"Функционалността на половите и отделителните органи на вашия партньор в живота, децата на вашите братя и сестри и съседи отразява вашето удоволствие от живота и начина, по който се справяте с финансите си (функционалността на гърлото, сливиците, жлезите и вените).","s":["Колкото повече вървите по своя път и формирате собствено мнение","способността да се осъществява контакт","способността за партньорство","способността да флиртува и съблазнява","способността за компромис","способността да избираш","артистичните способности","способността да направите живота си приятен","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство"]},"5-8":{"m":["Познавач е човек, който се наслаждава на работата"],"a":"Начинът, по който се развива успехът на техните чичовци и лели по майчина линия, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","i":"Начинът, по който се развива подобряването на техните методи на работа, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","b":"Функционирането на бедрата, хранителната функция (нарастване на дебелината) и черния дроб на нейните чичовци и лели по майчина линия отразяват нейното удоволствие от живота и управлението на финансите (функционирането на врата, сливиците, жлезите и вените).","s":["Колкото повече се образовате и рекламирате","Намиране на реализация в работата","към вашия собствен метод на работа","да изразите собствените си чувства","към самокритика","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитит ето на финансите (функционалността на нейната врата, сливиците, жлезите и вените).","s":["За колкото повече съвместно решаване се развивате","вашите собствени чувства и нужди","Да създаваме и предаваме сигурност","съпричастност към другите","приемане и приемане на други хора","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство"]},"2-11":{"m":["Познавач е някой, който разработва алтернативи,","за подобряване на партньорството"],"a":"Начинът, по който се развиват реализацията на мечтите на техните братя и сестри, съседите и децата на техните приятели, е начинът, по който се развиват удоволствието от живота и управлението на финансите.","i":"Начинът, по който изразяват собствените си права и собствените си отговорности, е начинът, по който се развива тяхното удоволствие от живота и управлението на финансите.","b":"Функционирането на краката, епифизната жлеза и слънчевия сплит на нейните братя и сестри, съседите и децата на нейните приятели отразява нейното удоволствие от живота и управлението на финансите (функционирането на врата, сливиците, жлезите и вените).","s":["Колкото повече алтернативи се разработват","способността за общуване","способността да се обсъжда","ръчни умения","способността да се учи","толкова повече се развиват","Способност за разграничаване","икономически умения","Способност да се защитите","Способност да се наслаждавате","Възможност за създаване на собствено пространство"]},"2-0":{"m":["Успехът в партньорството се крие в поемането на инициатива за подобряване на нещо"],"a":"Начинът, по който се развива асертивността на техните братя и сестри, съседите и децата на техните приятели, е начинът, по който се развива техният комуникативен живот и успехът на партньорството им.","i":"Начинът, по който се развива мотивацията в тяхната комуникация, е начинът, по който се развива техният комуникативен живот и успехът н благополучие означава","за приятната страна на живота, да поемеш отговорност"],"a":"Начинът, по който се развива способността на нейния баща, нейната свекърва и братовчедите по майчина линия да обичат и общуват, е начинът, по който се развива нейното чувство за благополучие, нейното семейство и нейните условия на живот.","i":"Начинът, по който се развива любовта по отношение на техните цели и кариера, е начинът, по който се развиват тяхното благополучие, семейството и условията им на живот.","b":"Функционирането на бъбреците, пикочния мехур и слабините на нейния баща, нейната свекърва и братовчедите от страна на майка й отразяват нейното благосъстояние, нейното семейство и нейните условия на живот (функционирането на гърдите, стомаха и лигавиците).","s":["Колкото повече развивате умения за вземане на решения","откриване на собствените ви права и отстояване на себе си","на отговорност към живота","развийте свои собствени цели","да изпълни призванието си","към приемственост и издръжливост","толкова повече се развиват","Да създаваме и предаваме сигурност","да чуеш гласа на живота (собствената природа).","да приема и приема други хора"]},"8-7":{"m":["Грижата за собственото ви благополучие означава","да разработите своя собствена концепция, която ще подобри условията ви на живот"],"a":"Начинът, по който се развиват плановете на вашите зетове, снахите и братята и сестрите на вашите партньори в живота, е начинът, по който се развиват вашето благополучие, вашето семейство и вашите условия на живот.","i":"Начинът, по който се развиват плановете им за самореклама и щастие, е начинът, по който се развиват чувството им за благополучие, семейството и условията им на живот.","b":"Функционалността на половите и отделителните органи на нейните шуреи и братята и сестрите на нейния партньор в живота отразяват тяхното благосъстояние, тяхното семейство и условията им на живот (функционалността на техните гърди, стомах и лигавици).","s":["Колкото повече развивате собствените си концепции и формирате собственото си мнение","да се образовате допълнително","към толерантност","за да популяризирате и направите себе си щастливи","да подобрим нещо и да го проектираме оптимално","толкова повече се развиват","Да създаваме и предаваме сигурност","да чуеш гласа на живота (собствената природа).","да приема и приема други хора"]},"7-8":{"m":["Грижата за собственото ви благополучие означава","Развийте представа за връзката"],"a":"Начинът, по който се развиват успехът на плановете и отношенията на техните бивши партньори, е начинът, по който се развива тяхното благосъстояние, семейството и условията им на живот.","i":"Начинът, по който се развива по-нататъшното развитие и подобряване на тяхната връзка и насладата от съвместния живот, е начинът, по който се развива тяхното чувство за благополучие, тяхното семейство и техните условия на живот.","b":"Функционалността на бедрата, хранителната функция (нарастване на дебелината) и черния дроб на техните бивши партньори и бащите на техните приятели отразяват тяхното благосъстояние, семейството и условията им на живот (функционалността на гърдите, стомаха и лигавиците).","s":["Колкото повече се образовате и рекламирате","да съставите собствена жизнена програма и да живеете според нея","разработете свои собствени планове","да вървиш по своя път","Да придобиеш власт над себе си","за постигане на свобода от ограниченията","толкова повече се развиват","Да създаваме и предаваме сигурност","да чуеш гласа на живота (собствената природа).","да откриеш собствената си идентичност","да приема и приема други хора"]},"6-9":{"m":["Грижата за собственото ви благополучие означава","да вземе правото на избор","„Ако вашият партньор е недоволен от целта си –","Тогава и вашите чувства не знаят много.","Добрин М. Антонов"],"a":"Начинът, по който се развиват целите и кариерите на вашия партньор в живота и децата на вашите братя и сестри и съседи, е начинът, по който се развива вашето чувство за благополучие, вашето семейство и вашите условия на живот.","i":"Начинът, по който се развива значението на тяхното партньорство и техните контакти, е начинът, по който се развива тяхното чувство за благополучие, семейството и условията им на живот.","b":"Функционалността на структурата на кожата и костите, коленете, ставите, зъбите на вашия партньор в живота, децата на вашите братя и сестри и съседи отразяват вашето благополучие, вашето семейство и вашите условия на живот (функционалността на гърдите, стомаха и лигавиците).","s":["Колкото повече поемате отговорност и развивате отговорност","способността да се осъществява контакт","способността за партньорство","способността за компромис","способността да се вземат решения","артистичните способности","толкова повече се развиват","Да създаваме и предаваме сигурност","да чуеш гласа на живота (собствената природа)."]},"5-10":{"m":["Грижата за собственото ви благополучие означава","свободно и независимо изразяване на чувства"],"a":"Начинът, по който се развиват усилията за реформи и съвместните предприятия на нейните чичовци и лели по майчина линия, е начинът, по който се развива нейното чувство за благополучие, семейството и условията й на живот.","i":"Начинът, по който се развиват усилията за реформи и участието им на работното място и в ежедневието им, е начинът, по който се развива тяхното чувство за благополучие, тяхното семейство и техните условия на живот.","b":"Функционалността на долните крака, прасците, пулсът и дишането, мозъчните обвивки и гръбначния мозък на нейните чичовци и лели по майчина линия отразяват нейното благосъстояние, семейството и условията й на живот (функционалността на гърдите, стомаха и лигавиците).","s":["Колкото повече развивате участието","Намиране на реализация в работата","към вашите собствени методи на работа","да анализирам","в изразяването на собствените чувства","толкова повече се развиват","Да създаваме и предаваме сигурност","да чуеш гласа на живота (собствената природа).","да приема и приема други хора"]},"4-11":{"m":["Грижа ];

function polar(r, deg) {

  return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];

function sectorPath(r1, r2, a1, a2) {

/* ---- Fitting a label into its wedge -----------------------------------
   Everything here is in SVG user units, so one fit serves every screen: the
   viewBox scales the whole wheel, and text that clears the wedge at 700 units
   clears it at any rendered size.

   Each line is set on an arc concentric with the ring, so a line's room is
   simply the arc it sits on — length r·30° — and it needs its cap height to
   clear both the inner and outer arc. Curved text has no corners to catch on
   the rim, which is what a straight line had to be shrunk for. */

const NS = 'http://www.w3.org/2000/svg';
const XLINK = 'http://www.w3.org/1999/xlink';
const WEDGE_RAD = STEP * Math.PI / 180;    // angular width of one sector
const LBL_PAD = 9;          // clearance from the two arcs, user units
const LBL_LEAD = 1.12;      // line spacing, as a multiple of the font size
const LBL_HALFCAP = .38;    // half the cap height, in em
const LBL_SIDE = .88;       // fraction of the arc the line may use
const LBL_EASE = .95;       // final trim, so nothing sits tight to an edge

let measurer = null;
const textWidths = new Map();

/* Advance width of a string at font-size 100, in user units. Uses a hidden
   node with the real class so letter-spacing counts. */
let measureCtx = null;
function textWidth100(text, cls) {
  const key = cls + '|' + text;
  if (textWidths.has(key)) return textWidths.get(key);
  if (!measurer) {
    measurer = document.createElementNS(NS, 'text');
    measurer.setAttribute('visibility', 'hidden');
    measurer.setAttribute('x', -9999);
    svg.appendChild(measurer);
  }
  measurer.setAttribute('class', cls);
  measurer.style.fontSize = '100px';
  measurer.textContent = text;
  let w = measurer.getComputedTextLength();
  /* WebKit (Safari, and iOS browsers like DuckDuckGo that use it) can return 0
     from getComputedTextLength() on a hidden SVG <text> node — especially
     before the web font has settled — which would collapse every label to
     nothing. Fall back to a canvas measure, which needs no layout, and never
     cache a zero so a bad early read can't stick. */
  if (!(w > 0) && text) {
    const cs = getComputedStyle(measurer);
    if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
    measureCtx.font = `${cs.fontStyle} ${cs.fontWeight} 100px ${cs.fontFamily}`;
    w = measureCtx.measureText(text).width;
    const ls = parseFloat(cs.letterSpacing);          // resolved to px at 100px
    if (ls && isFinite(ls) && text.length > 1) w += ls * (text.length - 1);
  }
  if (w > 0) textWidths.set(key, w);
  return w > 0 ? w : 1;
}

/* Lines are costed by summing their atoms rather than measuring every candidate

function spaceWidth100(measure) {
  return measure('n n') - 2 * measure('n');
