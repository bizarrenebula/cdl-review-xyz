<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script>
/* "Request Desktop Site" on a phone only swaps the user-agent — it leaves the
   layout viewport at device-width because of the meta above, so a width-based
   breakpoint never fires and the mobile view stays. Detect a touch device whose
   UA has dropped its "Mobile" token (i.e. desktop mode is on) and widen the
   viewport, so the >=900px PC layout activates and scales to the screen. Runs
   before first layout to avoid a mobile flash; harmless on real desktops
   (no touch) and on phones in normal mode (UA still says "Mobile"). */
(function () {
  try {
    var touch = (navigator.maxTouchPoints || 0) > 1;
    var desktopUA = !/Mobile/i.test(navigator.userAgent);
    var smallScreen = Math.min(screen.width, screen.height) < 820;
    if (touch && desktopUA && smallScreen) {
      var m = document.querySelector('meta[name=viewport]');
      if (m) m.setAttribute('content', 'width=1024');
    }
  } catch (e) {}
})();
</script>
<title>Der Code des Lebens — Rad der 12 Lebensprinzipien (Originaltexte)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  /* ====================================================================
     BLANK VERSION — flat black-on-white.
     All colour lives in these three tokens; the app is otherwise a
     line drawing (black strokes/text on white). Redesign colour by
     editing these and LP_COLORS in the script.
     ==================================================================== */
  :root {
    color-scheme: light;   /* render light even when the OS is in dark mode */
    --paper: #fff;   /* page + every surface */
    --ink:   #000;   /* text */
    --line:  #000;   /* borders and strokes */
    --gold:  #b4872d; /* title and subtitle */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Spectral', Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---- language switch ---- */
  .lang-switch {
    position: fixed; top: .9rem; right: .9rem; z-index: 5;
    display: flex; gap: .3rem;
  }
  .lang-switch button {
    font-family: 'Spectral', serif;
    font-size: .72rem; letter-spacing: .12em;
    padding: .35em .7em;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2rem;
    color: var(--ink); cursor: pointer;
    transition: all .2s;
  }
  .lang-switch button.active,
  .lang-switch button:hover { background: var(--ink); color: var(--paper); border-color: var(--line); }

  .guide-help {
    position: fixed;
    top: .85rem; left: .9rem;
    z-index: 6;
    width: 2.15rem; height: 2.15rem;
    display: grid; place-items: center;
    border: 1px solid #c99a39;
    border-radius: 50%;
    background: rgba(4, 13, 34, .9);
    color: #f2cf78;
    font-family: 'Marcellus', serif;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 9px rgba(0, 0, 0, .28);
    transition: transform .18s ease, background .18s ease, color .18s ease;
  }
  .guide-help:hover, .guide-help:focus-visible {
    transform: scale(1.08);
    background: #f2cf78;
    color: #08142e;
    outline: none;
  }
  .guide-help.attention {
    animation: guide-pulse 1.4s ease-in-out infinite;
  }
  @keyframes guide-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(242, 207, 120, .62), 0 2px 9px rgba(0, 0, 0, .28); }
    50% { box-shadow: 0 0 0 9px rgba(242, 207, 120, 0), 0 2px 12px rgba(0, 0, 0, .4); }
  }
  .demo-balloon {
    position: fixed;
    left: 50%; top: 50%;
    z-index: 9;
    width: min(30rem, calc(100vw - 1rem));
    padding: 1rem 1.2rem;
    border: 3px solid #853b38;
    border-radius: 10px;
    background: #b85a56;
    color: #fff;
    font-size: clamp(1rem, 2.1vw, 1.18rem);
    line-height: 1.45;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, calc(-100% - 18px));
    box-shadow: 0 5px 20px rgba(15, 10, 2, .28);
    transition: left .8s cubic-bezier(.2, .72, .2, 1), top .8s cubic-bezier(.2, .72, .2, 1), opacity .25s ease;
  }
  .demo-balloon::after {
    content: '';
    position: absolute;
    left: 50%; bottom: -8px;
    width: 14px; height: 14px;
    transform: translateX(-50%) rotate(45deg);
    background: #b85a56;
    border-right: 3px solid #853b38;
    border-bottom: 3px solid #853b38;
  }
  .demo-balloon.on {
    opacity: 1;
    pointer-events: auto;
    cursor: pointer;
  }
  .demo-balloon.on:hover, .demo-balloon.on:focus-visible {
    border-color: #672724;
    box-shadow: 0 7px 24px rgba(15, 10, 2, .35), 0 0 0 3px rgba(242, 207, 120, .5);
    outline: none;
  }
  .demo-balloon .continue {
    display: block;
    margin-top: .5rem;
    font-size: .68em;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #fff3ed;
  }
  .demo-balloon.insist { animation: balloon-insist .48s ease both; }
  @keyframes balloon-insist {
    0%, 100% { transform: translate(-50%, calc(-100% - 18px)) rotate(0); }
    20% { transform: translate(-50%, calc(-100% - 18px)) rotate(-2deg) scale(1.035); }
    40% { transform: translate(-50%, calc(-100% - 18px)) rotate(2deg) scale(1.035); }
    60% { transform: translate(-50%, calc(-100% - 18px)) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(-50%, calc(-100% - 18px)) rotate(1.5deg) scale(1.015); }
  }
  .demo-balloon.below { transform: translate(-50%, 18px); }
  .demo-balloon.below.insist { animation-name: balloon-insist-below; }
  @keyframes balloon-insist-below {
    0%, 100% { transform: translate(-50%, 18px) rotate(0); }
    20% { transform: translate(-50%, 18px) rotate(-2deg) scale(1.035); }
    40% { transform: translate(-50%, 18px) rotate(2deg) scale(1.035); }
    60% { transform: translate(-50%, 18px) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(-50%, 18px) rotate(1.5deg) scale(1.015); }
  }
  .demo-balloon.below::after {
    top: -8px; bottom: auto;
    border: 0;
    border-left: 3px solid #853b38;
    border-top: 3px solid #853b38;
  }
  .demo-balloon.right {
    width: min(30rem, calc(100vw - 4.5rem));
    transform: translate(18px, -50%);
  }
  .demo-balloon.right::after {
    left: -8px; right: auto;
    top: var(--arrow-top, 50%); bottom: auto;
    transform: translateY(-50%) rotate(45deg);
    border: 0;
    border-left: 3px solid #853b38;
    border-bottom: 3px solid #853b38;
  }
  .demo-balloon.right.insist { animation-name: balloon-insist-right; }
  @keyframes balloon-insist-right {
    0%, 100% { transform: translate(18px, -50%) rotate(0); }
    20% { transform: translate(18px, -50%) rotate(-2deg) scale(1.035); }
    40% { transform: translate(18px, -50%) rotate(2deg) scale(1.035); }
    60% { transform: translate(18px, -50%) rotate(-1.5deg) scale(1.025); }
    80% { transform: translate(18px, -50%) rotate(1.5deg) scale(1.015); }
  }
  header {
    width: 100%;
    text-align: center;
    padding: 1.4rem 1rem .4rem;
    z-index: 1;
    background:
      linear-gradient(rgba(2, 9, 26, .12), rgba(2, 9, 26, .3)),
      url('assets/cosmic-header.webp') center 47% / cover no-repeat;
    border-bottom: 1px solid #9d7629;
    box-shadow: inset 0 -1px 0 rgba(255, 224, 145, .18);
  }
  header h1 {
    font-family: 'Marcellus', serif; font-weight: 700;
    font-size: clamp(1.55rem, 4.4vw, 2.5rem);
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold);
    background: linear-gradient(105deg, #9f7020 0%, #f8e4a0 24%, #c38d2c 49%, #ffe9a6 72%, #a06d1d 100%);
    background-size: 220% 100%;
    background-position: 42% 50%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .85));
  }
  header p {
    margin-top: .5rem; font-size: .92rem; font-weight: 300; font-style: italic;
    color: var(--gold); max-width: 36rem; margin-inline: auto;
    background: linear-gradient(100deg, #b9852a, #f5dda0 32%, #d5a746 62%, #ffe8ac);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .9));
  }

  /* The stage is the wheel's own box; the counting ring sits outside it, in
     the margin left here for it (see `svg { overflow: visible }` below). So
     the numbers cost the wheel about a tenth of its diameter and the whole
     composition still takes up what it always did. */
  .stage {
    position: relative;
    width: min(84vw, 580px, 66vh); aspect-ratio: 1;
    margin: .6rem auto; z-index: 1;
    touch-action: none;
  }

  /* Roomier spacing on larger (desktop) screens */
  @media (min-width: 760px) {
    header { padding: 2.6rem 1rem 1rem; }
    header p { margin-top: .9rem; }
    .stage { margin: 1.8rem auto; }
  }
  .mobile-correspondences { display: none; }
  @media (max-width: 899px) {
    header { transform: translateY(-.4rem); }
    .stage { margin-top: 2.2rem; }
    body.intro-running .stage { pointer-events: none; }
    .demo-balloon {
      width: min(22rem, calc(100vw - 2rem));
      padding: .65rem .8rem;
      font-size: clamp(.8rem, 3.4vw, .94rem);
      line-height: 1.32;
    }
    .demo-balloon.right { width: min(22rem, calc(100vw - 4.5rem)); }
    .demo-balloon .continue { margin-top: .35rem; font-size: .62em; }
    #wheel .label-outer,
    #wheel .label-inner,
    #wheel .wheel-num {
      fill: #000 !important;
      stroke: none !important;
    }
    .demo-light {
      position: fixed;
      left: 50%; top: 50%;
      width: 15px; height: 15px;
      z-index: 9;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      background: #fff8cf;
      border: 1px solid rgba(91, 61, 9, .8);
      box-shadow: 0 0 6px 3px #fff7bd, 0 0 18px 7px rgba(226, 174, 51, .72);
      transition: left .8s cubic-bezier(.2, .72, .2, 1), top .8s cubic-bezier(.2, .72, .2, 1), opacity .3s ease;
    }
    .demo-light.on { opacity: 1; }
    #wheel .sector-outer.demo-focus,
    #wheel .sector-inner.demo-focus {
      stroke: #fff5b0;
      stroke-width: 6;
      filter: drop-shadow(0 0 5px rgba(213, 155, 25, .95));
    }
    #wheel .label-outer.demo-focus,
    #wheel .label-inner.demo-focus {
      font-weight: 700;
      filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #f4c95a);
    }
    .mobile-correspondences {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      position: relative;
      width: min(92vw, 42rem);
      margin: .45rem auto 1.5rem;
      height: 16.5rem;
      box-sizing: border-box;
      padding: .65rem .75rem .75rem;
      border: 1px solid var(--line);
      border-top: 4px solid var(--principle-color, var(--gold));
      background: #faf4e6 url('assets/parchment-base.webp') center / cover;
      color: var(--ink);
      box-shadow: 0 5px 18px rgba(31, 21, 5, .14);
      transition: border-color .25s ease, opacity .18s ease, transform .18s ease;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .mobile-correspondences.open { visibility: visible; opacity: 1; pointer-events: auto; }
    .mobile-correspondences.updating { opacity: .55; transform: translateY(3px); }
    .corr-close {
      position: absolute;
      top: .25rem;
      right: .35rem;
      width: 1.65rem;
      height: 1.65rem;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 1.4rem/1 serif;
      cursor: pointer;
    }
    .corr-source {
      font-size: .62rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #6e521e;
    }
    .corr-title {
      margin: .1rem 1.7rem .4rem 0;
      font-family: 'Marcellus', serif;
      font-size: .96rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .corr-grid { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: .28rem; min-height: 0; }
    .corr-field {
      display: grid;
      grid-template-columns: minmax(4.7rem, 27%) minmax(0, 1fr);
      align-items: start;
      gap: .45rem;
      min-height: 0;
      padding-top: .32rem;
      border-top: 1px solid rgba(0, 0, 0, .24);
      overflow: hidden;
    }
    .corr-field.demo-focus {
      background: rgba(255, 239, 166, .72);
      box-shadow: 0 0 0 3px rgba(222, 169, 43, .42), 0 0 15px rgba(222, 169, 43, .6);
    }
    .corr-key {
      font-size: clamp(.52rem, 2.25vw, .61rem);
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .corr-value {
      font-size: clamp(.68rem, 2.9vw, .82rem);
      line-height: 1.22;
      overflow: hidden;
    }
  }
  @media (min-width: 640px) and (max-width: 899px) {
    .mobile-correspondences { height: 10.5rem; }
    .corr-grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: minmax(0, 1fr); gap: .65rem; }
    .corr-field { display: block; }
    .corr-key { margin-bottom: .2rem; }
  }
  /* The outer ring reaches r=344 in a 700-unit viewBox, so its halo — and the
     counting ring past it — would be clipped flat by the SVG viewport. Let
     them spill over the edge. */
  svg {
    width: 100%; height: 100%; display: block; overflow: visible;
    -webkit-user-select: none; user-select: none;
  }
  .ring-group { cursor: grab; }
  .ring-group:active { cursor: grabbing; }
  /* Promoted only while turning: a permanent layer would cost memory for a
     filtered subtree that is usually still. */
  body.spinning .ring-group { will-change: transform; }

  .sector-outer, .sector-inner {
    fill: var(--seg-color, var(--paper));
    stroke: var(--line);
    stroke-width: 1.4;
    stroke-linejoin: round;
    transition: fill .22s ease;
  }
  /* The wheel's outer rim and the two inner guide circles. */
  .wheel-rim  { stroke: var(--line); stroke-width: 1.4; }
  .wheel-guide { stroke: var(--line); stroke-width: 1; }

  /* ---- The counting ring ------------------------------------------------
     The twelve principle numbers used to be struck into the wedges, one set
     per wheel, each of them lighting up with its sector — twenty-four numerals
     competing with the words printed over them. They live outside the wheel
     now: a single scale on its own circle, clear of the rim and of the
     needle's tip, reading whichever wheel the hand last touched and turning
     with it (see numTrack in the JS). Nothing here lights up. It is the ruler
     the wheel is read against, not another thing on the wheel. */
  .num-ring { transition: opacity .18s ease; }
  .num-ring.switching { opacity: 0; }            /* while it changes wheels */
  .wheel-num {
    font-family: 'Marcellus', serif;
    font-size: 23px;
    fill: var(--ink);
    text-anchor: middle;
    pointer-events: none; user-select: none;
  }
  /* User units, so the numerals shrink with the wheel — on a phone that is a
     ten-pixel numeral. A little more size buys them back. */
  @media (max-width: 520px) { .wheel-num { font-size: 27px; } }

  /* Label text: black ink on the white wheel. */
  .label-outer, .label-inner {
    fill: var(--ink);
    font-family: 'Marcellus', serif;
    text-anchor: middle;
    pointer-events: none; user-select: none;
  }
  .label-outer { font-size: 15.5px; letter-spacing: .04em; }
  .label-inner { font-size: 13px; }

  /* ============ THE CENTRE DISC ============
     A plain white disc with a black outline; the result reads inside it. */
  .hub {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 42%; height: 42%; border-radius: 50%;
    overflow: hidden; isolation: isolate;
    background: var(--paper);
    border: 1.4px solid var(--line);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 4%; gap: .35rem;
  }
  .hub .result, .hub button { position: relative; z-index: 2; }
  .hub.demo-result {
    box-shadow: 0 0 0 4px rgba(255, 247, 189, .88), 0 0 24px 10px rgba(213, 155, 25, .65);
  }

  .hub .eyebrow { display: none; }
  .hub .match {
    font-family: 'Marcellus', serif;
    font-size: clamp(.68rem, 2vw, .92rem);
    line-height: 1.3; color: var(--ink);
  }
  /* The fit chooses the breaks, so each line is its own row and must not wrap. */
  .hub .result .line { display: block; white-space: nowrap; }
  /* Width is deliberately near the full diameter and the size is set from JS
     (fitHubText) so the block grows until its corners touch the inner circle. */
  .hub .result {
    font-size: clamp(.62rem, 1.8vw, .8rem);   /* fallback until JS measures */
    font-family: 'Marcellus', serif;          /* the book's voice, not the UI's */
    color: var(--ink); line-height: 1.24;
    width: 100%;
  }
  .hub button {
    margin-top: .25rem;
    font-family: 'Spectral', serif;
    font-size: .66rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); background: var(--result-color, var(--paper));
    border: 1px solid var(--line); border-radius: 2rem;
    padding: .38em 1.1em; cursor: pointer;
    transition: background .25s, color .25s;
  }
  @media (max-width: 520px) {
    .hub { padding: 3%; gap: .2rem; }
    .hub .eyebrow { display: none; }
    .hub .match { font-size: .68rem; }
    .hub button { font-size: .56rem; padding: .3em .8em; }
    .sector-outer, .sector-inner { stroke-width: 2; }
    body.spinning .sector-outer, body.spinning .sector-inner { transition: none; }
  }
  .hub button:hover, .hub button:focus-visible {
    background: var(--ink); color: var(--paper); outline: none;
  }

  .needle {
    position: absolute; top: -2.5%; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 26px solid var(--line);
    z-index: 2; pointer-events: none;
  }

  .hint {
    z-index: 1; font-size: .78rem; color: var(--ink);
    font-style: italic; text-align: center; padding: 0 1rem;
  }

  .controls {
    display: flex; gap: 2rem; justify-content: center;
    padding: .8rem 1rem 2rem; z-index: 1; flex-wrap: wrap;
  }
  .control-block { text-align: center; }
  .control-block .name {
    font-size: .66rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink); margin-bottom: .35rem;
  }
  .control-block .btns { display: flex; gap: .5rem; justify-content: center; }
  .control-block button {
    width: 2.3rem; height: 2.3rem; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); font-size: 1rem; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .control-block button:hover, .control-block button:focus-visible {
    background: var(--ink); color: var(--paper); outline: none;
  }

  footer {
    font-size: .7rem; color: var(--ink);
    padding-bottom: 1.5rem; z-index: 1; text-align: center; max-width: 34rem;
  }
  footer a.deuter-link {
    display: inline-block; margin-top: .55rem;
    color: var(--ink); text-decoration: none;
    font-size: .78rem; letter-spacing: .04em;
  }
  footer a.deuter-link:hover, footer a.deuter-link:focus-visible {
    text-decoration: underline; outline: none;
  }

  /* ---- modal ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    padding: 1.2rem; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--paper); color: var(--ink);
    max-width: 34rem; width: 100%; max-height: 84vh; overflow-y: auto;
    border-radius: 6px; border: 1px solid var(--line);
    padding: 2.1rem 2.3rem 1.9rem; position: relative;
  }
  .modal .eyebrow {
    font-size: .6rem; letter-spacing: .28em;
    text-transform: uppercase; color: var(--ink);
  }
  .modal h2 {
    font-family: 'Marcellus', serif; font-weight: 400;
    font-size: 1.35rem; margin: .35rem 0 .9rem; color: var(--ink);
  }
  .modal .rule {
    height: 1px;
    background: var(--line);
    margin-bottom: 1rem;
  }
  .modal p { font-size: .92rem; line-height: 1.6; margin-bottom: .8rem; }
  .modal .field { margin-bottom: .75rem; }
  .modal .field .k {
    font-size: .62rem; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink); margin-bottom: .15rem;
  }
  .modal .field .v { font-size: .9rem; line-height: 1.55; }
  .modal .close {
    position: absolute; top: .7rem; right: .85rem;
    background: none; border: none; font-size: 1.5rem; line-height: 1;
    color: var(--ink); cursor: pointer;
  }
  .modal .close:hover { color: var(--ink); }
  .modal .note {
    font-size: .78rem; font-style: italic; color: var(--ink);
    border-top: 1px dashed var(--line); padding-top: .7rem; margin-top: .4rem;
  }
  .demo-picker { max-width: 30rem; }
  .demo-picker h2 { padding-right: 1.5rem; }
  .demo-options { display: grid; gap: .65rem; margin-top: 1.2rem; }
  .demo-option {
    width: 100%;
    border: 1px solid var(--line);
    background: #faf4e6 url('assets/parchment-base.webp') center / cover;

  /* ============ PC LAYOUT — one wheel on a rectangular base ============
     Phones/tablets keep the two-wheel stage exactly as before: the .pcbase
     wrapper uses `display: contents`, so it vanishes from layout and .stage
     flows under the header as it always did. The side sector columns are
     display:none until we hit the desktop breakpoint.

     On a wide screen the area below the title becomes one rectangle (the
     "base"): a single wheel — the outer / person ring — is centred so its top
     and bottom touch the long sides of the rectangle, and the twelve
     principles are split into six boxes down each side, filling the space the
     circle leaves. */
  .pcbase { display: contents; }
  .base-svg { display: none; }

  @media (min-width: 900px) {
    /* Bind the complete desktop composition to the user's live viewport.
       Dynamic viewport units follow browser-chrome changes; the flexible base
       receives exactly the space left below the header. */
    html { width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
    body {
      justify-content: flex-start;
      width: 100%; height: 100%; height: 100dvh;
      min-height: 0; max-height: 100dvh;
      overflow: hidden;
    }
    header { padding: 1.4rem 1rem .5rem; flex: 0 0 auto; }
    header p {
      max-width: none;
      white-space: nowrap;
      font-size: clamp(.72rem, 1.2vw, 1.25rem);
    }

    /* The base rectangle. The twelve principle wedges (SVG) fill it and wrap
       around the wheel; the wheel sits on top, centred, and covers their inner
       ends, so a wedge shows only in the ring/corner the circle leaves free. */
    .pcbase {
      display: block;
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      align-self: center;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #faf4e6 url('assets/parchment-base.webp') center / cover no-repeat;
      min-height: 0;
      overflow: hidden;
      transform: translateX(0) rotate(0);
      opacity: 1;
      transition: transform .9s cubic-bezier(.16, .84, .25, 1.08), opacity .5s ease, box-shadow .9s ease;
      will-change: transform;
    }
    body.intro-base-away .pcbase {
      transform: translateX(-108vw) rotate(-1.8deg);
      opacity: .15;
      box-shadow: 18px 12px 35px rgba(28, 17, 3, .28);
    }
    body.intro-running .pcbase { pointer-events: none; }

    @media (prefers-reduced-motion: reduce) {
      .pcbase { transition: none; will-change: auto; }
      body.intro-base-away .pcbase { transform: none; opacity: 1; box-shadow: none; }
    }

    .base-svg {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* The wheel: inset from the rectangle so the wedges have room to wrap all
       the way around it (including the split top and bottom). Centred on top. */
    #pcbase .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 60%;
      width: auto;
      aspect-ratio: 1;
      max-width: 60%;
      margin: 0;
      z-index: 2;
      opacity: 1;
      transition: transform 1.3s cubic-bezier(.12, .72, .2, 1.06), opacity .42s ease;
      will-change: transform;
    }
    body.intro-wheel-away #pcbase .stage {
      transform: translate(-50%, -50%) translateY(-115vh) rotate(-540deg);
      opacity: 0;
    }
    .demo-light {
      position: absolute;
      left: 50%; top: 50%;
      width: 17px; height: 17px;
      z-index: 5;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      background: #fff8cf;
      border: 1px solid rgba(91, 61, 9, .8);
      box-shadow: 0 0 7px 3px #fff7bd, 0 0 22px 9px rgba(226, 174, 51, .7);
      transition: left .9s cubic-bezier(.2, .72, .2, 1), top .9s cubic-bezier(.2, .72, .2, 1), opacity .3s ease;
    }
    .demo-light.on { opacity: 1; }
    #pcbase .sector-outer.demo-focus {
      stroke: #fff5b0;
      stroke-width: 5;
      filter: drop-shadow(0 0 5px rgba(213, 155, 25, .95));
    }
    #pcbase .label-outer.demo-focus {
      font-weight: 700;
      filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #f4c95a);
    }
    .base-wedge.demo-result {
      fill: var(--seg-color, var(--paper));
      stroke-width: 4;
      filter: drop-shadow(0 0 7px rgba(207, 147, 14, .9));
    }
    .base-wedge.demo-person {
      stroke: #fff5b0;
      stroke-width: 4;
      filter: drop-shadow(0 0 6px rgba(213, 155, 25, .9));
    }
    @media (prefers-reduced-motion: reduce) {
      #pcbase .stage { transition: none; will-change: auto; }
      body.intro-wheel-away #pcbase .stage { transform: translate(-50%, -50%); opacity: 1; }
    }

    /* One wheel on the base: hide the inner (life-area) ring and the counting
       ring. The centre result is removed too — the result is now read off the
       base, so the middle of the wheel is left clear. */
    #pcbase #innerRing,
    #pcbase #numRing { display: none; }
    #pcbase .hub { display: none; }
    /* The top needle and the inner guide rings belong to the two-wheel view. */
    #pcbase .needle,
    #pcbase .wheel-guide { display: none; }
    /* Radial person labels sit flat (no arc), read centre->edge, stay upright. */
    #pcbase .wheel-person-pc { letter-spacing: 0; }
    /* Principle number on each wheel sector, near the rim. */
    #pcbase .wheel-num-pc {
      font-family: 'Marcellus', serif;
      font-size: 22px;
      font-weight: 700;
      fill: var(--ink);
      pointer-events: none;
      -webkit-user-select: none; user-select: none;
    }
    /* The pointer arrow on principle 1 (the selector). Turns with the wheel. */
    #pcbase .wheel-pointer {
      fill: var(--ink);
      stroke: var(--line);
      stroke-width: 1;
      pointer-events: none;
    }

    /* The wedge shapes and their labels (built in JS). */
    .base-wedge {
      fill: transparent;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linejoin: round;
      transition: fill .22s ease;
    }
    .base-wedge.event,
    .base-wedge.hover,
    .base-wedge:hover { fill: var(--seg-color, var(--paper)); }
    .base-num {
      font-family: 'Marcellus', serif;
      fill: var(--ink);
      dominant-baseline: central;
      -webkit-user-select: none; user-select: none;
    }
    .base-area {
      font-family: 'Marcellus', serif;
      fill: var(--ink);
      dominant-baseline: central;
    }
    .base-person {
      fill: var(--ink);
      font-style: italic;
      dominant-baseline: central;
    }
    /* Labels never eat the wedge's pointer events. */
    .base-area, .base-person, .base-num {
      pointer-events: none;
      -webkit-user-select: none; user-select: none;
    }

    /* The per-sector text block (description, people, body) — the same three
       lines the book's chart shows. Wrapped inside a foreignObject. */
    .bs-box {
      width: 100%; height: 100%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;

    /* The person/bone glyphs are colour emoji — flatten them to black silhouettes. */
    .bs-box .bs-line b { filter: brightness(0); }

    /* Once the wheel has moved, every wedge is a clickable journey-end. */
    #pcbase.engaged .base-wedge { cursor: pointer; }
  }

let lang = 'de';
