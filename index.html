     cache a zero so a bad early read can't stick. */
  if (!(w > 0) && text) {
    const cs = getComputedStyle(measurer);
    if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
    measureCtx.font = `${cs.fontStyle} ${cs.fontWeight} 100px ${cs.fontFamily}`;
    w = measureCtx.measureText(text).width;
    const ls = parseFloat(cs.letterSpacing);          // resolved to px at 100px
    if (ls && isFinite(ls) && text.length > 1) w += ls * (text.length - 1);
  }
  if (w > 0) textWidths.set(key, w);
  return w > 0 ? w : 1;
}

/* Lines are costed by summing their atoms rather than measuring every candidate
   string, which keeps the search to a handful of measurements. `measure` gives
   a string's width at font-size 100 — the SVG labels measure with a hidden text
   node, the hub with a canvas; everything below works off either. */
function spaceWidth100(measure) {
  return measure('n n') - 2 * measure('n');
}

/* ---- Hyphenation ----
   Break between the vowel groups of a word: a lone consonant goes with the
   following syllable (Kommuni-kation), and out of a cluster only the last
   consonant travels (Selbst-verwirk-lichung, Mitar-beiter). That is the German
   rule, and it behaves for English and Cyrillic too. Both halves keep at least
   HYPH_EDGE letters, which is what stops orphans like "…bei-/ter". */
const VOWELS = 'aeiouyäöüàáâãåæèéêëìíîïòóôõøùúûаеёиоуыэюяіїє';
const DIGRAPHS = ['sch', 'ch', 'ph', 'th', 'sh', 'ck'];   // never split these
const HYPH_MIN = 9;      // shorter words are never broken
const HYPH_EDGE = 4;     // letters that must stay on each side
const HYPH_PIECES = 3;   // most pieces one word may become
const HYPH_GAIN = 1.12;  // only hyphenate if it buys this much size

function hyphenPoints(word) {
  const w = word.toLowerCase();
  const isV = c => VOWELS.includes(c);
  const pts = [];
  let i = 0;
  while (i < w.length) {
    if (!isV(w[i])) { i++; continue; }
    let j = i; while (j < w.length && isV(w[j])) j++;      // end of the vowels
    let k = j; while (k < w.length && !isV(w[k])) k++;     // end of the consonants
    if (k < w.length && k > j) {
      /* What travels to the next line: a trailing digraph whole, else the one
         last consonant. Without this, Partner-schaft breaks as Partnersc-haft. */
      const cluster = w.slice(j, k);
      let onset = 1;
      for (const d of DIGRAPHS) if (cluster.endsWith(d)) { onset = d.length; break; }
      const cut = Math.max(j, k - onset);
      if (cut >= HYPH_EDGE && word.length - cut >= HYPH_EDGE) pts.push(cut);
    }
    i = j;
  }
  if (pts.length <= HYPH_PIECES - 1) return pts;
  const keep = [];                          // thin out, keeping them spread
  for (let n = 1; n <= HYPH_PIECES - 1; n++) {
    keep.push(pts[Math.round((pts.length - 1) * n / HYPH_PIECES)]);
  }
  return [...new Set(keep)];
}

/* A label as the smallest pieces a line may end on. `brk` says how the piece
   joins the one before it: a space between words, a hyphen inside one. */
function atomize(name, hyphenate, measure) {
  const atoms = [];
  name.split(/\s+/).filter(Boolean).forEach((word, wi) => {
    const pts = hyphenate && word.length >= HYPH_MIN ? hyphenPoints(word) : [];
    let start = 0;
    const pieces = [];
    for (const p of pts) { pieces.push(word.slice(start, p)); start = p; }
    pieces.push(word.slice(start));
    pieces.forEach((t, pi) => atoms.push({
      t, w: measure(t),
      brk: pi > 0 ? 'hyphen' : (wi > 0 ? 'space' : 'none')
    }));
  });
  return atoms;
}

/* Atoms [from, to) as one line, carrying its own width. A line that stops
   mid-word takes the hyphen — and the hyphen's width. */
function lineOf(atoms, from, to, measure) {
  let text = '', w = 0;
  for (let k = from; k < to; k++) {
    if (k > from && atoms[k].brk === 'space') { text += ' '; w += spaceWidth100(measure); }
    text += atoms[k].t;
    w += atoms[k].w;
  }
  if (to < atoms.length && atoms[to].brk === 'hyphen') {
    text += '-';
    w += measure('-');
  }
  return { text, w };
}

/* Every way of breaking the atoms into `n` contiguous lines. */
function lineSplits(atoms, n, measure) {
  if (n === 1) return [[lineOf(atoms, 0, atoms.length, measure)]];
  const out = [];
  for (let i = 1; i <= atoms.length - n + 1; i++) {
    const head = lineOf(atoms, 0, i, measure);
    for (const rest of lineSplits(atoms.slice(i), n - 1, measure)) out.push([head, ...rest]);
  }
  return out;
}

/* Radius of line `j` in a block of `n` lines centred at `c`. Line 0 is the
   outermost, so the text reads outside-in like the rest of the wheel. */
function lineRadius(c, n, j, size) {
  const lead = LBL_LEAD * size;
  return c + lead * n / 2 - (j + .5) * lead;
}

/* Can this block sit at radius `c` (its centre) at this size? */
function blockFits(lines, size, c, r1, r2) {
  const rIn = r1 + LBL_PAD, rOut = r2 - LBL_PAD, capH = LBL_HALFCAP * size;
  for (let j = 0; j < lines.length; j++) {
    const rj = lineRadius(c, lines.length, j, size);
    if (rj - capH < rIn || rj + capH > rOut) return false;   // through an arc
    if (lines[j].w * size / 100 > rj * WEDGE_RAD * LBL_SIDE) return false;
  }
  return true;
}

/* The block is centred on the ring's mid-radius, full stop — a size only
   counts as fitting if it fits there. Letting it drift outwards would buy a
   larger face (the arc is longer further out) at the cost of labels sitting
   at different depths around the wheel. Horizontal centring is the arc's own:
   every line is anchored at startOffset 50%. */
function placeBlock(lines, size, r1, r2) {
  const mid = (r1 + r2) / 2;
  return blockFits(lines, size, mid, r1, r2) ? mid : null;
}

/* Biggest type that fits, over every line breaking up to LBL_MAXLINES. */
const LBL_MAXLINES = 3;
/* Left alone, "Mutter" would set at 48 and "Selbstverwirklichung" at 12 — each
   sector full, the ring a mess. So the ring's tightest label sets a floor and
   nothing is allowed to exceed it by more than this. */
const LBL_SPREAD = 1.45;

function searchFit(atoms, r1, r2, measure) {
  let best = { size: 0, lines: [lineOf(atoms, 0, atoms.length, measure)], center: (r1 + r2) / 2 };
  for (let n = 1; n <= Math.min(LBL_MAXLINES, atoms.length); n++) {
    for (const lines of lineSplits(atoms, n, measure)) {
      let lo = 5, hi = 48, at = null;
      for (let i = 0; i < 11; i++) {
        const mid = (lo + hi) / 2;
        const c = placeBlock(lines, mid, r1, r2);
        if (c === null) hi = mid; else { lo = mid; at = c; }
      }
      if (at !== null && lo > best.size) best = { size: lo, lines, center: at };
    }
  }
  return best;
}

/* Plain word breaking first. Hyphenation is only worth the ugliness when it
   buys real size, so it has to beat the plain fit by HYPH_GAIN — otherwise
   "Mutter" would happily set itself as "Mut-/ter" to gain a few points. */
function fitLabel(name, r1, r2, cls) {
  const measure = t => textWidth100(t, cls);
  let best = searchFit(atomize(name, false, measure), r1, r2, measure);
  if (name.split(/\s+/).some(w => w.length >= HYPH_MIN)) {
    const hyph = searchFit(atomize(name, true, measure), r1, r2, measure);
    if (hyph.size > best.size * HYPH_GAIN) best = hyph;
  }
  if (!best.size) best.size = 6;   // nothing fit: set it small and let it be
  best.size *= LBL_EASE;
  return best;
}

/* ---- The base (PC only) ------------------------------------------------
   Twelve principle wedges that wrap all the way around the single wheel and
   fill the base rectangle. Each wedge runs from just outside the wheel's rim
   out to the rectangle's edges, so the circle covers their inner ends and each
   wedge shows only in the ring/corner the circle leaves free — the corner
   wedges read large, the ones the circle nearly touches (top and bottom) read
   as thin split slivers, exactly like a wheel laid on a rectangular chart.

   Geometry wedge i spans [i·30°, (i+1)·30°] clockwise from the top, so a
   boundary sits at the top and two principles split it. The principle placed in
   each wedge follows the chart on the reference: principle 1 sits at 9 o'clock
   and the numbers increase counter-clockwise (1,2,3 down the left side, 4 at
   the bottom, 7 at the right, 10 at the top). So wedge i carries principle
   index (20 − i) mod 12 — e.g. wedge 8 (the 9-o'clock wedge) is principle 1,
   and principles 10 and 9 split the top. Each wedge carries the principle
   colour on its border, the inner-wheel life-area text, and a person from the
   outer wheel. Geometry is in the rectangle's own pixels, rebuilt on resize. */
const wedgePrincipleIndex = i => (20 - i) % 12;   // reference (astrological) order
const baseSvg = document.getElementById('baseSvg');
const pcbaseEl = document.getElementById('pcbase');
/* Single typography tuning knob for all desktop base sectors. At the reference
   1920px layout this is the rendered size; responsive scaling below preserves
   the same proportions on narrower or shorter browser viewports. */
const BASE_SECTOR_FONT_SIZE = 18;

function buildRadialBaseSectorsLegacy() {
  if (!baseSvg || !pcbaseEl) return;
  const W = pcbaseEl.clientWidth, H = pcbaseEl.clientHeight;
  const stageEl = document.getElementById('stage');
  if (!matchMedia('(min-width: 900px)').matches || W < 4 || H < 4 || !stageEl) {
    baseSvg.innerHTML = '';                       // mobile / no rectangle: nothing to draw
    return;
  }
  const ns = 'http://www.w3.org/2000/svg';
  const cx = W / 2, cy = H / 2;
  const stageH = stageEl.getBoundingClientRect().height;
  const wheelRimRadius = (stageH / 2) * (344 / 350);
  const Rin = wheelRimRadius + 2;                  // wedges begin just past the rim

  const rad = d => d * Math.PI / 180;
  const pol = (r, d) => [cx + r * Math.sin(rad(d)), cy - r * Math.cos(rad(d))];
  const rectHit = d => {                          // ray from centre to the rectangle edge
    const dx = Math.sin(rad(d)), dy = -Math.cos(rad(d));
    let t = Infinity;
    if (dx >  1e-9) t = Math.min(t, (W - cx) / dx);
    if (dx < -1e-9) t = Math.min(t, (0 - cx) / dx);
    if (dy >  1e-9) t = Math.min(t, (H - cy) / dy);
    if (dy < -1e-9) t = Math.min(t, (0 - cy) / dy);
    return [cx + dx * t, cy + dy * t];
  };
  const corners = [[0, 0], [W, 0], [W, H], [0, H]];
  const angOf = (px, py) => {
    const a = Math.atan2(px - cx, -(py - cy)) * 180 / Math.PI;
    return (a % 360 + 360) % 360;
  };
  const rDist = d => {                            // centre-to-edge distance at angle d
    const [x, y] = rectHit(d);
    return Math.hypot(x - cx, y - cy);
  };

  /* Twelve equal-area outer slices of the rectangle. Every wedge keeps a
     uniform inner edge (30° at the wheel rim, so the spokes still meet the
     wheel and the pointer/projection stay aligned), but its outer edge fans out
     to these angles, so each wedge holds an equal 1/12 of the rectangle: the
     thin top and bottom wedges widen outward and the big side wedges give up
     the room. The pattern is found by walking the perimeter and cutting each
     time the swept area passes another twelfth. */
  const bounds = (() => {
    const N = 2160, dphi = 360 / N, step = (W * H) / 12;
    const b = [0]; let acc = 0, k = 1;
    for (let s = 0; s < N && k < 12; s++) {
      const dA = 0.5 * rDist(s * dphi + dphi / 2) ** 2 * (dphi * Math.PI / 180);
      while (k < 12 && acc + dA >= step * k) {
        b.push((s + (step * k - acc) / dA) * dphi);
        k++;
      }
      acc += dA;
    }
    b.push(360);
    return b;
  })();

  const fNum = Math.max(19, Math.min(36, H * 0.042));
  /* Keep the entire glyph outside the wheel layer, not merely its centre. The
     font-aware clearance prevents tall digits from being partially occluded. */
  const baseNumberRadius = wheelRimRadius + fNum * 0.7 + 10;
  const capFont = fNum * 1.7;                       // ceiling for body text, relative to the number

  /* Sample a wedge's outline (inner arc + outer edge) as a polygon, and find
     the polygon's interval at a given x or y — used to size each label box so
     it fits inside its own wedge. */
  const wedgePoly = (ia1, ia2, oa1, oa2) => {
    const p = [], seg = 6;
    for (let s = 0; s <= seg; s++) p.push(pol(Rin, ia1 + (ia2 - ia1) * s / seg));
    p.push(rectHit(oa2));
    corners.map(([px, py]) => [px, py, angOf(px, py)])
      .filter(c => c[2] > oa1 + 0.01 && c[2] < oa2 - 0.01)
      .sort((a, b) => b[2] - a[2])
      .forEach(c => p.push([c[0], c[1]]));
    p.push(rectHit(oa1));
    return p;
  };
  baseSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  baseSvg.innerHTML = '';

  for (let i = 0; i < 12; i++) {
    const pIdx = wedgePrincipleIndex(i);           // which principle sits in this wedge
    const item = LP()[pIdx];
    const color = LP_COLORS[pIdx % 4];
    /* The eight wedges down the two sides (principles 11,12,1,2 and 8,7,6,5).
       They share a shape and a job: their text flares straight out of the wheel
       along its radius, all at one common size. The four top/bottom wedges
       (9,10,3,4) keep their own fitting. */
    const isSide = [1, 2, 3, 4, 7, 8, 9, 10].includes(i);
    const ia1 = i * 30, ia2 = ia1 + 30;            // uniform inner arc (aligned to the wheel)
    const oa1 = bounds[i], oa2 = bounds[i + 1];    // equal-area outer span
    const [i1x, i1y] = pol(Rin, ia1);
    const [i2x, i2y] = pol(Rin, ia2);
    const [o2x, o2y] = rectHit(oa2);
    const [o1x, o1y] = rectHit(oa1);
    const cs = corners
      .map(([px, py]) => [px, py, angOf(px, py)])
      .filter(c => c[2] > oa1 + 0.01 && c[2] < oa2 - 0.01)
      .sort((p, q) => q[2] - p[2]);               // walk oa2 -> oa1, so descending

    let d = `M ${i1x} ${i1y} A ${Rin} ${Rin} 0 0 1 ${i2x} ${i2y} L ${o2x} ${o2y} `;
    cs.forEach(c => { d += `L ${c[0]} ${c[1]} `; });
    d += `L ${o1x} ${o1y} Z`;

    const wedge = document.createElementNS(ns, 'path');
    wedge.setAttribute('class', 'base-wedge');
    wedge.setAttribute('d', d);
    wedge.dataset.index = pIdx;
    wedge.style.setProperty('--seg-color', color);
    /* Principle order, not drawing order: 1→12 completes in under a second. */
    wedge.style.setProperty('--intro-delay', `${pIdx * 55}ms`);
    baseSvg.appendChild(wedge);

    /* Label block, mirroring the book's chart: the principle's keywords, the
       people it stands for, and the biological (body) correspondence. Each
       wedge has a different size and shape, so try several placements along it
       and keep the one that lets the text grow largest (wider bands wrap less
       and read bigger); clip to the wedge as a backstop. */
    const poly = wedgePoly(ia1, ia2, oa1, oa2);
    let A = 0, cX = 0, cY = 0;
    for (let j = 0; j < poly.length; j++) {
      const a = poly[j], b = poly[(j + 1) % poly.length];
      const cr = a[0] * b[1] - b[0] * a[1];
      A += cr; cX += (a[0] + b[0]) * cr; cY += (a[1] + b[1]) * cr;
    }
    A *= 0.5;
    if (Math.abs(A) > 1) { cX /= 6 * A; cY /= 6 * A; }
    else { cX = poly.reduce((s, p) => s + p[0], 0) / poly.length; cY = poly.reduce((s, p) => s + p[1], 0) / poly.length; }

    /* Mirror the wheel's principle number across the rim. Keeping the base
       number near the wheel frees the sector's wider outer area for its copy. */
    const [numX, numY] = pol(baseNumberRadius, (ia1 + ia2) / 2);
    const numR = fNum * 0.95;

    /* Rotate a point around the sector centroid. The text box is built in this
       rotated frame (so it can lean along the wedge yet stay axis-aligned for
       fitting); the centroid is the fixed point, so it maps to itself. */
    const rotP = (x, y, deg) => {
      if (!deg) return [x, y];
      const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
      const dx = x - cX, dy = y - cY;
      return [cX + dx * c - dy * s, cY + dx * s + dy * c];
    };
    const inP = (pl, x, y) => {
      let c = false;
      for (let a = 0, bI = pl.length - 1; a < pl.length; bI = a++) {
        const [xi, yi] = pl[a], [xj, yj] = pl[bI];
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
      }
      return c;
    };
    /* Does the principle number's keep-out circle overlap a rectangle? */
    const circleRectHit = (nx, ny, r, bx, by, hW, hH) => {
      const dx = Math.max(Math.abs(nx - bx) - hW, 0), dy = Math.max(Math.abs(ny - by) - hH, 0);
      return dx * dx + dy * dy < r * r;
    };
    /* The largest axis-aligned rectangles that fit inside polygon `pl` while
       staying centred on (bx,by) and clear of the number at (nx,ny). One per
       aspect ratio, each grown out to the polygon edge by binary search — so the
       block is centred on the sector's geometric centre and spans its full
       depth, using the outer portion rather than hugging the wheel. */
    const maxRectAt = (pl, bx, by, nx, ny, keepR = numR) => {
      const fits = (hW, hH) => {
        if (circleRectHit(nx, ny, keepR, bx, by, hW, hH)) return false;
        const pts = [[bx - hW, by - hH], [bx + hW, by - hH], [bx + hW, by + hH], [bx - hW, by + hH],
                     [bx, by - hH], [bx, by + hH], [bx - hW, by], [bx + hW, by]];
        for (const [x, y] of pts) if (!inP(pl, x, y)) return false;
        return true;
      };
      const rects = [];
      for (const asp of [0.55, 0.85, 1.2, 1.7, 2.4, 3.3, 4.5, 6, 8]) {   // hW/hH, wide → tall
        let lo = 0, hi = Math.max(W, H);
        for (let it = 0; it < 20; it++) { const s = (lo + hi) / 2; if (fits(asp * s, s)) lo = s; else hi = s; }
        if (lo > 4) rects.push({ cx: bx, cy: by, hW: asp * lo, hH: lo });
      }
      return rects;
    };

    /* An unrotated clip group holds the text; the foreignObject inside may be
       rotated so the text follows the wedge's slope. */
    const clip = document.createElementNS(ns, 'clipPath');
    clip.setAttribute('id', 'bsclip-' + i);
    const clipP = document.createElementNS(ns, 'path');
    clipP.setAttribute('d', d);
    clip.appendChild(clipP);
    baseSvg.appendChild(clip);
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'base-copy');
    g.setAttribute('clip-path', 'url(#bsclip-' + i + ')');
    g.setAttribute('pointer-events', 'none');
    g.style.setProperty('--copy-delay', `${880 + pIdx * 12}ms`);
    const fo = document.createElementNS(ns, 'foreignObject');
    fo.setAttribute('pointer-events', 'none');
    fo.dataset.index = pIdx;
    const box = document.createElement('div');
    box.className = 'bs-box';
    box.style.setProperty('--seg-color', color);
    const content = document.createElement('div');
    content.className = 'bs-content';
    const kEl = document.createElement('div'); kEl.className = 'bs-keys';
    const kIco = document.createElement('b'); kIco.className = 'bs-icon'; kIco.textContent = '✧';
    kEl.append(kIco, document.createTextNode(' ' + item.keys));
    const pEl = document.createElement('div'); pEl.className = 'bs-line';
    const pIco = document.createElement('b'); pIco.className = 'bs-icon bs-person-icon';
    pEl.append(pIco, document.createTextNode(' ' + item.people));
    const bEl = document.createElement('div'); bEl.className = 'bs-line';
    const bIco = document.createElement('b'); bIco.className = 'bs-icon'; bIco.textContent = '⚕';
    bEl.append(bIco, document.createTextNode(' ' + item.body));
    content.append(kEl, pEl, bEl);
    box.appendChild(content);
    fo.appendChild(box);
    g.appendChild(fo);
    baseSvg.appendChild(g);

    /* The fitter: binary-search the largest font whose block fits a given box,
       using the live element's own rendered metrics. Tries single-line and
       wrapped; `nowrapOnly` keeps every subtext on one line (used for the thin
       top/bottom wedges, whose wide outer part suits single lines). */
    const measureFit = (hW, hH, nowrapOnly) => {
      fo.setAttribute('width', (hW * 2).toFixed(1)); fo.setAttribute('height', (hH * 2).toFixed(1));
      let bf = null;
      for (const nowrap of (nowrapOnly ? [true] : [true, false])) {
        content.style.whiteSpace = nowrap ? 'nowrap' : 'normal';
        /* Binary-search the largest font whose rendered block fits the box in
           both axes. The ceiling is derived from the box, not hardcoded, so a
           roomy sector can grow as large as it needs. */
        let lo = 6, hi = Math.max(12, Math.min(hH * 2, hW, capFont));
        for (let it = 0; it < 9; it++) {
          const mid = (lo + hi) / 2;
          box.style.fontSize = mid.toFixed(2) + 'px';
          if (content.offsetHeight <= hH * 2 && content.scrollWidth <= hW * 2) lo = mid; else hi = mid;
        }
        const sc = lo * (nowrap ? 1.05 : 1);
        if (!bf || sc > bf.sc) bf = { sc, fs: lo, nowrap };
      }
      return bf;
    };

    /* Tilt. Every side wedge leans along its own radius — the line from the
       wheel out through the wedge — so the text flares out of the wheel like
       sunrays (radialTextRot keeps it upright). This is applied to all eight,
       including the near-horizontal ones (12,1,6,7) that used to sit flat. The
       top/bottom wedges keep the old "flat, or the spine if it grows the text"
       search. */
    /* Every sector leans gently along its own radius — a light flare out of the
       wheel, capped small so the text reads without a head-tilt. The top/bottom
       wedges get the same slight lean (they used to sit flat). */
    const MAX_TILT = 11;
    const tilts = [Math.max(-MAX_TILT, Math.min(MAX_TILT, radialTextRot((ia1 + ia2) / 2)))];
    const spineInner = pol(Rin, (ia1 + ia2) / 2);
    const spineOuter = rectHit((oa1 + oa2) / 2);

    let gBest = null;
    for (const tilt of tilts) {
      const plR = tilt ? poly.map(p => rotP(p[0], p[1], -tilt)) : poly;
      const [nRx, nRy] = rotP(numX, numY, -tilt);
      /* Side wedges are roomy and symmetric — centre the block on the geometric
         centroid (rotP's fixed point). The thin top/bottom wedges also try a few
         centres out along the radius, so they can claim their wide outer part and
         grow the text larger instead of being pinned to the narrow centre. */
      const centres = [[cX, cY]];
      if (!isSide) for (const u of [0.5, 0.62, 0.72, 0.82, 0.9]) {
        const px = spineInner[0] + (spineOuter[0] - spineInner[0]) * u;
        const py = spineInner[1] + (spineOuter[1] - spineInner[1]) * u;
        centres.push(rotP(px, py, -tilt));
      }
      /* A slightly smaller keep-out on thin top/bottom wedges leaves enough
         room beside the number at their narrow inner edge. */
      const keepR = isSide ? numR : numR * 0.55;
      for (const [bx, by] of centres)
        for (const r0 of maxRectAt(plR, bx, by, nRx, nRy, keepR)) {
          const r = { cx: r0.cx, cy: r0.cy, hW: r0.hW * 0.97, hH: r0.hH * 0.97 };
          if (r.hW < 12 || r.hH < 9) continue;
          /* Try single-line and wrapped, keeping whichever reads larger — for
             the top/bottom wedges this lets the long first/second subtexts break
             to two lines when that grows the text. */
          const f = measureFit(r.hW, r.hH);
          if (!gBest || f.sc > gBest.sc) gBest = { sc: f.sc, fs: f.fs, nowrap: f.nowrap, r, tilt };
        }
    }
    if (!gBest) gBest = { fs: 9, nowrap: false, r: { cx: cX, cy: cY, hW: Math.min(W, H) * 0.09, hH: Math.min(W, H) * 0.09 }, tilt: 0 };

    /* Map the chosen box back to page coordinates and rotate the text. */
    const [acx, acy] = rotP(gBest.r.cx, gBest.r.cy, gBest.tilt);
    content.style.whiteSpace = gBest.nowrap ? 'nowrap' : 'normal';
    box.style.fontSize = gBest.fs.toFixed(2) + 'px';
    fo.setAttribute('x', (acx - gBest.r.hW).toFixed(1));
    fo.setAttribute('y', (acy - gBest.r.hH).toFixed(1));
    fo.setAttribute('width', (gBest.r.hW * 2).toFixed(1));
    fo.setAttribute('height', (gBest.r.hH * 2).toFixed(1));
    if (gBest.tilt) fo.setAttribute('transform', `rotate(${gBest.tilt.toFixed(2)}, ${acx.toFixed(1)}, ${acy.toFixed(1)})`);

    /* The principle number, immediately outside the wheel on the mid-angle. */
    const num = document.createElementNS(ns, 'text');
    num.setAttribute('class', 'base-num base-copy');
    num.style.setProperty('--copy-delay', `${880 + pIdx * 12}ms`);
    num.setAttribute('text-anchor', 'middle');
    num.setAttribute('x', numX);
    num.setAttribute('y', numY);
    num.style.fontSize = fNum.toFixed(1) + 'px';
    num.style.setProperty('--seg-color', color);
    num.textContent = pIdx + 1;
    baseSvg.appendChild(num);
  }
}

/* Desktop's simplified base: six horizontal rows on either side of the
   wheel. The wheel is layered above the rows, so its rim becomes their visible
   curved inner edge while the other three exposed edges remain straight. This
   keeps all three text groups horizontal; row boundaries are adjusted below
   so each one meets the corresponding 30° wheel spoke exactly. */
function buildBaseSectors() {
  if (!baseSvg || !pcbaseEl) return;
  const W = pcbaseEl.clientWidth, H = pcbaseEl.clientHeight;
  const stageEl = document.getElementById('stage');
  if (!matchMedia('(min-width: 900px)').matches || W < 4 || H < 4 || !stageEl) {
    baseSvg.innerHTML = '';
    return;
  }

  const ns = 'http://www.w3.org/2000/svg';
  const cx = W / 2, cy = H / 2, nominalRowH = H / 6;
  const stageH = stageEl.getBoundingClientRect().height;
  const rim = (stageH / 2) * (344 / 350);
  /* Each internal horizontal divider lands on the outer endpoint of a 30°
     wheel spoke. The top and bottom rows therefore grow slightly while the
     intervening rows absorb the difference, eliminating visible near-misses. */
  const rowBounds = [
    0,
    cy - rim * Math.cos(Math.PI / 6),
    cy - rim * Math.cos(Math.PI / 3),
    cy,
    cy + rim * Math.cos(Math.PI / 3),
    cy + rim * Math.cos(Math.PI / 6),
    H
  ];
  const fNum = Math.max(18, Math.min(31, nominalRowH * .27));
  const outerPad = Math.max(12, W * .009);
  const numberGap = fNum * 1.75;
  const columns = [
    { side: 'left', principles: [9, 10, 11, 0, 1, 2] },
    { side: 'right', principles: [8, 7, 6, 5, 4, 3] }
  ];
  const copyBoxes = [];

  const circleHalfWidth = y => {
    const dy = Math.max(-rim, Math.min(rim, y - cy));
    return Math.sqrt(Math.max(0, rim * rim - dy * dy));
  };
  const makeCopy = (item, color, pIdx, side, x, y, width, height) => {
    const fo = document.createElementNS(ns, 'foreignObject');
    fo.dataset.index = pIdx;
    fo.setAttribute('class', 'base-copy');
    fo.setAttribute('pointer-events', 'none');
    fo.setAttribute('x', x.toFixed(1));
    fo.setAttribute('y', y.toFixed(1));
    fo.setAttribute('width', Math.max(1, width).toFixed(1));
    fo.setAttribute('height', Math.max(1, height).toFixed(1));
    fo.style.setProperty('--copy-delay', `${880 + pIdx * 12}ms`);

    const box = document.createElement('div');
    box.className = 'bs-box';
    box.style.setProperty('--seg-color', color);
    box.style.textAlign = side === 'left' ? 'left' : 'right';
    const content = document.createElement('div');
    content.className = 'bs-content';
    content.style.whiteSpace = 'normal';
    content.style.overflowWrap = 'anywhere';
    const keys = document.createElement('div');
    keys.className = 'bs-keys';
    const keysIcon = document.createElement('b');
    keysIcon.className = 'bs-icon';
    keysIcon.textContent = '✧';
    keys.append(keysIcon, document.createTextNode(' ' + item.keys));
    const people = document.createElement('div');
    people.className = 'bs-line';
    const peopleIcon = document.createElement('b');
    peopleIcon.className = 'bs-icon bs-person-icon';
    people.append(peopleIcon, document.createTextNode(' ' + item.people));
    const body = document.createElement('div');
    body.className = 'bs-line';
    const bodyIcon = document.createElement('b');
    bodyIcon.className = 'bs-icon';
    bodyIcon.textContent = '⚕';
    body.append(bodyIcon, document.createTextNode(' ' + item.body));
    content.append(keys, people, body);
    box.appendChild(content);
    fo.appendChild(box);
    baseSvg.appendChild(fo);

    copyBoxes.push({ pIdx, box });
  };

  baseSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  baseSvg.innerHTML = '';

  columns.forEach(({ side, principles }) => principles.forEach((pIdx, row) => {
    const y0 = rowBounds[row], y1 = rowBounds[row + 1];
    const sectorH = y1 - y0, rowPad = Math.max(4, sectorH * .06);
    const item = LP()[pIdx], color = LP_COLORS[pIdx % 4];
    const wedge = document.createElementNS(ns, 'rect');
    wedge.setAttribute('class', `base-wedge base-wedge-${side}`);
    wedge.setAttribute('x', side === 'left' ? 0 : cx);
    wedge.setAttribute('y', y0.toFixed(1));
    wedge.setAttribute('width', (W / 2).toFixed(1));
    wedge.setAttribute('height', sectorH.toFixed(1));
    wedge.dataset.index = pIdx;
    wedge.style.setProperty('--seg-color', color);
    wedge.style.setProperty('--intro-delay', `${pIdx * 55}ms`);
    baseSvg.appendChild(wedge);

    /* Reserve a clear strip beside the rim for the principle number. The text
       box ends at the wheel's widest intrusion into this row, so none of its
       three independently wrapping entries can disappear under the wheel. */
    const closestY = Math.max(y0 + rowPad, Math.min(cy, y1 - rowPad));
    const widest = circleHalfWidth(closestY);
    let textX, textRight, numX;
    if (side === 'left') {
      textX = outerPad;
      textRight = cx - widest - numberGap;
    } else {
      textX = cx + widest + numberGap;
      textRight = W - outerPad;
    }
    makeCopy(item, color, pIdx, side, textX, y0 + rowPad,
             Math.max(40, textRight - textX), sectorH - rowPad * 2);

    /* Mirror the wheel number across the rim on the same radial centreline. */
    const angle = (((20 - pIdx) % 12) * 30 + 15) * Math.PI / 180;
    const numRadius = rim + fNum * 1.05;
    numX = cx + numRadius * Math.sin(angle);
    const numY = cy - numRadius * Math.cos(angle);

    const num = document.createElementNS(ns, 'text');
    num.setAttribute('class', 'base-num base-copy');
    num.style.setProperty('--copy-delay', `${880 + pIdx * 12}ms`);
    num.setAttribute('text-anchor', 'middle');
    num.setAttribute('x', numX.toFixed(1));
    num.setAttribute('y', numY.toFixed(1));
    num.style.fontSize = `${fNum.toFixed(1)}px`;
    num.style.setProperty('--seg-color', color);
    num.textContent = pIdx + 1;
    baseSvg.appendChild(num);
  }));

  /* One responsive size for the entire chart—never a per-sector fallback.
     Change BASE_SECTOR_FONT_SIZE above to tune all twelve sectors together. */
  const viewportScale = Math.max(.68, Math.min(1.15,
    W / 1920, nominalRowH / 133));
  const commonFont = BASE_SECTOR_FONT_SIZE * viewportScale;
  copyBoxes.forEach(entry => {
    entry.box.style.fontSize = `${commonFont.toFixed(2)}px`;
  });
}

/* Rotation (screen degrees) that lays text along the radius at angle A (from
   the top, clockwise) and keeps it upright — used for the PC wheel's radial
   person labels. */
function radialTextRot(A) {
  const a = A * Math.PI / 180;
  let deg = Math.atan2(-Math.cos(a), Math.sin(a)) * 180 / Math.PI;   // outward vs +x
  if (deg >  90) deg -= 180;
  if (deg < -90) deg += 180;
  return deg;
}

/* The PC wheel: one ring of person sectors, drawn as full wedges from the
   centre out to the rim, with the person text set radially (centre -> edge) rather
   than along an arc. Each sector is placed at the same angle as the base wedge
   for its principle, so principle p on the wheel sits over principle p on the
   base at the home position — principle 1 at 9 o'clock, reading horizontally.
   Rotating the wheel then slides the sectors across the base underneath. */
const WHEEL_ANGLE = p => ((20 - p) % 12) * 30 + STEP / 2;   // home centre for principle p
let pcWheelLabels = [];        // {el, A, tx, ty} — kept so labels stay upright as the wheel turns
function buildWheelPc(group) {
  group.innerHTML = '';
  raised.outer = -1;
  pcWheelLabels = [];
  const R_OUT = OUTER_R2, R_IN = 0;
  const rNum = R_OUT - 15;                    // principle number, near the rim
  const labelInner = 48;                      // keep labels clear of the wheel centre
  const labelOuter = R_OUT - 34;              // leave the rim clear for the number
  const rMid = (labelInner + labelOuter) / 2;
  const avail = (labelOuter - labelInner) * 0.86;
  LP().forEach((item, p) => {
    const A = WHEEL_ANGLE(p);
    const sec = document.createElementNS(NS, 'path');
    sec.setAttribute('d', sectorPath(R_IN, R_OUT, A - STEP / 2, A + STEP / 2));
    sec.setAttribute('class', p === 0 ? 'sector-outer pointer-sector' : 'sector-outer');
    sec.dataset.index = p;
    sec.style.setProperty('--seg-color', LP_COLORS[p % 4]);
    group.appendChild(sec);

    const [tx, ty] = polar(rMid, A);
    const w100 = textWidth100(item.label, 'label-outer');
    const fs = Math.max(9, Math.min(22, avail / (w100 / 100)));
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('class', 'label-outer wheel-person-pc');
    text.dataset.index = p;
    text.style.setProperty('--seg-color', LP_COLORS[p % 4]);
    text.setAttribute('x', tx.toFixed(2));
    text.setAttribute('y', ty.toFixed(2));
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.style.fontSize = fs.toFixed(1) + 'px';
    text.style.strokeWidth = Math.max(2, fs * 0.2).toFixed(1) + 'px';
    text.textContent = item.label;
    group.appendChild(text);
    pcWheelLabels.push({ el: text, A, tx, ty });

    /* Principle number near the rim, kept upright with the labels. */
    const [nx, ny] = polar(rNum, A);
    const num = document.createElementNS(NS, 'text');
    num.setAttribute('class', 'wheel-num-pc');
    num.dataset.index = p;
    num.style.setProperty('--seg-color', LP_COLORS[p % 4]);
    num.setAttribute('x', nx.toFixed(2));
    num.setAttribute('y', ny.toFixed(2));
    num.setAttribute('text-anchor', 'middle');
    num.setAttribute('dominant-baseline', 'central');
    num.textContent = p + 1;
    group.appendChild(num);
    pcWheelLabels.push({ el: num, A, tx: nx, ty: ny });
  });

  /* Gold principle-1 arrow: its shaft spans the sector's full radius and its
     head projects beyond the rim toward the selected base sector. */
  const A0 = WHEEL_ANGLE(0);
  const [shaftStartX, shaftStartY] = polar(4, A0);
  const [shaftEndX, shaftEndY] = polar(R_OUT + 3, A0);
  const shaft = document.createElementNS(NS, 'line');
  shaft.setAttribute('class', 'wheel-pointer-base');
  shaft.setAttribute('x1', shaftStartX.toFixed(2));
  shaft.setAttribute('y1', shaftStartY.toFixed(2));
  shaft.setAttribute('x2', shaftEndX.toFixed(2));
  shaft.setAttribute('y2', shaftEndY.toFixed(2));
  group.insertBefore(shaft, group.firstChild);

  /* Keep the head broad but shallow so it points at, rather than covers, the
     base principle number outside the rim. */
  const [tipx, tipy] = polar(R_OUT + 18, A0);
  /* The curved base spans the complete 30° outer edge of principle 1. */
  const headRadius = R_OUT - 3;
  const b1 = polar(headRadius, A0 - STEP / 2), b2 = polar(headRadius, A0 + STEP / 2);
  const arrow = document.createElementNS(NS, 'path');
  arrow.setAttribute('class', 'wheel-pointer');
  arrow.setAttribute('d', `M ${tipx.toFixed(2)} ${tipy.toFixed(2)} L ${b1[0].toFixed(2)} ${b1[1].toFixed(2)} A ${headRadius} ${headRadius} 0 0 1 ${b2[0].toFixed(2)} ${b2[1].toFixed(2)} Z`);
  group.appendChild(arrow);

  orientPcWheel(state.outer.angle);           // set upright immediately
}

/* Keep the radial labels upright as the wheel turns: the group is rotated by
   theta, so each label is counter-rotated to land at the upright radial angle
   for its current position. */
function orientPcWheel(theta) {
  pcWheelLabels.forEach(({ el, A, tx, ty }) => {
    const rot = radialTextRot(A + theta) - theta;
    el.setAttribute('transform', `rotate(${rot.toFixed(2)}, ${tx.toFixed(2)}, ${ty.toFixed(2)})`);
  });
}

const isPcBase = () => matchMedia('(min-width: 900px)').matches;

/* The base principle the pointer (the wheel's principle-1 sector) sits on = the
   PERSON (to whom, chosen from the outer world). */
function pcPersonIndex() {
  const k = (((Math.round(state.outer.angle / STEP)) % 12) + 12) % 12;   // notches turned
  return ((12 - k) % 12 + 12) % 12;
}
/* Light the base wedge the pointer sits on (the chosen person), and mark the
   base "engaged" (read-more offered on every wedge) once the wheel has moved. */
function updatePcBase() {
  if (!baseSvg) return;
  const p = pcPersonIndex();
  const moved = ((Math.round(state.outer.angle / STEP)) % 12 + 12) % 12 !== 0;
  baseSvg.querySelectorAll('.base-wedge').forEach(el =>
    el.classList.toggle('event', +el.dataset.index === p));
  pcbaseEl?.classList.toggle('engaged', moved);
}

/* The mechanic: the pointer selects the PERSON (base principle under it). A
   clicked base wedge is the RESULT principle; the EVENT (what happened) that
   leads there is result − person + 1. So the reading is: the [event's life-area]
   of your [person] reflects your [result] life principle. Hovering a wedge lights
   the event's sector on the wheel — the sector that points at that result. */
const eventForResult = r => ((r - pcPersonIndex()) % 12 + 12) % 12;   // event = result − person
if (baseSvg) {
  baseSvg.addEventListener('mouseover', ev => {
    const w = ev.target.closest && ev.target.closest('.base-wedge');
    if (!w || !isPcBase()) return;
    const e = eventForResult(+w.dataset.index);
    w.classList.add('hover');
    outerG.querySelectorAll('.sector-outer, .label-outer').forEach(el =>
      el.classList.toggle('projected', +el.dataset.index === e));
  });
  baseSvg.addEventListener('mouseout', ev => {
    const w = ev.target.closest && ev.target.closest('.base-wedge');
    if (!w) return;
    w.classList.remove('hover');
    outerG.querySelectorAll('.projected').forEach(el => el.classList.remove('projected'));
  });
  baseSvg.addEventListener('click', ev => {
    const w = ev.target.closest && ev.target.closest('.base-wedge');
    if (!w || !isPcBase()) return;
    openResultModalFor(pcPersonIndex(), eventForResult(+w.dataset.index));
  });
}

function buildRing(group, ring) {
  const ns = 'http://www.w3.org/2000/svg';
  const isOuter = ring === 'outer';
  /* On PC the outer ring becomes the single radial person wheel. */
  if (isOuter && matchMedia('(min-width: 900px)').matches) { buildWheelPc(group); return; }
  const [r1, r2] = isOuter ? [OUTER_R1, OUTER_R2] : [INNER_R1, INNER_R2];

  /* Fit every label first: the tightest one in the ring caps the rest. */
  const cls = isOuter ? 'label-outer' : 'label-inner';
  const fits = LP().map(item => fitLabel(isOuter ? item.label : item.area, r1, r2, cls));
  /* The floor comes from the second-tightest label, not the tightest: one
     unbreakable word (Selbstverwirklichung) would otherwise drag the whole
     ring down to its size. That one label stays smaller than the rest. */
  const sorted = fits.map(f => f.size).sort((a, b) => a - b);
  const cap = (sorted[1] ?? sorted[0]) * LBL_SPREAD;
  fits.forEach(f => {
    if (f.size <= cap) return;
    f.size = cap;
    f.center = placeBlock(f.lines, cap, r1, r2) ?? f.center;
  });

  group.innerHTML = '';
  raised[ring] = -1;            // DOM order is rebuilt, so drop the cached lift
  const defs = document.createElementNS(NS, 'defs');   // holds the label arcs
  group.appendChild(defs);
  LP().forEach((item, i) => {
    const start = i * STEP - STEP / 2, end = i * STEP + STEP / 2;
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', sectorPath(r1, r2, start, end));
    path.setAttribute('class', isOuter ? 'sector-outer' : 'sector-inner');
    path.dataset.index = i;
    path.style.setProperty('--seg-color', LP_COLORS[i % 4]);
    group.appendChild(path);

    /* Label: one arc per line, each concentric with the ring, so the words
       curve with the wheel instead of sitting flat across it. */
    const fit = fits[i];
    fit.lines.forEach((line, li) => {
      const rj = lineRadius(fit.center, fit.lines.length, li, fit.size);
      const id = `lblarc-${ring}-${i}-${li}`;
      const [ax, ay] = polar(rj, -STEP / 2), [bx, by] = polar(rj, STEP / 2);
      const arc = document.createElementNS(ns, 'path');
      arc.setAttribute('id', id);
      arc.setAttribute('d', `M ${ax} ${ay} A ${rj} ${rj} 0 0 1 ${bx} ${by}`);
      defs.appendChild(arc);

      const text = document.createElementNS(ns, 'text');
      text.setAttribute('class', cls);
      text.dataset.index = i;
      text.style.setProperty('--seg-color', LP_COLORS[i % 4]);
      text.setAttribute('transform', `rotate(${i * STEP}, ${CX}, ${CY})`);
      text.setAttribute('dominant-baseline', 'central');
      text.style.fontSize = fit.size.toFixed(2) + 'px';
      text.style.strokeWidth = Math.max(2, fit.size * .2).toFixed(2) + 'px';

      const tp = document.createElementNS(ns, 'textPath');
      tp.setAttribute('href', '#' + id);
      tp.setAttributeNS(XLINK, 'xlink:href', '#' + id);   // older WebKit
      tp.setAttribute('startOffset', '50%');
      tp.textContent = line.text;
      text.appendChild(tp);
      group.appendChild(text);
    });
  });
}

/* ================= STATE & FORMULA ================= */

const state = {
  outer: { angle: 0, group: outerG },
  inner: { angle: 0, group: innerG }
};
let mobileCorrState = { ring: null, index: -1, lang: null };

function updateMobileCorrespondences(ring = 'outer', force = false) {
  if (isPcBase()) return;
  const index = selectedIndex(ring);
  if (!force && mobileCorrState.ring === ring && mobileCorrState.index === index && mobileCorrState.lang === lang) return;
  mobileCorrState = { ring, index, lang };

  const item = LP()[index];
  const panel = document.getElementById('correspondencePanel');
  if (!panel || !item) return;
  panel.style.setProperty('--principle-color', LP_COLORS[index % 4]);
  document.getElementById('corrSource').textContent = ring === 'outer' ? T().outer : T().inner;
  document.getElementById('corrTitle').textContent = `${index + 1}. ${item.title}`;
  document.getElementById('corrKeysLabel').textContent = T().catKeys;
  document.getElementById('corrPeopleLabel').textContent = T().catPeople;
  document.getElementById('corrBodyLabel').textContent = T().catBody;
  document.getElementById('corrKeys').textContent = item.keys;
  document.getElementById('corrPeople').textContent = item.people;
  document.getElementById('corrBody').textContent = item.body;
  panel.classList.add('updating');
  requestAnimationFrame(() => panel.classList.remove('updating'));
}

function showMobileCorrespondences(ring = 'outer', duringDemo = false) {
  if (isPcBase() || (demoActive && !duringDemo)) return;
  hideWheelGestureHint();
  updateMobileCorrespondences(ring);
  document.getElementById('correspondencePanel')?.classList.add('open');
}

function hideMobileCorrespondences() {
  document.getElementById('correspondencePanel')?.classList.remove('open', 'updating');
}

function showWheelGestureHint() {
  if (isPcBase()) return;
  hideMobileCorrespondences();
  document.getElementById('wheelGestureHint')?.classList.add('show');
}

function hideWheelGestureHint() {
  document.getElementById('wheelGestureHint')?.classList.remove('show');
}

function applyRotation(ring) {
  const s = state[ring];
  s.group.setAttribute('transform', `rotate(${s.angle}, ${CX}, ${CY})`);
  if (ring === 'outer' && isPcBase()) {
    orientPcWheel(s.angle);   // keep labels upright
    updatePcBase();           // tint the base sector currently under the arrow
  }
  if (!isPcBase()) updateMobileCorrespondences(ring);
  if (ring === numTrack) turnNumRing();
}
function selectedIndex(ring) {
  return ((Math.round(-state[ring].angle / STEP) % 12) + 12) % 12;
}
/* ---- The counting ring -------------------------------------------------
   Twelve numerals on their own circle outside the wheel, past the rim and
   past the tip of the needle. They are not a third wheel and they never turn
   by themselves: they are whichever wheel is being handled, counted off, so a
   number always stands over the sector it names.

   `numTrack` is the wheel they are currently reading. It changes the moment a
   hand takes hold of the other one — on the grab, not on the release, because
   by then the numbers are already being watched. If the two wheels stand at
   different angles that change is a jump, so the ring dips out and comes back
   in its new place rather than sliding round to it: a slide would read as the
   numbers turning of their own accord, which is the one thing they must never
   look like they are doing. */
const NUM_RING_R = 382;        // numeral centres, in user units
const NUM_SWITCH_MS = 180;     // matches the opacity transition in .num-ring
let numTrack = 'outer';        // the wheel the numbers are reading
let numPending = null;         // the one they are on their way to, mid-fade
let numSwitchTimer = null;

function buildNumRing() {
  numRingG.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'wheel-num');
    t.dataset.index = i;
    t.setAttribute('transform', `rotate(${i * STEP}, ${CX}, ${CY})`);
    t.setAttribute('x', CX);
    t.setAttribute('y', CY - NUM_RING_R);
    t.setAttribute('dominant-baseline', 'central');
    t.textContent = i + 1;
    numRingG.appendChild(t);
  }
}

function turnNumRing() {
  numRingG.setAttribute('transform',
    `rotate(${state[numTrack].angle}, ${CX}, ${CY})`);
}

function trackNumRing(ring) {
  if (ring === (numPending ?? numTrack)) return;    // already going there
  /* Whatever was in flight is over: the hand moved again. Taking hold of the
     wheel the ring is already on, mid-fade, has to land here too — otherwise
     the pending switch fires afterwards and carries the numbers off to the
     wheel nobody is touching. */
  clearTimeout(numSwitchTimer);
  numPending = null;
  /* Both wheels on the same notch: nothing would move, so there is nothing to
     hide — the ring just changes what it is following. */
  if (Math.abs(state[ring].angle - state[numTrack].angle) < .01 || reduceMotion()) {
    numTrack = ring;
    numRingG.classList.remove('switching');
    turnNumRing();
    return;
  }
  numPending = ring;
  numRingG.classList.add('switching');
  numSwitchTimer = setTimeout(() => {
    numTrack = ring;                    // the numbers move while they are out
    numPending = null;
    turnNumRing();
    numRingG.classList.remove('switching');
  }, NUM_SWITCH_MS);
}

buildNumRing();
turnNumRing();

/* The book's formula: LP1 + LP2 - 1, wrapped at 12 (0-based here). */
function resultLP(pIdx, eIdx) {
  return (pIdx + eIdx) % 12;
}

/* SVG has no z-index: the selected segment's wider halo would be painted over
   by the sectors drawn after it, so lift it and its label to the end of the
   ring group. */
const raised = { outer: -1, inner: -1 };
function raiseActive(group, ring, idx) {
  if (raised[ring] === idx) return;
  raised[ring] = idx;
  group.querySelectorAll(`[data-index="${idx}"]`)
    .forEach(el => group.appendChild(el));
}

const hubEl = document.getElementById('hub');

function updateHub() {
  if (isPcBase()) { updatePcBase(); return; }   // PC reads the result off the base, not the hub
  const p = selectedIndex('outer');
  const e = selectedIndex('inner');
  const r = resultLP(p, e);
  hubEl.style.setProperty('--result-color', LP_COLORS[r % 4]);
  raiseActive(outerG, 'outer', p);
  raiseActive(innerG, 'inner', e);
  outerG.querySelectorAll('.sector-outer').forEach(el =>
    el.classList.toggle('active', +el.dataset.index === p));
  outerG.querySelectorAll('.label-outer').forEach(el =>
    el.classList.toggle('active-label', +el.dataset.index === p));
  innerG.querySelectorAll('.sector-inner').forEach(el =>
    el.classList.toggle('active', +el.dataset.index === e));
  innerG.querySelectorAll('.label-inner').forEach(el =>
    el.classList.toggle('active-label', +el.dataset.index === e));

  /* On the base, light the principle wedge that mirrors the selected person. */
  baseSvg?.querySelectorAll('.base-wedge').forEach(el =>
    el.classList.toggle('active', +el.dataset.index === p));

  writeResult(REFLECT[lang](LP()[e].area, LP()[p].label, r + 1));
}

/* ---- The result inside the ball ---------------------------------------
   Same rules as the sectors — atoms, hyphenation, largest size that fits —
   against a circle instead of a wedge. A line's room here depends on how far
   it sits from the middle: (w/2)² + y² ≤ limit², so the middle lines may run
   wide while the top and bottom ones must be short. That is what fills a
   circle, and it is why the breaks are searched per line rather than left to
   the browser's wrapping. */
const resultEl = document.getElementById('resultText');
const readMoreEl = document.getElementById('readMoreBtn');
/* Budget: LEAD + BUDGET + the .34s each letter takes ≈ 940ms, so the sentence
   is always fully formed inside a second however long it is. */
const LETTER_MS = 17, LETTER_LEAD = 60, LETTER_BUDGET = 540;
const FIT_MARGIN = .93;      // fraction of the radius the text may reach
const FIT_SAFETY = .98;      // canvas advance vs. rendered inline-blocks
const FIT_LH = 1.24;         // line height, matching the CSS
const FIT_MAXLINES = 6;

/* Canvas measurement: no layout at all, and it reads the element's real font.
   Built once per fit — the style read is the expensive part, not measureText. */
let hubCtx = null;
function hubMeasureFn() {
  const cs = getComputedStyle(resultEl);
  if (!hubCtx) hubCtx = document.createElement('canvas').getContext('2d');
  hubCtx.font = `${cs.fontStyle} ${cs.fontWeight} 100px ${cs.fontFamily}`;
  const cache = new Map();
  return t => {
    if (!cache.has(t)) cache.set(t, hubCtx.measureText(t).width);
    return cache.get(t);
  };
}

/* Greedily fill `limits.length` lines, each with its own width allowance.
   Returns null if the atoms do not all land inside them. */
function fillLines(atoms, size, limits, measure) {
  const lines = [];
  let from = 0;
  for (let j = 0; j < limits.length && from < atoms.length; j++) {
    let to = from + 1, line = lineOf(atoms, from, to, measure);
    while (to < atoms.length) {
      const next = lineOf(atoms, from, to + 1, measure);
      if (next.w * size / 100 > limits[j]) break;
      line = next; to++;
    }
    if (line.w * size / 100 > limits[j]) return null;   // one atom already too wide
    lines.push(line);
    from = to;
  }
  return from >= atoms.length ? lines : null;
}

/* Width available to each of `n` lines, given the button parked underneath. */
function hubLimits(n, size, limit, btnH, gap) {
  const lead = FIT_LH * size;
  const total = n * lead + (btnH ? gap + btnH : 0);
  const limits = [];
  for (let j = 0; j < n; j++) {
    const y = -total / 2 + lead * (j + .5);
    const far = Math.abs(y) + lead / 2;                 // the line's outer edge
    const room = limit * limit - far * far;
    if (room <= 0) return null;
    limits.push(2 * Math.sqrt(room) * FIT_SAFETY);
  }
  return { limits, total };
}

function fitHubBlock(text, R) {
  const limit = R * FIT_MARGIN;
  const gap = parseFloat(getComputedStyle(hubEl).rowGap) || 0;
  const btnW = readMoreEl.offsetWidth, btnH = readMoreEl.offsetHeight;
  const measure = hubMeasureFn();
  const plain = atomize(text, false, measure);
  const hyph = atomize(text, true, measure);

  const attempt = (atoms, size) => {
    for (let n = 1; n <= FIT_MAXLINES; n++) {
      const shape = hubLimits(n, size, limit, btnH, gap);
      if (!shape) continue;
      // the button sits at the bottom of the stack and must clear the rim too
      if ((btnW / 2) ** 2 + (shape.total / 2) ** 2 > limit * limit) continue;
      const lines = fillLines(atoms, size, shape.limits, measure);
      if (lines) return lines;
    }
    return null;
  };
  const search = atoms => {
    let lo = R * .05, hi = R * .34, at = null;
    for (let i = 0; i < 12; i++) {
      const mid = (lo + hi) / 2;
      const lines = attempt(atoms, mid);
      if (lines) { lo = mid; at = lines; } else hi = mid;
    }
    return at ? { size: lo, lines: at } : null;
  };

  const plainFit = search(plain);
  const hyphFit = search(hyph);
  // hyphenation only earns its keep if it buys real size
  if (hyphFit && (!plainFit || hyphFit.size > plainFit.size * HYPH_GAIN)) return hyphFit;
  return plainFit || { size: R * .05, lines: [{ text }] };
}

/* Sets the hub text one letter at a time, on the lines the fit chose. */
let resultText = '';
function writeResult(text) {
  resultText = text;
  const R = Math.min(hubEl.clientWidth, hubEl.clientHeight) / 2;
  if (!R) return;
  const fit = fitHubBlock(text, R);
  resultEl.style.fontSize = fit.size.toFixed(2) + 'px';

  /* The cadence is derived, not fixed: a long sentence tightens its stagger so
     the whole reveal always lands inside LETTER_BUDGET. */
  const ticks = text.replace(/\s+/g, ' ').length;
  const gap = Math.min(LETTER_MS, LETTER_BUDGET / Math.max(1, ticks - 1));
  const frag = document.createDocumentFragment();
  let i = 0;
  fit.lines.forEach(line => {
    const row = document.createElement('span');
    row.className = 'line';
    /* Spans are built even when motion is reduced — the CSS drops the
       animation and they simply render. */
    for (const ch of line.text) {
      const letter = document.createElement('span');
      letter.className = 'ch';
      letter.textContent = ch;
      letter.style.animationDelay = (LETTER_LEAD + i++ * gap).toFixed(1) + 'ms';
      row.appendChild(letter);
    }
    frag.appendChild(row);
  });
  resultEl.textContent = '';
  resultEl.appendChild(frag);
}

function fitHubText() { if (resultText) writeResult(resultText); }

let fitRaf = null;
let lastPc = matchMedia('(min-width: 900px)').matches;
window.addEventListener('resize', () => {
  if (fitRaf) cancelAnimationFrame(fitRaf);
  fitRaf = requestAnimationFrame(() => {
    const pc = matchMedia('(min-width: 900px)').matches;
    if (pc !== lastPc) {           // crossing the breakpoint swaps the wheel renderer
      lastPc = pc;
      document.getElementById('uiSubtitle').textContent = pc ? T().pcSubtitle : T().subtitle;
      buildRing(outerG, 'outer');
      applyRotation('outer');
    }
    fitHubText();
    buildBaseSectors();
    updateHub();
    updateMobileCorrespondences(numTrack, true);
  });
});
/* ================= ROTATION MOTION ================= */

const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Settling after a drag: run out and ease into the notch with a hint of overshoot. */
function easeSettle(t) {
  const b = 1.1, u = t - 1;
  return 1 + (b + 1) * u * u * u + b * u * u;
}
/* A stepped turn: the wheel winds back a touch, rolls forward, rocks into place. */
function easeRoll(t) {
  const WIND = .18, back = 1.2;
  if (t < WIND) return -0.055 * Math.sin((t / WIND) * Math.PI / 2);
  const u = (t - WIND) / (1 - WIND) - 1;
  return -0.055 + 1.055 * (1 + (back + 1) * u * u * u + back * u * u);
}

const isSmall = () => matchMedia('(max-width: 520px)').matches;

/* While a wheel is in motion the page goes into a lighter drawing mode
   (see `body.spinning` in the CSS): on phones the neon halos are the most
   expensive thing on screen, and re-rasterising 24 of them every frame is what
   made the turn stutter. Both rings can move at once, so the flag is counted —
   but counted by *asking the rings*, never by incrementing. A ref count that
   drifts up by one (a second finger landing mid-drag used to do exactly that)
   sticks the page in the cheap drawing mode for the rest of the session, which
   costs the halos and silences the marker with nothing on screen to explain
   why. Derived state cannot drift. */
let spinners = 0;
function setSpinning() {
  spinners = (state.outer.spinning ? 1 : 0) + (state.inner.spinning ? 1 : 0);
  document.body.classList.toggle('spinning', spinners > 0);
}
function beginSpin(s) { s.spinning = true;  setSpinning(); }
function endSpin(s)   { s.spinning = false; setSpinning(); }

function animateTo(ring, target, dur, ease) {
  const s = state[ring];
  if (s.raf) cancelAnimationFrame(s.raf);
  s.target = target;
  const from = s.angle, delta = target - from;
  const finish = () => {
    s.raf = null; s.target = null; endSpin(s);
    s.angle = target; applyRotation(ring); updateHub();
  };
  if (!delta || reduceMotion()) { finish(); return; }
  beginSpin(s);
  const t0 = performance.now();
  s.raf = requestAnimationFrame(function tick(now) {
    const t = Math.min((now - t0) / dur, 1);
    s.angle = from + delta * ease(t);
    applyRotation(ring);
    if (t < 1) s.raf = requestAnimationFrame(tick);
    else finish();
  });
}

function snap(ring) {
  animateTo(ring, Math.round(state[ring].angle / STEP) * STEP,
            isSmall() ? 320 : 420, easeSettle);
}

/* One notch in `dir`, queued off the pending target so rapid presses stack.
   Buttons and arrow keys come through here, so this is where they hand the
   counting ring over — the same way a hand on the wheel does. */
function step(ring, dir) {
  const s = state[ring];
  showMobileCorrespondences(ring);
  trackNumRing(ring);
  const base = s.target != null ? s.target : Math.round(s.angle / STEP) * STEP;
  animateTo(ring, base + STEP * dir, isSmall() ? 420 : 560, easeRoll);
}


/* ================= DRAG + TAP ================= */

let drag = null;

function eventInfo(ev) {
  const rect = svg.getBoundingClientRect();
  const scale = 700 / rect.width;
  const x = (ev.clientX - rect.left) * scale - CX;
  const y = (ev.clientY - rect.top) * scale - CY;
  return { angle: Math.atan2(y, x) * 180 / Math.PI, dist: Math.hypot(x, y) };
}

svg.addEventListener('pointerdown', ev => {
  if (drag) return;                     // one finger turns the wheel; ignore the rest
  const { angle, dist } = eventInfo(ev);
  let ring = null;
  if (isPcBase()) {
    // one wheel on the base: the whole disc turns the person ring
    if (dist <= OUTER_R2 + 8) ring = 'outer';
  } else {
    if (dist >= INNER_R1 && dist < OUTER_R1) ring = 'inner';
    else if (dist >= OUTER_R1 && dist <= OUTER_R2 + 6) ring = 'outer';
  }
  if (!ring) return;
  /* Claim the very first press before the browser can turn it into native SVG
     text selection or an image drag. Rotation must not require a prior click. */
  ev.preventDefault();
  const s = state[ring];
  if (s.raf) { cancelAnimationFrame(s.raf); s.raf = null; s.target = null; }
  trackNumRing(ring);                 // the numbers belong to whatever is held
  beginSpin(s);                       // dragging is motion too — keep it light
  drag = { ring, lastAngle: angle, startX: ev.clientX, startY: ev.clientY, moved: false };
  svg.setPointerCapture(ev.pointerId);
});

svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  if (Math.hypot(ev.clientX - drag.startX, ev.clientY - drag.startY) > 6) drag.moved = true;
  if (!drag.moved) return;
  showMobileCorrespondences(drag.ring);
  const { angle } = eventInfo(ev);
  let delta = angle - drag.lastAngle;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;
  state[drag.ring].angle += delta;
  drag.lastAngle = angle;
  applyRotation(drag.ring);
});

function endDrag(ev) {
  if (!drag) return;
  if (drag.moved) {
    snap(drag.ring);                  // hands the spin flag over to the settle
  } else {
    endSpin(state[drag.ring]);
    // Treat as a tap: identify the sector under the finger and open its card
    const { angle } = eventInfo(ev);
    const fromTop = (angle + 90 + 360) % 360;
    const idx = ((Math.round((fromTop - state[drag.ring].angle) / STEP) % 12) + 12) % 12;
    openCategoryModal(idx, drag.ring);
  }
  drag = null;
}
svg.addEventListener('pointerup', endDrag);
/* Any way the gesture can end without a pointerup — the browser taking the
   touch for a scroll, the finger leaving the surface, capture lost to another
   element — has to put the ring down too, or it stays "in motion" forever. */
function abortDrag() {
  if (!drag) return;
  if (drag.moved) snap(drag.ring); else endSpin(state[drag.ring]);
  drag = null;
}
svg.addEventListener('pointercancel', abortDrag);
svg.addEventListener('lostpointercapture', abortDrag);

document.querySelectorAll('.control-block button').forEach(btn => {
  btn.addEventListener('click', () => {
    step(btn.dataset.ring, +btn.dataset.dir);
  });
});

/* Keyboard: ←/→ rotate the outer wheel, ↑/↓ rotate the inner wheel */
document.addEventListener('keydown', ev => {
  if (overlay.classList.contains('open')) return;      // let Esc handler manage the modal
  const map = {
    ArrowLeft:  ['outer',  1],
    ArrowRight: ['outer', -1],
    ArrowUp:    ['inner', -1],
    ArrowDown:  ['inner',  1]
  };
  const m = map[ev.key];
  if (!m) return;
  ev.preventDefault();
  step(m[0], m[1]);
});

/* ================= LANGUAGE ================= */

function initialLanguage() {
  try {
    const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
    if (SUPPORTED_LANGUAGES.includes(saved)) return saved;
  } catch (e) {
    // Storage can be unavailable in private or locked-down browser contexts.
  }

  const preferences = navigator.languages?.length
    ? navigator.languages
    : [navigator.language];
  for (const preference of preferences) {
    const primary = String(preference || '').toLowerCase().split(/[-_]/)[0];
    if (SUPPORTED_LANGUAGES.includes(primary)) return primary;
  }
  return 'en';
}

function saveLanguage(language) {
  try {
    localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
  } catch (e) {
    // The language still changes for this visit when storage is unavailable.
  }

function showDemoBalloon(text, el, placement = 'auto', meta = {}) {
  if (!text || !el || !demoBalloon) return;
  const target = el.getBoundingClientRect();
  const useRight = placement === 'right';
  const half = Math.min(240, (window.innerWidth - 16) / 2);
  const x = useRight ? target.right : Math.max(half + 8, Math.min(window.innerWidth - half - 8, target.left + target.width / 2));
  const below = !useRight && target.top < 135;
  demoBalloon.textContent = '';
  const metaLine = document.createElement('span');
  metaLine.className = 'balloon-meta';
  const icon = document.createElement('span');
  icon.className = 'balloon-icon';
  icon.setAttribute('aria-hidden', 'true');
  icon.textContent = ({ guide:'➜', person:'♟', event:'✧', relationship:'↔', result:'✦' })[meta.kind] || '✧';
  const metaText = document.createElement('span');
  const labels = BALLOON_META[lang];
  const label = labels[meta.kind] || labels.guide;
  metaText.textContent = meta.step && meta.total
    ? `${label} · ${labels.step} ${meta.step}/${meta.total}`
    : label;
  metaLine.append(icon, metaText);
  const message = document.createElement('span');
  message.className = 'balloon-message';
  /* Give principle references a typographic highlight in every supported
     language without baking presentation markup into the translations. */
  const emphasisPattern = /\b\d+(?:st|nd|rd|th|\.(?=\s)|-[\p{L}]+)?\s+(?:principle|Prinzip|принцип[\p{L}]*)/giu;
  let cursor = 0;
  for (const match of text.matchAll(emphasisPattern)) {
    message.append(document.createTextNode(text.slice(cursor, match.index)));
    const emphasis = document.createElement('span');
    emphasis.className = 'balloon-emphasis';
    emphasis.textContent = match[0];
    message.append(emphasis);
    cursor = match.index + match[0].length;
  }
  message.append(document.createTextNode(text.slice(cursor)));
  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'tutorial-close';
  close.setAttribute('aria-label', 'Close tutorial');
  close.textContent = '×';
  close.addEventListener('click', ev => {
    ev.stopPropagation();
    interruptGuidedDemo(false);
  });
  const prompt = document.createElement('span');
  prompt.className = 'continue';
  prompt.textContent = DEMO_TEXT[lang].continue;
  demoBalloon.append(close, metaLine, message, prompt);
  demoBalloon.classList.toggle('below', below);
  demoBalloon.classList.toggle('right', useRight);
  let top = useRight ? target.top + target.height / 2 : (below ? target.bottom : target.top);
  if (useRight) {
    const halfHeight = demoBalloon.offsetHeight / 2;
    const unclampedTop = top;
    top = Math.max(halfHeight + 8, Math.min(window.innerHeight - halfHeight - 8, top));
    const renderedTop = top - halfHeight;
    const arrowTop = Math.max(12, Math.min(demoBalloon.offsetHeight - 12, unclampedTop - renderedTop));
    demoBalloon.style.setProperty('--arrow-top', `${arrowTop}px`);
  } else {
    demoBalloon.style.removeProperty('--arrow-top');
  }
  demoBalloon.style.left = x + 'px';
  demoBalloon.style.top = top + 'px';
  demoBalloon.classList.add('on');
}

/* Underline the first occurrence of `word` inside `container` (an SVG
   foreignObject with the principle's HTML text). Returns the highlighted span. */
function underlineWordIn(container, word) {
  if (!container || !word) return null;
  const lower = String(word).toLowerCase();
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    const idx = node.nodeValue.toLowerCase().indexOf(lower);
    if (idx === -1) continue;
    try {
      const range = document.createRange();
      range.setStart(node, idx);
      range.setEnd(node, idx + word.length);
      const span = document.createElement('span');
      span.className = 'demo-underline';
      range.surroundContents(span);
      return span;
    } catch (e) { return null; }
  }
  return null;
}
/* Light a chosen principle's whole text block and underline its driving word.
   Returns the highlighted word so the guide popup can point directly to it. */
function demoHighlightPrinciple(index, word) {
  const fo = baseSvg?.querySelector(`foreignObject[data-index="${index}"]`);
  if (!fo) return null;
  fo.querySelector('.bs-box')?.classList.add('demo-lit');
  return underlineWordIn(fo, word);
}

  baseSvg?.querySelectorAll('.bs-box.demo-lit').forEach(el => el.classList.remove('demo-lit'));
  document.querySelectorAll('.demo-underline').forEach(s => {
    const parent = s.parentNode; if (!parent) return;
    while (s.firstChild) parent.insertBefore(s.firstChild, s);
    parent.removeChild(s);
    parent.normalize();
  });
}

  return value || row;
}

function renderDemoChooser() {
  const copy = DEMO_TEXT[lang];
  document.getElementById('guideBtn').setAttribute('aria-label', copy.open);
  document.getElementById('demoEyebrow').textContent = copy.eyebrow;
  document.getElementById('demoTitle').textContent = copy.title;
  demoOptions.textContent = '';
  Object.keys(DEMO_EXAMPLES).forEach(key => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'demo-option';
    button.dataset.demo = key;
    button.textContent = copy[key];
    button.addEventListener('click', () => startGuidedDemo(key));
    demoOptions.appendChild(button);
  });
}

function showDemoChooser() {
  clearDemoTimers();
  clearDemoVisuals();
  hideMobileCorrespondences();
  hideWheelGestureHint();
  document.body.classList.remove('intro-running');
  renderDemoChooser();
  demoOverlay.classList.add('open');
  demoOptions.querySelector('button')?.focus();
}

function resetWheelsToOne() {
  animateTo('outer', 0, 850, easeSettle);
  animateTo('inner', 0, 850, easeSettle);
}

function interruptGuidedDemo(showChooser = true) {
  clearDemoTimers();
  demoActive = false;
  activeDemoKey = null;
  clearDemoVisuals();
  hideMobileCorrespondences();
  overlay.classList.remove('open');
  demoOverlay.classList.remove('open');
  document.body.classList.remove('intro-running');
  resetWheelsToOne();
  if (showChooser) demoLater(showDemoChooser, 300);
  else showWheelGestureHint();
}

function closeDemoChooser() {
  interruptGuidedDemo(false);
}

function showGuideNudge() {
  clearDemoTimers();
  clearDemoVisuals();
  document.body.classList.remove('intro-running');
  const guide = document.getElementById('guideBtn');
  guide.classList.add('attention');
  presentDemoStep(DEMO_GUIDE[lang].nudge, guide, openGuideOnDemand, 'right', true, false, { kind:'guide' });
}

function waitForTutorialResultClose() {
  const modal = overlay.querySelector('.modal');
  modal.scrollTop = 0;
  demoLater(() => {
    if (!demoActive || !overlay.classList.contains('open')) return;
    const close = document.getElementById('closeModal');
    const hint = document.getElementById('resultCloseHint');
    close?.classList.add('demo-close-suggest');
    if (hint) {
      hint.textContent = DEMO_TEXT[lang].closeResult;
      hint.classList.add('show');
    }
  }, 15000);
}

function runDesktopGuidedExample(key, { person, event }) {
  const result = resultLP(person, event);
  const copy = DEMO_GUIDE[lang][key];
  const words = (DEMO_WORDS[lang] && DEMO_WORDS[lang][key]) || {};
  animateTo('outer', -person * STEP, 1100, easeRoll);

  const personBase = baseSvg?.querySelector(`.base-wedge[data-index="${person}"]`);
  const eventBase  = baseSvg?.querySelector(`.base-wedge[data-index="${event}"]`);

  const showResult = () => {
    clearDemoHighlights();
    focusDemoWheelSector(person);
    demoLater(() => {
      const resultWedge = baseSvg?.querySelector(`.base-wedge[data-index="${result}"]`);
      resultWedge?.classList.add('demo-result');
      baseSvg?.querySelector(`foreignObject[data-index="${result}"] .bs-box`)?.classList.add('demo-lit');
      presentDemoStep(copy.result, resultWedge, viaTarget => {
        if (!viaTarget) resultWedge?.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        demoLight?.classList.remove('on');
        const modal = overlay.querySelector('.modal');
        if (modal) modal.scrollTop = 0;
        waitForTutorialResultClose();
      }, 'auto', true, true, { kind:'result', step:4, total:4 });
    }, 950);
  };
  /* Step 3: connect the event principle on the base to the same numbered
     principle on the wheel before revealing the resulting principle. */
  const showRelationship = () => {
    clearDemoHighlights();
    focusDemoWheelSector(event);
    const wheelNumber = outerG.querySelector(`.wheel-num-pc[data-index="${event}"]`);
    presentDemoStep(copy.relationship, wheelNumber || outerG.querySelector(`.sector-outer[data-index="${event}"]`), showResult, 'auto', true, false, { kind:'relationship', step:3, total:4 });
  };
  /* Step 2: light the event principle's text block and underline its word. */
  const showEvent = () => {
    clearDemoHighlights();
    const highlightedWord = demoHighlightPrinciple(event, words.ew);
    presentDemoStep(copy.event, highlightedWord || eventBase, showRelationship, 'auto', !highlightedWord, false, { kind:'event', step:2, total:4 });
  };
  /* Step 1: light the person principle's text block and underline its word. */
  demoLater(() => {
    const highlightedWord = demoHighlightPrinciple(person, words.pw);
    presentDemoStep(copy.person, highlightedWord || personBase, showEvent, 'auto', !highlightedWord, false, { kind:'person', step:1, total:4 });
  }, 1300);
}

function runMobileGuidedExample(key, { person, event }) {
  const copy = DEMO_GUIDE[lang][key];
  const mobileCopy = MOBILE_DEMO_GUIDE[lang]?.[key] || copy;
  const words = (DEMO_WORDS[lang] && DEMO_WORDS[lang][key]) || {};
  animateTo('outer', -person * STEP, 1050, easeRoll);
  const stage = document.getElementById('stage');
  const panel = document.getElementById('correspondencePanel');
  const eventField = key === 'siblingChild' ? 'people' : 'keys';

  const showResult = () => {
    clearDemoHighlights();
    document.querySelectorAll('#correspondencePanel .demo-focus').forEach(el => el.classList.remove('demo-focus'));
    stage?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    focusDemoWheelSector(person, 'outer', false);
    demoLater(() => {
      hubEl.classList.add('demo-result');
      const readMoreButton = document.getElementById('readMoreBtn');
      presentDemoStep(mobileCopy.result || copy.result, readMoreButton || hubEl, viaTarget => {
        if (!viaTarget) readMoreButton?.click();
        demoLight?.classList.remove('on');
        const modal = overlay.querySelector('.modal');
        if (modal) modal.scrollTop = 0;
        waitForTutorialResultClose();
      }, 'auto', false, true, { kind:'result', step:3, total:3 });
    }, 950);
  };
  const showEvent = () => {
    clearDemoHighlights();
    focusDemoWheelSector(event, 'inner', false);
    showMobileCorrespondences('inner', true);
    panel?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    demoLater(() => {
      const correspondence = focusDemoCorrespondence(eventField, false);
      const highlightedWord = underlineWordIn(correspondence, words.ew);
      presentDemoStep(mobileCopy.event, highlightedWord || correspondence, showResult, 'auto', false, false, { kind:'event', step:2, total:3 });
    }, 650);
  };
  const rotateEvent = () => {
    demoBalloon.classList.remove('on');
    clearDemoHighlights();
    document.querySelectorAll('#correspondencePanel .demo-focus').forEach(el => el.classList.remove('demo-focus'));
    stage?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    demoLater(() => {
      animateTo('inner', -event * STEP, 1050, easeRoll);
      demoLater(showEvent, 1250);
    }, 500);
  };
  demoLater(() => {
    focusDemoWheelSector(person, 'outer', false);
    showMobileCorrespondences('outer', true);
    panel?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    demoLater(() => {
      const correspondence = focusDemoCorrespondence('people', false);
      const highlightedWord = underlineWordIn(correspondence, words.pw);
      presentDemoStep(mobileCopy.person, highlightedWord || correspondence, rotateEvent, 'auto', false, false, { kind:'person', step:1, total:3 });
    }, 650);
  }, 1250);
}

function runGuidedExample(key, example) {
  if (isPcBase()) runDesktopGuidedExample(key, example);
  else runMobileGuidedExample(key, example);
}

function startGuidedDemo(key) {
  const example = DEMO_EXAMPLES[key];
  if (!example) return;
  clearDemoTimers();
  clearDemoVisuals();
  hideMobileCorrespondences();
  hideWheelGestureHint();
  demoOverlay.classList.remove('open');
  document.body.classList.add('intro-running');
  demoActive = true;
  activeDemoKey = key;
  runGuidedExample(key, example);
}

function openGuideOnDemand() {
  if (demoActive) {
    interruptGuidedDemo(true);
    return;
  }
  clearDemoTimers();
  clearDemoVisuals();
  document.body.classList.remove('intro-base-away', 'intro-wheel-away', 'intro-wheel-landing', 'intro-wheel-geometry-away', 'intro-wheel-colors-away', 'intro-wheel-copy-away', 'intro-wheel-sun', 'intro-selection-away', 'intro-running');
  showDemoChooser();
}

document.getElementById('guideBtn').addEventListener('click', openGuideOnDemand);
demoBalloon.addEventListener('click', () => advanceDemoBalloon());
demoBalloon.addEventListener('keydown', ev => {
  if (ev.target !== demoBalloon) return;
  if (ev.key === 'Enter' || ev.key === ' ') {
    ev.preventDefault();
    advanceDemoBalloon();
  }
});
demoBalloon.addEventListener('animationend', () => demoBalloon.classList.remove('insist'));
document.addEventListener('pointerdown', ev => {
  if (!balloonAdvance || demoBalloon.contains(ev.target)) return;
  if (ev.target.closest && ev.target.closest('#guideBtn')) return;
  if (balloonInteractiveTarget?.contains(ev.target)) {
    advanceDemoBalloon(true);
    return;
  }
  ev.preventDefault();
  ev.stopPropagation();
  insistOnDemoBalloon();
}, true);
document.getElementById('closeDemo').addEventListener('click', closeDemoChooser);
demoOverlay.addEventListener('click', ev => { if (ev.target === demoOverlay) closeDemoChooser(); });
document.getElementById('closeModal').addEventListener('click', () => {
  if (demoActive && !demoCompleting) interruptGuidedDemo(true);
});
overlay.addEventListener('click', ev => {
  if (ev.target === overlay && demoActive && !demoCompleting) interruptGuidedDemo(true);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && demoOverlay.classList.contains('open')) closeDemoChooser();
  else if (ev.key === 'Escape' && demoActive && !demoCompleting) interruptGuidedDemo(true);
});

/* Desktop introduction: land the wheel first. Once it settles, draw principles
   1→12 from their wheel-side breakpoints out toward the viewport edges, then
   reveal the copy and selected sector. */
function scheduleLandingIntro() {
  if (!isPcBase()) {
    document.body.classList.remove('intro-base-away', 'intro-wheel-away', 'intro-wheel-landing', 'intro-wheel-geometry-away', 'intro-wheel-colors-away', 'intro-wheel-copy-away', 'intro-wheel-sun', 'intro-selection-away', 'intro-running');
    demoLater(showGuideNudge, 650);
    return;
  }
  if (reduceMotion()) {
    document.body.classList.remove('intro-base-away', 'intro-wheel-away', 'intro-wheel-landing', 'intro-wheel-geometry-away', 'intro-wheel-colors-away', 'intro-wheel-copy-away', 'intro-wheel-sun', 'intro-selection-away', 'intro-running');
    showGuideNudge();
    return;
  }
  demoLater(() => {
    document.body.classList.remove('intro-wheel-away');
    document.body.classList.add('intro-wheel-landing');
  }, 250);
  demoLater(() => document.body.classList.remove('intro-wheel-geometry-away'), 900);
  demoLater(() => document.body.classList.remove('intro-wheel-colors-away'), 1120);
  demoLater(() => {
    document.body.classList.remove('intro-wheel-landing', 'intro-wheel-copy-away', 'intro-wheel-sun');
  }, 1700);
  demoLater(() => document.body.classList.remove('intro-base-away'), 1850);
  demoLater(() => document.body.classList.remove('intro-selection-away'), 3200);
  demoLater(showGuideNudge, 3400);
}
if (document.readyState === 'complete') scheduleLandingIntro();
else window.addEventListener('load', scheduleLandingIntro, { once: true });

applyLanguage(initialLanguage());
</script>
</body>
</html>
